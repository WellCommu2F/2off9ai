SPLOS/MLSys）的挂名远胜三段水实习；③英语（托福/GRE）大三前解决；④注意政策面：近年部分国家对敏感技术领域（先进芯片、AI）的签证审查趋严，E/F方向（AI芯片/系统）恰好属于审查敏感区，需提前评估目的地政策风险【待核实：各国当年签证政策】。", "n": 212}, {"id": "c52", "vol": 1, "part": "第十一部分 国际路线", "title": "11.3 硕士 / PhD / 就业路线的差异", "page": 32, "kind": "sec", "html": "<p><span class=\"tag an\">行业分析<\/span>硕士（1.5–2年）：适合目标为工业界系统/芯片岗，成本高（美国自费约80–150万人民币，与你”预算敏感”约束冲突，需谨慎）；PhD（5–6年）：全奖覆盖，适合目标为研究型岗位或回国进高校/ 研究院，时间成本大但方向匹配度最高；直接就业：北美端侧岗位（Apple/Qualcomm/Google的端侧团队）通常要求硕士起步。<strong>对预算敏感的你，现实排序通常是：国内保研/考研 → 香港MPhil/PhD（全奖）→ 北美全奖PhD → 自费硕士。<\/strong><\/p>", "text": "【行业分析】硕士（1.5–2年）：适合目标为工业界系统/芯片岗，成本高（美国自费约80–150万人民币，与你”预算敏感”约束冲突，需谨慎）；PhD（5–6年）：全奖覆盖，适合目标为研究型岗位或回国进高校/研究院，时间成本大但方向匹配度最高；直接就业：北美端侧岗位（Apple/Qualcomm/Google的端侧团队）通常要求硕士起步。对预算敏感的你，现实排序通常是：国内保研/考研→香港MPhil/PhD（全奖）→北美全奖PhD→自费硕士。", "n": 221}, {"id": "c53", "vol": 1, "part": "第十二部分 本科四年学习路线（深大2026级EE）", "title": "第十二部分 本科四年学习路线（深大2026级EE）", "page": 32, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c54", "vol": 1, "part": "第十二部分 本科四年学习路线（深大2026级EE）", "title": "12.1 大一：该不该立刻学 Transformer/LLM？", "page": 32, "kind": "sec", "html": "<p><strong>明确回答：不应该，理由如下<span class=\"tag an\">行业分析<\/span>。<\/strong><\/p>\n<p>1. <strong>依赖链不支持<\/strong>：理解 Transformer 需要线性代数（矩阵分解、注意力中的张量运算）、概率论、微积分与 Python/PyTorch 的编程功底。大一上直接啃注意力机制，大概率停留在”能复述概念但无法复现”的虚假掌握。<\/p>\n<p>2. <strong>机会成本高<\/strong>：大一的数学课（高数、线代）与编程课是后续一切方向的公共底座，且<strong>408考研科目（数据结构、计组、OS、计网）恰好分布在大一大二<\/strong>——这两年把课内学扎实，等于同时为保研/考研蓄力。Transformer 晚学一年不损失什么，数学没学扎实则处处受限。<\/p>\n<p>3. <strong>例外<\/strong>：以”玩”的心态低成本接触是可以的——用现成工具（如手机跑一个 llama.cpp、在 ESP32上跑一次关键词识别 demo）建立感性认识，<strong>但不投入系统性时间<\/strong>。<\/p>\n<p><strong>大一真正该做的三件事<\/strong>：①数学+编程（C语言→Python）打到扎实；②低成本硬件实验（见第十四部分，300元以内）；③信息素养——学会读英文论文摘要、用 GitHub、关注2–3个行业信息源。<\/p>", "text": "明确回答：不应该，理由如下【行业分析】。1.依赖链不支持：理解Transformer需要线性代数（矩阵分解、注意力中的张量运算）、概率论、微积分与Python/PyTorch的编程功底。大一上直接啃注意力机制，大概率停留在”能复述概念但无法复现”的虚假掌握。2.机会成本高：大一的数学课（高数、线代）与编程课是后续一切方向的公共底座，且408考研科目（数据结构、计组、OS、计网）恰好分布在大一大二——这两年把课内学扎实，等于同时为保研/考研蓄力。Transformer晚学一年不损失什么，数学没学扎实则处处受限。3.例外：以”玩”的心态低成本接触是可以的——用现成工具（如手机跑一个llama.cpp、在ESP32上跑一次关键词识别demo）建立感性认识，但不投入系统性时间。大一真正该做的三件事：①数学+编程（C语言→Python）打到扎实；②低成本硬件实验（见第十四部分，300元以内）；③信息素养——学会读英文论文摘要、用GitHub、关注2–3个行业信息源。", "n": 434}, {"id": "c55", "vol": 1, "part": "第十二部分 本科四年学习路线（深大2026级EE）", "title": "12.2 四年时间表", "page": 33, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>学期<\/strong><\/th><th><strong>主线任务<\/strong><\/th><th><strong>科研/项目<\/strong><\/th><th><strong>目标产出<\/strong><\/th><\/tr><\/thead><tbody><tr><td>大一上<\/td><td>高数、线代、C语言、电路基础<\/td><td>开发板入门（ESP32/Arduino）；加入硬件类社团<\/td><td>点亮第一个传感器+TinyML demo；GPA站稳<\/td><\/tr><tr><td>大一下<\/td><td>高数、概率论、Python、模电/数电<\/td><td>尝试进实验室（校内课题组打杂也算）<\/td><td>确定是否喜欢硬件动手<\/td><\/tr><tr><td>大二上<\/td><td>数据结构、计组、信号与系统<\/td><td>选定细分方向试错（视觉or 系统 or 芯片）；系统能力大赛等竞赛<\/td><td>1个拿得出手的项目（GitHub可展示）<\/td><\/tr><tr><td>大二下<\/td><td>操作系统、计网（408科目收尾）<\/td><td><strong>关键窗口：争取在实验室产出论文/专利/竞赛奖项<\/strong>；申请中科院深圳先进院/南科大暑期科研<\/td><td>保研筹码初步成型<\/td><\/tr><tr><td>大二暑假<\/td><td>—<\/td><td>自学 MIT 6.5940 或CS231n 级课程；企业训练营<\/td><td>明确硕士方向<\/td><\/tr><tr><td>大三上<\/td><td>专业选修（嵌入式系统/机器学习/体系结构）<\/td><td>深度科研；开始联系目标导师（保研夏令营准备）<\/td><td>论文投稿或顶级竞赛国奖<\/td><\/tr><tr><td>大三下<\/td><td>保研夏令营/考研启动<\/td><td>实习（深圳硬件/机器人公司的嵌入式或部署岗）<\/td><td>offer或导师意向<\/td><\/tr><tr><td>大四<\/td><td>毕设（务必选端侧AI相关题目）<\/td><td>毕设做到可展示水准；补英语（若考虑境外路线）<\/td><td>毕设=求职/升学的代表作<\/td><\/tr><\/tbody><\/table><\/div>", "text": "学期主线任务科研/项目目标产出大一上高数、线代、C语言、电路基础开发板入门（ESP32/Arduino）；加入硬件类社团点亮第一个传感器+TinyMLdemo；GPA站稳大一下高数、概率论、Python、模电/数电尝试进实验室（校内课题组打杂也算）确定是否喜欢硬件动手大二上数据结构、计组、信号与系统选定细分方向试错（视觉or系统or芯片）；系统能力大赛等竞赛1个拿得出手的项目（GitHub可展示）大二下操作系统、计网（408科目收尾）关键窗口：争取在实验室产出论文/专利/竞赛奖项；申请中科院深圳先进院/南科大暑期科研保研筹码初步成型大二暑假—自学MIT6.5940或CS231n级课程；企业训练营明确硕士方向大三上专业选修（嵌入式系统/机器学习/体系结构）深度科研；开始联系目标导师（保研夏令营准备）论文投稿或顶级竞赛国奖大三下保研夏令营/考研启动实习（深圳硬件/机器人公司的嵌入式或部署岗）offer或导师意向大四毕设（务必选端侧AI相关题目）毕设做到可展示水准；补英语（若考虑境外路线）毕设=求职/升学的代表作", "n": 460}, {"id": "c56", "vol": 1, "part": "第十二部分 本科四年学习路线（深大2026级EE）", "title": "12.3 考研 vs 保研 vs 就业的决策节点", "page": 34, "kind": "sec", "html": "<p><span class=\"tag an\">行业分析<\/span>决策时点应设在<strong>大三上结束<\/strong>：若此时你已有论文/国奖+专业排名前5%以内→冲保研（浙大夏令营在每年5–7月）；若成绩中上但科研弱→考研（408底子大一大二已打好）；若发现自己对硬件工程的兴趣远大于科研→直接就业也完全可行（深圳嵌入式+AI岗位对本科生开放，且3年工作经验在制造业赛道的价值不亚于硕士）。<strong>三条路在大三上之前是同一套准备：数学+系统课+项目。<\/strong>这是本路线设计的核心——<strong>延迟决策，但不延迟准备<\/strong>。<\/p>", "text": "【行业分析】决策时点应设在大三上结束：若此时你已有论文/国奖+专业排名前5%以内→冲保研（浙大夏令营在每年5–7月）；若成绩中上但科研弱→考研（408底子大一大二已打好）；若发现自己对硬件工程的兴趣远大于科研→直接就业也完全可行（深圳嵌入式+AI岗位对本科生开放，且3年工作经验在制造业赛道的价值不亚于硕士）。三条路在大三上之前是同一套准备：数学+系统课+项目。这是本路线设计的核心——延迟决策，但不延迟准备。", "n": 205}, {"id": "c57", "vol": 1, "part": "第十三部分 项目路线：五级阶梯", "title": "第十三部分 项目路线：五级阶梯", "page": 34, "kind": "part", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>Level<\/strong><\/th><th><strong>项目<\/strong><\/th><th><strong>学到什么<\/strong><\/th><th><strong>成本<\/strong><\/th><th><strong>建议时点<\/strong><\/th><\/tr><\/thead><tbody><tr><td>L1 入门<\/td><td>ESP32-S3 跑 Edge Impulse 关键词识别/手势识别（<span class=\"cite\">Arm官方教程<\/span>）<\/td><td>数据采集→训练→TFLite部署→MCU推理全流程<\/td><td>板子约10–50元+麦克风模块<\/td><td>大一上<\/td><\/tr><tr><td>L2 进阶<\/td><td>树莓派/Jetson Orin Nano（$249，<span class=\"cite\">DigiKey<\/span>）部署 YOLO 视觉检测，做一个人脸/车牌/垃圾分类系统<\/td><td>Linux嵌入式、模型转换（ONNX→TensorRT）、实时性工程<\/td><td>1500–2500元<\/td><td>大一下–大二上<\/td><\/tr><tr><td>L3 系统<\/td><td>在 RK3588 开发板或二手手机上部署llama.cpp/NCNN 跑Qwen3-0.6B/4B，测量不同量化（Q4/Q8）下的速度-内存-精度权衡，写成技术报告<\/td><td>推理框架、量化、内存带宽的实感——<strong>这直接对应第六部分的高薪岗技能<\/strong><\/td><td>0–1500元<\/td><td>大二上–下<\/td><\/tr><tr><td>L4 研究<\/td><td>复现一篇压缩/系统论文（如SmoothQuant 或StreamingLLM），尝试改进一个点并写消融实验<\/td><td>科研方法论：文献、复现、实验设计、写作<\/td><td>算力成本（Colab/AutoDL，几百元）<\/td><td>大二下–大三<\/td><\/tr><tr><td>L5 综合<\/td><td>软硬协同完整作品：例如”端侧VLM+机器人小车——语音指令→端侧视觉理解→运动控制”，或参加系统能力大赛编译赛道/集创赛<\/td><td>全栈整合+竞赛背书，保研复试的王牌材料<\/td><td>数千元（可申请学校科创经费覆盖）<\/td><td>大三<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>原则<span class=\"tag an\">行业分析<\/span><\/strong>：每一级只在前一级完成后启动；宁可 L3 做扎实，不要 L1–L5 全沾一遍。招聘与保研面试中，<strong>一个讲得出”内存带宽为什么是瓶颈、我怎么测的、怎么优化的”的 L3 项目，胜过五个玩具 demo<\/strong>。<\/p>", "text": "Level项目学到什么成本建议时点L1入门ESP32-S3跑EdgeImpulse关键词识别/手势识别（Arm官方教程）数据采集→训练→TFLite部署→MCU推理全流程板子约10–50元+麦克风模块大一上L2进阶树莓派/JetsonOrinNano（$249，DigiKey）部署YOLO视觉检测，做一个人脸/车牌/垃圾分类系统Linux嵌入式、模型转换（ONNX→TensorRT）、实时性工程1500–2500元大一下–大二上L3系统在RK3588开发板或二手手机上部署llama.cpp/NCNN跑Qwen3-0.6B/4B，测量不同量化（Q4/Q8）下的速度-内存-精度权衡，写成技术报告推理框架、量化、内存带宽的实感——这直接对应第六部分的高薪岗技能0–1500元大二上–下L4研究复现一篇压缩/系统论文（如SmoothQuant或StreamingLLM），尝试改进一个点并写消融实验科研方法论：文献、复现、实验设计、写作算力成本（Colab/AutoDL，几百元）大二下–大三L5综合软硬协同完整作品：例如”端侧VLM+机器人小车——语音指令→端侧视觉理解→运动控制”，或参加系统能力大赛编译赛道/集创赛全栈整合+竞赛背书，保研复试的王牌材料数千元（可申请学校科创经费覆盖）大三原则【行业分析】：每一级只在前一级完成后启动；宁可L3做扎实，不要L1–L5全沾一遍。招聘与保研面试中，一个讲得出”内存带宽为什么是瓶颈、我怎么测的、怎么优化的”的L3项目，胜过五个玩具demo。", "n": 645}, {"id": "c58", "vol": 1, "part": "第十四部分 大一低成本入门（预算敏感专项）", "title": "第十四部分 大一低成本入门（预算敏感专项）", "page": 35, "kind": "part", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>设备<\/strong><\/th><th><strong>用途<\/strong><\/th><th><strong>价格<\/strong>（<strong>2026年10月检索<\/strong>，<strong>中国大陆电商<\/strong>）<\/th><th><strong>性价比评价<\/strong><\/th><\/tr><\/thead><tbody><tr><td>ESP32-S3 开发板<\/td><td>TinyML（关键词识别、传感器ML）<\/td><td>淘宝约10–50元（不同店铺与配置差异大，<span class=\"tag nv\">待核实<\/span>下单前比价）<\/td><td><strong>极高——30元以内即可完整体验”数据→模型→部署”闭环<\/strong><\/td><\/tr><tr><td>Arduino Nano RP2040 /ESP32-S3 Sense<\/td><td>Edge Impulse 官方支持板，含麦克风/IMU<\/td><td>百元左右<\/td><td>高，教程生态最好<\/td><\/tr><tr><td>树莓派 5（8GB）<\/td><td>Linux嵌入式+轻量视觉<\/td><td>约600–900元（<span class=\"tag nv\">待核实<\/span>现货价格波动）<\/td><td>中——生态无敌但算力弱<\/td><\/tr><tr><td>Jetson Orin Nano Super<\/td><td>CUDA/TensorRT 全栈，67 TOPS<\/td><td>官方定价$249（约1800元），国内渠道通常加价<\/td><td>中高——想走NVIDIA技术栈再入<\/td><\/tr><tr><td>RK3588 开发板（香橙派/Radxa）<\/td><td>6 TOPS NPU，国产芯片生态体验<\/td><td>约600–1200元<\/td><td>中高——贴近国内就业市场<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>大一方案（总预算≤300元）<\/strong>：ESP32-S3（约30元）+ 麦克风模块（约15元）+ 杜邦线/面包板（约30元）+ 一本二手《C程序设计语言》。<strong>先用30元验证你对”软硬结合”的兴趣是真实的，再决定要不要花1800元买Jetson<\/strong>——这是预算敏感约束下的最优实验设计。此外：学校实验室与创客空间通常有免费设备；科创竞赛获奖有奖金与经费报销；二手平台（闲鱼）的树莓派/Jetson 价格常为新品的6–7折。<\/p>", "text": "设备用途价格（2026年10月检索，中国大陆电商）性价比评价ESP32-S3开发板TinyML（关键词识别、传感器ML）淘宝约10–50元（不同店铺与配置差异大，【待核实】下单前比价）极高——30元以内即可完整体验”数据→模型→部署”闭环ArduinoNanoRP2040/ESP32-S3SenseEdgeImpulse官方支持板，含麦克风/IMU百元左右高，教程生态最好树莓派5（8GB）Linux嵌入式+轻量视觉约600–900元（【待核实】现货价格波动）中——生态无敌但算力弱JetsonOrinNanoSuperCUDA/TensorRT全栈，67TOPS官方定价$249（约1800元），国内渠道通常加价中高——想走NVIDIA技术栈再入RK3588开发板（香橙派/Radxa）6TOPSNPU，国产芯片生态体验约600–1200元中高——贴近国内就业市场大一方案（总预算≤300元）：ESP32-S3（约30元）+麦克风模块（约15元）+杜邦线/面包板（约30元）+一本二手《C程序设计语言》。先用30元验证你对”软硬结合”的兴趣是真实的，再决定要不要花1800元买Jetson——这是预算敏感约束下的最优实验设计。此外：学校实验室与创客空间通常有免费设备；科创竞赛获奖有奖金与经费报销；二手平台（闲鱼）的树莓派/Jetson价格常为新品的6–7折。", "n": 582}, {"id": "c59", "vol": 1, "part": "第十五部分 学习资源（论文 / 课程 / 工具链 / 社区）", "title": "第十五部分 学习资源（论文 / 课程 / 工具链 / 社区）", "page": 36, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c60", "vol": 1, "part": "第十五部分 学习资源（论文 / 课程 / 工具链 / 社区）", "title": "15.1 论文（12篇，按建议阅读顺序排列）", "page": 36, "kind": "sec", "html": "<p><strong>入门组（大二可读懂主线）<\/strong>：<\/p>\n<p>1. Han et al., Deep Compression（ICLR 2016）——压缩三件套（剪枝+量化+哈夫曼编码）的奠基作（<span class=\"cite\">arXiv:1510.00149<\/span>）<\/p>\n<p>2. Howard et al., MobileNets（2017）——深度可分离卷积，理解”为硬件设计模型”的起点（<span class=\"cite\">arXiv:1 704.04861<\/span>）<\/p>\n<p>3. Banbury et al., MLPerf Tiny Benchmark（NeurIPS 2021 Datasets）——TinyML领域的标准基准（<span class=\"cite\">ar Xiv:2106.07597<\/span>）<\/p>\n<p>4. Lin et al., MCUNet（NeurIPS 2020）——TinyNAS+TinyEngine，MCU上跑ImageNet级推理（<span class=\"cite\">arXiv:2007.10319<\/span>）<\/p>\n<p><strong>进阶组（需先修深度学习与体系结构）<\/strong>：<\/p>\n<p>5. Jacob et al., Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference（CVPR 2018）——INT8量化的工业标准论文（<span class=\"cite\">arXiv:1712.05877<\/span>）<\/p>\n<p>6. Dettmers et al., LLM.int8()（NeurIPS 2022）——大模型量化的转折点（<span class=\"cite\">arXiv:2208.07339<\/span>）<\/p>\n<p>7. Xiao et al., SmoothQuant（ICML 2023）——激活-权重协同平滑，端侧LLM部署常用（<span class=\"cite\">arXiv:221 1.10438<\/span>）<\/p>\n<p>8. Frantar et al., GPTQ（ICLR 2023）——训练后量化到3–4bit的实用方法（<span class=\"cite\">arXiv:2210.17323<\/span>）<\/p>\n<p>9. Xiao et al., StreamingLLM（ICLR 2024）——attention sink与KV Cache流式化，端侧长上下文关键（<span class=\"cite\">arXiv:2309.17453<\/span>）<\/p>\n<p>10. Lin et al., AWQ: Activation-aware Weight Quantization（MLSys 2024）——端侧LLM量化的事实标准之一（<span class=\"cite\">arXiv:2306.00978<\/span>）<\/p>\n<p><strong>系统与视野组<\/strong>：<\/p>\n<p>11. Chen et al., TVM: An Automated End-to-End Optimization Stack for Deep Learning（OSDI 2018）——AI编译器经典（<span class=\"cite\">arXiv:1802.04799<\/span>）<\/p>\n<p>12. Kwon et al., Efficient Memory Management for LLM Serving with PagedAttention (vLLM)（SOSP 2023）——KV Cache管理的代表作，思想正在向端侧迁移（<span class=\"cite\">arXiv:2309.06180<\/span>）<\/p>\n<p><strong>难度说明<\/strong>：入门组只需”线性代数+跑过PyTorch”；进阶组建议配合 MIT 6.5940 课程同步读；系统组需要操作系统与体系结构基础，适合大三。<\/p>", "text": "入门组（大二可读懂主线）：1.Hanetal.,DeepCompression（ICLR2016）——压缩三件套（剪枝+量化+哈夫曼编码）的奠基作（arXiv:1510.00149）2.Howardetal.,MobileNets（2017）——深度可分离卷积，理解”为硬件设计模型”的起点（arXiv:1704.04861）3.Banburyetal.,MLPerfTinyBenchmark（NeurIPS2021Datasets）——TinyML领域的标准基准（arXiv:2106.07597）4.Linetal.,MCUNet（NeurIPS2020）——TinyNAS+TinyEngine，MCU上跑ImageNet级推理（arXiv:2007.10319）进阶组（需先修深度学习与体系结构）：5.Jacobetal.,QuantizationandTrainingofNeuralNetworksforEfficientInteger-Arithmetic-OnlyInference（CVPR2018）——INT8量化的工业标准论文（arXiv:1712.05877）6.Dettmersetal.,LLM.int8()（NeurIPS2022）——大模型量化的转折点（arXiv:2208.07339）7.Xiaoetal.,SmoothQuant（ICML2023）——激活-权重协同平滑，端侧LLM部署常用（arXiv:2211.10438）8.Frantaretal.,GPTQ（ICLR2023）——训练后量化到3–4bit的实用方法（arXiv:2210.17323）9.Xiaoetal.,StreamingLLM（ICLR2024）——attentionsink与KVCache流式化，端侧长上下文关键（arXiv:2309.17453）10.Linetal.,AWQ:Activation-awareWeightQuantization（MLSys2024）——端侧LLM量化的事实标准之一（arXiv:2306.00978）系统与视野组：11.Chenetal.,TVM:AnAutomatedEnd-to-EndOptimizationStackforDeepLearning（OSDI2018）——AI编译器经典（arXiv:1802.04799）12.Kwonetal.,EfficientMemoryManagementforLLMServingwithPagedAttention(vLLM)（SOSP2023）——KVCache管理的代表作，思想正在向端侧迁移（arXiv:2309.06180）难度说明：入门组只需”线性代数+跑过PyTorch”；进阶组建议配合MIT6.5940课程同步读；系统组需要操作系统与体系结构基础，适合大三。", "n": 1194}, {"id": "c61", "vol": 1, "part": "第十五部分 学习资源（论文 / 课程 / 工具链 / 社区）", "title": "15.2 课程", "page": 37, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>课程<\/strong><\/th><th><strong>来源<\/strong><\/th><th><strong>定位<\/strong><\/th><\/tr><\/thead><tbody><tr><td>MIT 6.5940 EfficientML<\/td><td><span class=\"cite\">efficientml.ai<\/span>（视频+slides公开）<\/td><td><strong>本报告最推荐的一门课<\/strong>——压缩/量化/端侧部署全覆盖，大二暑假自学的首选<\/td><\/tr><tr><td>CS231n<\/td><td>Stanford（公开）<\/td><td>视觉与深度学习基础<\/td><\/tr><tr><td>CMU 15-445 / MIT 6.824 等系统课<\/td><td>公开<\/td><td>走E/F方向（系统/编译）的地基<\/td><\/tr><tr><td>全国大学生系统能力大赛（编译系统设计赛）<\/td><td>竞赛<\/td><td>E方向的实战练兵+保研加分<\/td><\/tr><\/tbody><\/table><\/div>", "text": "课程来源定位MIT6.5940EfficientMLefficientml.ai（视频+slides公开）本报告最推荐的一门课——压缩/量化/端侧部署全覆盖，大二暑假自学的首选CS231nStanford（公开）视觉与深度学习基础CMU15-445/MIT6.824等系统课公开走E/F方向（系统/编译）的地基全国大学生系统能力大赛（编译系统设计赛）竞赛E方向的实战练兵+保研加分", "n": 190}, {"id": "c62", "vol": 1, "part": "第十五部分 学习资源（论文 / 课程 / 工具链 / 社区）", "title": "15.3 工具链与社区", "page": 37, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>工具链按方向：TFLite/Edge Impulse（A方向）、NCNN/MNN/ExecuTorch/llama.cpp（B/C方向，全部开源，GitHub可直接跟踪提交动态）、TVM/MLIR（E方向）；社区：GitHub trending、MLSys/SenSys/MobiCom 会议论文、智源/机器之心等中文渠道（注意二手信息需回溯原文）。<\/p>", "text": "【已证实】工具链按方向：TFLite/EdgeImpulse（A方向）、NCNN/MNN/ExecuTorch/llama.cpp（B/C方向，全部开源，GitHub可直接跟踪提交动态）、TVM/MLIR（E方向）；社区：GitHubtrending、MLSys/SenSys/MobiCom会议论文、智源/机器之心等中文渠道（注意二手信息需回溯原文）。", "n": 177}, {"id": "c63", "vol": 1, "part": "第十六部分 12–16周学期计划（大一上，每周3–5小时）", "title": "第十六部分 12–16周学期计划（大一上，每周3–5小时）", "page": 37, "kind": "part", "html": "<p><strong>设计原则<span class=\"tag an\">行业分析<\/span><\/strong>：每周3–5小时是”可持续上限”——超过这个量必然侵蚀高数/线代/C语言的课内时间，得不偿失。计划按14周设计（对应一个学期），留出考试周弹性。<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>周<\/strong><\/th><th><strong>任务<\/strong><\/th><th><strong>产出<\/strong><\/th><\/tr><\/thead><tbody><tr><td>1–2<\/td><td>环境搭建：装好 Arduino IDE / VS Code、Python、Git；注册 GitHub；买板子<\/td><td>开发环境跑通<\/td><\/tr><tr><td>3–4<\/td><td>ESP32基础：GPIO、串口、读取一个传感器（温湿度或IMU）<\/td><td>数据能在串口/屏幕上显示<\/td><\/tr><tr><td>5–6<\/td><td>C语言巩固（结合板子编程）；Python入门（处理刚才采集的数据）<\/td><td>双语言各一个小练习<\/td><\/tr><tr><td>7–9<\/td><td><strong>第一个ML闭环<\/strong>：Edge Impulse 采集关键词语音 → 训练 → 部署到ESP32-S3（按<span class=\"cite\">Arm教程<\/span>）<\/td><td>板子能识别”开灯/关灯”<\/td><\/tr><tr><td>10–11<\/td><td>理解刚才发生了什么：读 MLPerf Tiny 论文的引言+方法概述；搞懂”量化”在做什么<\/td><td>一页纸笔记<\/td><\/tr><tr><td>12–13<\/td><td>改进实验：换自己的唤醒词、测不同模型的延迟与内存占用（像第6ms/12.5KB那样测量）<\/td><td>对比表格<\/td><\/tr><tr><td>14<\/td><td>复盘：写300字总结发GitHub；决定下学期是否继续（L2）<\/td><td>公开仓库<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>判断节点<\/strong>：第14周问自己——“我是更享受让板子动起来（硬件向），还是更享受调模型/看数据（算法向），还是更想知道框架内部怎么工作（系统向）？”这个答案比任何报告都更能指导你大二的方向选择。<\/p>", "text": "设计原则【行业分析】：每周3–5小时是”可持续上限”——超过这个量必然侵蚀高数/线代/C语言的课内时间，得不偿失。计划按14周设计（对应一个学期），留出考试周弹性。周任务产出1–2环境搭建：装好ArduinoIDE/VSCode、Python、Git；注册GitHub；买板子开发环境跑通3–4ESP32基础：GPIO、串口、读取一个传感器（温湿度或IMU）数据能在串口/屏幕上显示5–6C语言巩固（结合板子编程）；Python入门（处理刚才采集的数据）双语言各一个小练习7–9第一个ML闭环：EdgeImpulse采集关键词语音→训练→部署到ESP32-S3（按Arm教程）板子能识别”开灯/关灯”10–11理解刚才发生了什么：读MLPerfTiny论文的引言+方法概述；搞懂”量化”在做什么一页纸笔记12–13改进实验：换自己的唤醒词、测不同模型的延迟与内存占用（像第6ms/12.5KB那样测量）对比表格14复盘：写300字总结发GitHub；决定下学期是否继续（L2）公开仓库判断节点：第14周问自己——“我是更享受让板子动起来（硬件向），还是更享受调模型/看数据（算法向），还是更想知道框架内部怎么工作（系统向）？”这个答案比任何报告都更能指导你大二的方向选择。", "n": 536}, {"id": "c64", "vol": 1, "part": "第十七部分 最终决策矩阵", "title": "第十七部分 最终决策矩阵", "page": 38, "kind": "part", "html": "<p><span class=\"dim\">按你的要求：<\/span><strong>不做总排名，不给”最佳方向”<\/strong><span class=\"dim\">。矩阵仅呈现事实与权衡，选择权重由你自己赋予。<\/span><\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>维度<\/strong><\/th><th><strong>A.TinyML/MCU<\/strong><\/th><th><strong>B. 手机/嵌入式AI<\/strong><\/th><th><strong>C. 端侧LLM/VLM<\/strong><\/th><th><strong>D. 模型压缩<\/strong><\/th><th><strong>E. 推理系统/编译<\/strong>器<\/th><th><strong>F. AI芯片/NPU<\/strong><\/th><\/tr><\/thead><tbody><tr><td>AI替代风险<\/td><td>中低<\/td><td>中<\/td><td>中低<\/td><td>中低<\/td><td>低<\/td><td>低到中<\/td><\/tr><tr><td>岗位总量<\/td><td>小<\/td><td>大<\/td><td>中（增长快）<\/td><td>中小<\/td><td>中小<\/td><td>中<\/td><\/tr><tr><td>应届薪资水位<\/td><td>低–中<\/td><td>中<\/td><td>高<\/td><td>高<\/td><td>高<\/td><td>中–高<\/td><\/tr><tr><td>学历门槛<\/td><td>本科可入行<\/td><td>本科可入行<\/td><td>硕士为主<\/td><td>硕士为主<\/td><td>硕士为主（本科强者例外）<\/td><td>本科可入行（设计岗多硕士）<\/td><\/tr><tr><td>软硬结合程度<\/td><td>极高<\/td><td>高<\/td><td>中<\/td><td>低（偏算法）<\/td><td>中（软硬接口）<\/td><td>极高<\/td><\/tr><tr><td>与深大EE匹配度<\/td><td>高<\/td><td>高<\/td><td>中（需补CS）<\/td><td>中（需补数学）<\/td><td>中（需补CS系统课）<\/td><td>高（EE科班优势）<\/td><\/tr><tr><td>深圳岗位密度<\/td><td>高<\/td><td>高<\/td><td>中<\/td><td>中<\/td><td>中<\/td><td>中（上海更密）<\/td><\/tr><tr><td>长三角岗位密度<\/td><td>中<\/td><td>中<\/td><td>高<\/td><td>高<\/td><td>高<\/td><td>高<\/td><\/tr><tr><td>浙大对口资源<\/td><td>EmNets<\/td><td>EmNets等<\/td><td>ARCLab<\/td><td>（跨组）<\/td><td>ARCLab<\/td><td>微纳电子前沿所<\/td><\/tr><tr><td>行业周期风险<\/td><td>低（小而稳）<\/td><td>中（消费电子周期）<\/td><td>中（叙事波动）<\/td><td>低<\/td><td>低<\/td><td>中高（资本周期+业务线风险）<\/td><\/tr><tr><td>可迁移性<\/td><td>中<\/td><td>高<\/td><td>高<\/td><td>高<\/td><td><strong>最高<\/strong>（系统功底通用）<\/td><td>中（绑定制程生态）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>如何使用这张表<span class=\"tag an\">行业分析<\/span><\/strong>：先选你<strong>最看重的两行<\/strong>（例如”AI替代风险”+“软硬结合程度”），划掉明显不符合的方向；再看剩下方向在”学历门槛”和”岗位密度”上是否与你的约束（预算、读研意愿、城市）冲突。最终留下的2–3个方向，就是下一部分的”低成本实验”要验证的对象。<\/p>", "text": "按你的要求：不做总排名，不给”最佳方向”。矩阵仅呈现事实与权衡，选择权重由你自己赋予。维度A.TinyML/MCUB.手机/嵌入式AIC.端侧LLM/VLMD.模型压缩E.推理系统/编译器F.AI芯片/NPUAI替代风险中低中中低中低低低到中岗位总量小大中（增长快）中小中小中应届薪资水位低–中中高高高中–高学历门槛本科可入行本科可入行硕士为主硕士为主硕士为主（本科强者例外）本科可入行（设计岗多硕士）软硬结合程度极高高中低（偏算法）中（软硬接口）极高与深大EE匹配度高高中（需补CS）中（需补数学）中（需补CS系统课）高（EE科班优势）深圳岗位密度高高中中中中（上海更密）长三角岗位密度中中高高高高浙大对口资源EmNetsEmNets等ARCLab（跨组）ARCLab微纳电子前沿所行业周期风险低（小而稳）中（消费电子周期）中（叙事波动）低低中高（资本周期+业务线风险）可迁移性中高高高最高（系统功底通用）中（绑定制程生态）如何使用这张表【行业分析】：先选你最看重的两行（例如”AI替代风险”+“软硬结合程度”），划掉明显不符合的方向；再看剩下方向在”学历门槛”和”岗位密度”上是否与你的约束（预算、读研意愿、城市）冲突。最终留下的2–3个方向，就是下一部分的”低成本实验”要验证的对象。", "n": 545}, {"id": "c65", "vol": 1, "part": "第十八部分 个人建议（不预设结论版）", "title": "第十八部分 个人建议（不预设结论版）", "page": 39, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c66", "vol": 1, "part": "第十八部分 个人建议（不预设结论版）", "title": "18.1 对你三条标准的诚实检验", "page": 39, "kind": "sec", "html": "<p>1. <strong>“低AI替代风险”<\/strong>：六个方向中没有绝对安全的，但E（推理系统/编译器）与A/F的物理耦合部分处于风险谱系的低位；同时要认清<strong>最大风险不是AI替代而是赛道消失与自身能力不足<\/strong>（第七部分）。<\/p>\n<p>2. <strong>“软硬结合/物理世界兴趣”<\/strong>：A、B、F 及机器人方向强匹配；C、D 本质是软件算法方向——如果你确认自己对物理世界的兴趣是真实的（这正是第十四部分30元实验要验证的），那么 D 作为独立职业方向可能并不适合你，<strong>但D作为技能组件（“会量化的系统工程师”）几乎适用于所有方向<\/strong>。<\/p>\n<p>3. <strong>“深圳/长三角前景”<\/strong>：两地证据链均完整（第五部分），深圳偏硬件整机、长三角偏芯片系统，你的”深大→长三角读研→回深圳”设想在产业地理上是自洽的。<\/p>", "text": "1.“低AI替代风险”：六个方向中没有绝对安全的，但E（推理系统/编译器）与A/F的物理耦合部分处于风险谱系的低位；同时要认清最大风险不是AI替代而是赛道消失与自身能力不足（第七部分）。2.“软硬结合/物理世界兴趣”：A、B、F及机器人方向强匹配；C、D本质是软件算法方向——如果你确认自己对物理世界的兴趣是真实的（这正是第十四部分30元实验要验证的），那么D作为独立职业方向可能并不适合你，但D作为技能组件（“会量化的系统工程师”）几乎适用于所有方向。3.“深圳/长三角前景”：两地证据链均完整（第五部分），深圳偏硬件整机、长三角偏芯片系统，你的”深大→长三角读研→回深圳”设想在产业地理上是自洽的。", "n": 301}, {"id": "c67", "vol": 1, "part": "第十八部分 个人建议（不预设结论版）", "title": "18.2 建议重点验证的2–3个方向", "page": 39, "kind": "sec", "html": "<p>基于你的约束（EE背景、软硬兴趣、预算敏感、目标浙大系），建议将以下方向作为<strong>待验证假设<\/strong>（不是结论）：<\/p>\n<p><strong>假设一：B→C路线（嵌入式AI → 端侧推理系统）<\/strong>。以嵌入式为入口、以推理引擎/部署为进阶。优势：岗位量大、软硬结合、深圳密度高、本科即可起步。验证方式：第十三部分L1→L3 项目链。<\/p>\n<p><strong>假设二：E路线（AI编译器/推理系统）<\/strong>。薪资水位与抗替代性最高、浙大ARCLab对口、且”系统功底”可迁移性最强。代价：学习曲线陡、通常需硕士。验证方式：大二自学 MIT 6.5940 +尝试读 TVM 源码或参加系统能力大赛——能否读得进去，就是过滤器。<\/p>\n<p><strong>假设三：F路线（AI芯片/NPU软硬协同）<\/strong>。EE科班优势最大、微纳电子学院对口、国产化长逻辑。代价：行业周期波动大、岗位集中于上海/北京。验证方式：修数字电路/体系结构课程时观察自己的兴趣浓度；关注集创赛。<\/p>\n<p><strong>不建议作为主攻但值得作为组件的<\/strong>：D（模型压缩——作为技能而非职业）；A（TinyML——作为入门练兵而非终点，市场太小）。<\/p>", "text": "基于你的约束（EE背景、软硬兴趣、预算敏感、目标浙大系），建议将以下方向作为待验证假设（不是结论）：假设一：B→C路线（嵌入式AI→端侧推理系统）。以嵌入式为入口、以推理引擎/部署为进阶。优势：岗位量大、软硬结合、深圳密度高、本科即可起步。验证方式：第十三部分L1→L3项目链。假设二：E路线（AI编译器/推理系统）。薪资水位与抗替代性最高、浙大ARCLab对口、且”系统功底”可迁移性最强。代价：学习曲线陡、通常需硕士。验证方式：大二自学MIT6.5940+尝试读TVM源码或参加系统能力大赛——能否读得进去，就是过滤器。假设三：F路线（AI芯片/NPU软硬协同）。EE科班优势最大、微纳电子学院对口、国产化长逻辑。代价：行业周期波动大、岗位集中于上海/北京。验证方式：修数字电路/体系结构课程时观察自己的兴趣浓度；关注集创赛。不建议作为主攻但值得作为组件的：D（模型压缩——作为技能而非职业）；A（TinyML——作为入门练兵而非终点，市场太小）。", "n": 426}, {"id": "c68", "vol": 1, "part": "第十八部分 个人建议（不预设结论版）", "title": "18.3 未来6–12个月的低成本实验方案", "page": 40, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>时间<\/strong><\/th><th><strong>实验<\/strong><\/th><th><strong>验证什么<\/strong><\/th><th><strong>成本<\/strong><\/th><\/tr><\/thead><tbody><tr><td>第1–3月<\/td><td>第十六部分的14周计划（ESP32+TinyML）<\/td><td>你对”软硬结合”的兴趣是真实还是想象<\/td><td>≤300元<\/td><\/tr><tr><td>第3–6月<\/td><td>旁听/自学 MIT 6.5940 前6讲<\/td><td>你对系统/压缩方向的接受度<\/td><td>0元<\/td><\/tr><tr><td>第6–9月<\/td><td>L2或L3项目（Jetson/手机部署LLM）<\/td><td>B/C方向的动手验证<\/td><td>0–1800元<\/td><\/tr><tr><td>第9–12月<\/td><td>进实验室打杂+与2–3位高年级学长深谈（保研的、考研的、就业的各一）<\/td><td>路径的真实体感<\/td><td>0元<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>关于”进哪个实验室”（结合10.0节）<span class=\"tag an\">行业分析<\/span><\/strong>：优先顺序建议按”方向匹配×进组概率”而非”名气”——想走系统/芯片方向，先读王毅课题组近两年论文再发邮件；想走边缘智能/通信交叉，毕宿志课题组（且导师本人就是浙大竺可桢学院毕业，对浙大路线有直接经验）；想走器件/存算一体，吕子玉课题组；想走机器人，田宜彬课题组或电磁控制与智能机器人重点实验室。<strong>注意：浙大课题组主页上”欢迎本科生”指的是浙大本校本科生，不是外校生——你的第一段科研必须在深大完成，然后用成果去敲浙大的门。<\/strong><\/p>\n<p><strong>决策纪律<\/strong>：每个实验结束时写下”继续/放弃”及理由；12个月后，用第十七部分的矩阵重新打分——那时的你会比今天掌握多得多的第一手信息。<strong>现在不需要决定方向，只需要决定实验顺序。<\/strong><\/p>", "text": "时间实验验证什么成本第1–3月第十六部分的14周计划（ESP32+TinyML）你对”软硬结合”的兴趣是真实还是想象≤300元第3–6月旁听/自学MIT6.5940前6讲你对系统/压缩方向的接受度0元第6–9月L2或L3项目（Jetson/手机部署LLM）B/C方向的动手验证0–1800元第9–12月进实验室打杂+与2–3位高年级学长深谈（保研的、考研的、就业的各一）路径的真实体感0元关于”进哪个实验室”（结合10.0节）【行业分析】：优先顺序建议按”方向匹配×进组概率”而非”名气”——想走系统/芯片方向，先读王毅课题组近两年论文再发邮件；想走边缘智能/通信交叉，毕宿志课题组（且导师本人就是浙大竺可桢学院毕业，对浙大路线有直接经验）；想走器件/存算一体，吕子玉课题组；想走机器人，田宜彬课题组或电磁控制与智能机器人重点实验室。注意：浙大课题组主页上”欢迎本科生”指的是浙大本校本科生，不是外校生——你的第一段科研必须在深大完成，然后用成果去敲浙大的门。决策纪律：每个实验结束时写下”继续/放弃”及理由；12个月后，用第十七部分的矩阵重新打分——那时的你会比今天掌握多得多的第一手信息。现在不需要决定方向，只需要决定实验顺序。", "n": 516}, {"id": "c69", "vol": 1, "part": "结语", "title": "结语", "page": 40, "kind": "part", "html": "<p>本报告的全部产业数据、薪资样本、实验室信息均已在正文标注证据等级与来源。技术行业每6–12个月会有一次结构性情境变化，本报告的事实层（2024–2026年数据）在你大二时（2028年）就需要重新核验——届时，用本报告教你的方法（找原始信源、交叉验证、区分事实与预测）自己做一次更新，就是这份报告最好的归宿。<\/p>\n<p><strong>免责声明<\/strong>：本报告仅为信息整理与公开资料研究，供学习决策参考，不构成职业规划、升学、留学或投资的决定性建议。涉及薪资、招生、政策的内容具有时效性，关键决策（如填报导师、签约就业）前请通过官方渠道再次核验。报告生成日期：2026年10月。<\/p>", "text": "本报告的全部产业数据、薪资样本、实验室信息均已在正文标注证据等级与来源。技术行业每6–12个月会有一次结构性情境变化，本报告的事实层（2024–2026年数据）在你大二时（2028年）就需要重新核验——届时，用本报告教你的方法（找原始信源、交叉验证、区分事实与预测）自己做一次更新，就是这份报告最好的归宿。免责声明：本报告仅为信息整理与公开资料研究，供学习决策参考，不构成职业规划、升学、留学或投资的决定性建议。涉及薪资、招生、政策的内容具有时效性，关键决策（如填报导师、签约就业）前请通过官方渠道再次核验。报告生成日期：2026年10月。", "n": 270}, {"id": "c70", "vol": 2, "part": "开篇", "title": "开篇：阅读指南", "page": 42, "kind": "front", "html": "<p><strong>——《离线AI/端侧AI全景调查报告》配套册（第二册），面向2026级电子信息方向新生<\/strong><\/p>\n<p>调研基准时间：2026年10月；政策类信息以学校当年公布为准<\/p>\n<p>证据分级沿用主报告约定：<span class=\"tag ok\">已证实<\/span>官方文件或官网直接证据；<span class=\"tag an\">行业分析<\/span>多源归纳；<span class=\"tag nv\">待核实<\/span>未能核验、给出核验路径<\/p>\n<p>报告日期：2026年10月<\/p>", "text": "——《离线AI/端侧AI全景调查报告》配套册（第二册），面向2026级电子信息方向新生调研基准时间：2026年10月；政策类信息以学校当年公布为准证据分级沿用主报告约定：【已证实】官方文件或官网直接证据；【行业分析】多源归纳；【待核实】未能核验、给出核验路径报告日期：2026年10月", "n": 142}, {"id": "c71", "vol": 2, "part": "开篇", "title": "阅读指南", "page": 42, "kind": "sec", "html": "<p>本册回答主报告刻意留下的另一半问题：<strong>“在深大这个具体的环境里，有哪些制度性资源可以用？”<\/strong> 产业方向选得再对，如果错过了文华班二次选拔、不知道卓越班有30%推免率、不了解转专业的窗口期，执行层面依然会输。本册全部信息以深圳大学官方渠道（本科招生网 zs.szu.edu.cn、教务部 jwb.szu.edu.cn、各学院官网）为优先信源。<\/p>", "text": "本册回答主报告刻意留下的另一半问题：“在深大这个具体的环境里，有哪些制度性资源可以用？”产业方向选得再对，如果错过了文华班二次选拔、不知道卓越班有30%推免率、不了解转专业的窗口期，执行层面依然会输。本册全部信息以深圳大学官方渠道（本科招生网zs.szu.edu.cn、教务部jwb.szu.edu.cn、各学院官网）为优先信源。", "n": 165}, {"id": "c72", "vol": 2, "part": "第一部分 培养方案：电子信息工程学什么", "title": "第一部分 培养方案：电子信息工程学什么", "page": 42, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c73", "vol": 2, "part": "第一部分 培养方案：电子信息工程学什么", "title": "1.1 专业基本盘", "page": 42, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>电子信息工程是深大电子与信息工程学院的核心专业：国家级一流本科专业建设点、国家特色专业；1983年建校时由清华大学援建的无线电专业发展而来（<span class=\"cite\">深大招生网专业推介<\/span>）。学院整体实力：牵头建设<strong>射频异质异构集成全国重点实验室<\/strong>；拥有信息与通信工程、电子科学与技术两个一级学科，三个博士点和一个博士后流动站（<span class=\"cite\">深大招生网<\/span>）——<strong>全国重点实验室意味着本科生有机会在校内接触到国家级科研平台<\/strong>，这在双非院校中并不多见。<\/p>", "text": "【已证实】电子信息工程是深大电子与信息工程学院的核心专业：国家级一流本科专业建设点、国家特色专业；1983年建校时由清华大学援建的无线电专业发展而来（深大招生网专业推介）。学院整体实力：牵头建设射频异质异构集成全国重点实验室；拥有信息与通信工程、电子科学与技术两个一级学科，三个博士点和一个博士后流动站（深大招生网）——全国重点实验室意味着本科生有机会在校内接触到国家级科研平台，这在双非院校中并不多见。", "n": 202}, {"id": "c74", "vol": 2, "part": "第一部分 培养方案：电子信息工程学什么", "title": "1.2 课程体系（与主报告学习路线的映射）", "page": 42, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>课程体系核心必修包括：C语言程序设计、电路分析、模拟电子技术、数字电子技术、信号与系统、电磁场与电磁波、通信电子线路、数字信号处理、单片机原理及应用、数据结构与微机原理；专业选修涵盖高频电路、通信原理、<strong>人工智能、嵌入式系统设计<\/strong>等（<span class=\"cite\">课程体系介绍<\/span>——该来源为知乎专栏，转载内容需以学院教务当年培养方案为准<span class=\"tag nv\">待核实<\/span>；核验路径：电子与信息工程学院官网 ceie.szu.edu.cn → 本科教学 → 培养方案）。<\/p>\n<p><strong>与主报告第十二部分的映射关系<span class=\"tag an\">行业分析<\/span><\/strong>：<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>主报告路线要求<\/strong><\/th><th><strong>培养方案对应课程<\/strong><\/th><th><strong>备注<\/strong><\/th><\/tr><\/thead><tbody><tr><td>408考研四门（数据结构/计组/OS/计网）<\/td><td>数据结构（必修）；计组/OS/计网<strong>需自学或辅修补齐<\/strong><\/td><td>EE方案不含完整408，这是”EE冲浙大CS/AI”必须自己补的缺口<\/td><\/tr><tr><td>C/C++与嵌入式<\/td><td>C语言、单片机原理、嵌入式系统设计（选修）<\/td><td>课内覆盖良好<\/td><\/tr><tr><td>数学地基<\/td><td>高数、线代、概率论、信号与系统<\/td><td>信号与系统是EE独有优势，对理解采样/频域/系统响应帮助大<\/td><\/tr><tr><td>AI入门<\/td><td>人工智能（选修）<\/td><td>课内仅入门，深度靠自学<\/td><\/tr><\/tbody><\/table><\/div>", "text": "【已证实】课程体系核心必修包括：C语言程序设计、电路分析、模拟电子技术、数字电子技术、信号与系统、电磁场与电磁波、通信电子线路、数字信号处理、单片机原理及应用、数据结构与微机原理；专业选修涵盖高频电路、通信原理、人工智能、嵌入式系统设计等（课程体系介绍——该来源为知乎专栏，转载内容需以学院教务当年培养方案为准【待核实】；核验路径：电子与信息工程学院官网ceie.szu.edu.cn→本科教学→培养方案）。与主报告第十二部分的映射关系【行业分析】：主报告路线要求培养方案对应课程备注408考研四门（数据结构/计组/OS/计网）数据结构（必修）；计组/OS/计网需自学或辅修补齐EE方案不含完整408，这是”EE冲浙大CS/AI”必须自己补的缺口C/C++与嵌入式C语言、单片机原理、嵌入式系统设计（选修）课内覆盖良好数学地基高数、线代、概率论、信号与系统信号与系统是EE独有优势，对理解采样/频域/系统响应帮助大AI入门人工智能（选修）课内仅入门，深度靠自学", "n": 430}, {"id": "c75", "vol": 2, "part": "第一部分 培养方案：电子信息工程学什么", "title": "1.3 学分与选课弹性", "page": 43, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>深大实行学分制与弹性学制，鼓励学生跨院系自由选课（<span class=\"cite\">深大2026招生说明<\/span>）。对你的实际意义：<strong>计软学院的操作系统、计算机组成、机器学习等课程，作为EE学生可以跨选<\/strong>——这是补齐408缺口、同时拿学分的最优方式，优先于纯自学。<\/p>", "text": "【已证实】深大实行学分制与弹性学制，鼓励学生跨院系自由选课（深大2026招生说明）。对你的实际意义：计软学院的操作系统、计算机组成、机器学习等课程，作为EE学生可以跨选——这是补齐408缺口、同时拿学分的最优方式，优先于纯自学。", "n": 114}, {"id": "c76", "vol": 2, "part": "第二部分 特色班体系：你最该关注的制度资源", "title": "第二部分 特色班体系：你最该关注的制度资源", "page": 43, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c77", "vol": 2, "part": "第二部分 特色班体系：你最该关注的制度资源", "title": "2.1 与你方向直接相关的特色班", "page": 43, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>2026年深大共有33个特色实验班（含6个院士班），其中与你（电子信息方向）直接相关的有（<span class=\"cite\">深大招生网培养特色页<\/span>、<span class=\"cite\">央广网<\/span>）：<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>特色班<\/strong><\/th><th><strong>领衔/归属<\/strong><\/th><th><strong>进入方式<\/strong><\/th><th><strong>关键政策<\/strong><\/th><th><strong>与你方向的关联<\/strong><\/th><\/tr><\/thead><tbody><tr><td><strong>电子信息工程（文华班）<\/strong>【院士班】<\/td><td>丁文华院士任首席教授，电信学院<\/td><td>高考直招15人+<strong>校内二次选拔15人<\/strong><\/td><td>双语教学、专属课程、导师制、组队参加中国国际大学生创新大赛；首届毕业生深造率70%；<strong>与香港科技大学合作：优秀学生可获毕设交换及直升授课式硕士名额<\/strong><\/td><td>同专业直通——若你录取的是普通电子信息工程，二次选拔是首个必须争取的机会<\/td><\/tr><tr><td><strong>集成电路设计与集成系统（IEEE荣誉班）<\/strong>【院士班，2026新增】<\/td><td>毛军发院士（校长）领衔，新成立的集成电路学院<\/td><td>高考直招/校内二次选拔<\/td><td>依托全国重点实验室资源<\/td><td>对应主报告F方向（AI芯片）——<strong>这是2026年新增、与你方向高度重合的班<\/strong><\/td><\/tr><tr><td><strong>人工智能（IEEE荣誉班）<\/strong>【院士班】<\/td><td>毛军发院士任荣誉班主任<\/td><td>高考直招50人，入校后有二次选拔机会<\/td><td>30%推免政策支持、目标硕博率80%、大一引入国际化生涯规划、大二定研究方向一体化培养<\/td><td>对应主报告C/E方向<\/td><\/tr><tr><td><strong>卓越AI人才培养特色班<\/strong><\/td><td>电信学院<\/td><td>校内二次选拔<\/td><td><span class=\"tag nv\">待核实<\/span>具体选拔条件与规模（核验路径：电信学院官网 ceie.szu.edu.cn每年新生季通知）<\/td><td>学院内部的AI强化班<\/td><\/tr><tr><td>智能感知工程（未来技术创新班）<\/td><td>未来技术学院<\/td><td>2026新增，高考直招/校内二次选拔<\/td><td><span class=\"tag nv\">待核实<\/span>培养细则<\/td><td>感知方向，与端侧视觉相关<\/td><\/tr><tr><td>机器人工程（低空创新班）<\/td><td>—<\/td><td>2026新增<\/td><td><span class=\"tag nv\">待核实<\/span><\/td><td>偏低空经济，与机器人端侧AI部分相关<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong><span class=\"tag an\">行业分析<\/span>对你的策略含义<\/strong>：如果你高考录取的是普通班，<strong>大一上学期的首要制度性动作是盯紧校内二次选拔<\/strong>——文华班（15个名额）、IEEE荣誉班等均在入校后开放二次选拔（<span class=\"cite\">中国青年报<\/span>、<span class=\"cite\">深大官网<\/span>）。选拔时间分校级与院级不同窗口：高等研究院<strong>理工创新实验班在报到前的8月<\/strong>（2025级为8月19–23日报名、8月29日面试（<span class=\"cite\">深大高等研究院2025级选拔方案<\/span>））<span class=\"tag ok\">已证实<\/span>；文华班、IEEE荣誉班等院级特色班的二次选拔时间<strong>以各学院当年通知为准<\/strong>（往年既有9月初也有学期末的安排，据在校生信息本学期末也会组织）【待核实，以学院通知为准】。<strong>结论：录取后的暑假就应关注各学院官网与招生办公众号，理工创新班尤其不能等开学。<\/strong><\/p>", "text": "【已证实】2026年深大共有33个特色实验班（含6个院士班），其中与你（电子信息方向）直接相关的有（深大招生网培养特色页、央广网）：特色班领衔/归属进入方式关键政策与你方向的关联电子信息工程（文华班）【院士班】丁文华院士任首席教授，电信学院高考直招15人+校内二次选拔15人双语教学、专属课程、导师制、组队参加中国国际大学生创新大赛；首届毕业生深造率70%；与香港科技大学合作：优秀学生可获毕设交换及直升授课式硕士名额同专业直通——若你录取的是普通电子信息工程，二次选拔是首个必须争取的机会集成电路设计与集成系统（IEEE荣誉班）【院士班，2026新增】毛军发院士（校长）领衔，新成立的集成电路学院高考直招/校内二次选拔依托全国重点实验室资源对应主报告F方向（AI芯片）——这是2026年新增、与你方向高度重合的班人工智能（IEEE荣誉班）【院士班】毛军发院士任荣誉班主任高考直招50人，入校后有二次选拔机会30%推免政策支持、目标硕博率80%、大一引入国际化生涯规划、大二定研究方向一体化培养对应主报告C/E方向卓越AI人才培养特色班电信学院校内二次选拔【待核实】具体选拔条件与规模（核验路径：电信学院官网ceie.szu.edu.cn每年新生季通知）学院内部的AI强化班智能感知工程（未来技术创新班）未来技术学院2026新增，高考直招/校内二次选拔【待核实】培养细则感知方向，与端侧视觉相关机器人工程（低空创新班）—2026新增【待核实】偏低空经济，与机器人端侧AI部分相关【行业分析】对你的策略含义：如果你高考录取的是普通班，大一上学期的首要制度性动作是盯紧校内二次选拔——文华班（15个名额）、IEEE荣誉班等均在入校后开放二次选拔（中国青年报、深大官网）。选拔时间分校级与院级不同窗口：高等研究院理工创新实验班在报到前的8月（2025级为8月19–23日报名、8月29日面试（深大高等研究院2025级选拔方案））【已证实】；文华班、IEEE荣誉班等院级特色班的二次选拔时间以各学院当年通知为准（往年既有9月初也有学期末的安排，据在校生信息本学期末也会组织）【待核实，以学院通知为准】。结论：录取后的暑假就应关注各学院官网与招生办公众号，理工创新班尤其不能等开学。", "n": 936}, {"id": "c78", "vol": 2, "part": "第二部分 特色班体系：你最该关注的制度资源", "title": "2.2 卓越班体系", "page": 44, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>全校14个专业设卓越班，本研一体化贯通培养：导师制、小班教学、可提前修读研究生课程、<strong>毕业推免率可达30%<\/strong>、设直博计划、有奖学金与国际交流资助倾斜；实行动态管理（有条件准入+学业不佳退出）（<span class=\"cite\">教育在线高招访谈<\/span>、<span class=\"cite\">央广网<\/span>）。现有卓越班专业：汉语言文学、经济学、广告学、计算机科学与技术、光电信息科学与工程、建筑学、心理学、生物医学工程、临床医学、物理学、化学、生物科学、信息管理与信息系统、数学与应用数学。<strong>注意：电子信息工程目前不在卓越班名单中<\/strong>——你的专业对应的高配通道是文华班而非卓越班。<\/p>", "text": "【已证实】全校14个专业设卓越班，本研一体化贯通培养：导师制、小班教学、可提前修读研究生课程、毕业推免率可达30%、设直博计划、有奖学金与国际交流资助倾斜；实行动态管理（有条件准入+学业不佳退出）（教育在线高招访谈、央广网）。现有卓越班专业：汉语言文学、经济学、广告学、计算机科学与技术、光电信息科学与工程、建筑学、心理学、生物医学工程、临床医学、物理学、化学、生物科学、信息管理与信息系统、数学与应用数学。注意：电子信息工程目前不在卓越班名单中——你的专业对应的高配通道是文华班而非卓越班。", "n": 246}, {"id": "c79", "vol": 2, "part": "第二部分 特色班体系：你最该关注的制度资源", "title": "2.3 院士领航科创训练营", "page": 44, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>“跨专业、跨学科、问题导向、项目驱动”，<strong>不设专业限制，最早大一下学期可申请<\/strong>（<span class=\"cite\">深大招生网<\/span>）；入选学生获”学术创新+创业孵化”双导师指导，<strong>表现优异者有机会获得研究生推免资格<\/strong>，如在本校读研可由院士及核心团队担任导师（<span class=\"cite\">央广网<\/span>）；训练营<strong>内设30%推免指标<\/strong>（<span class=\"cite\">头条报道引述深大党委书记李清泉<\/span>，媒体口径，<span class=\"tag nv\">待核实<\/span>以学校当年文件为准）。<\/p>\n<p><strong><span class=\"tag an\">行业分析<\/span><\/strong>这是普通班学生最值得争取的通道之一：不设专业限制、大一下即可申请、直通院士团队。时间上恰好与主报告第十六部分的14周计划衔接——大一上用ESP32项目攒出手上功夫，大一下带着作品去申请。<\/p>", "text": "【已证实】“跨专业、跨学科、问题导向、项目驱动”，不设专业限制，最早大一下学期可申请（深大招生网）；入选学生获”学术创新+创业孵化”双导师指导，表现优异者有机会获得研究生推免资格，如在本校读研可由院士及核心团队担任导师（央广网）；训练营内设30%推免指标（头条报道引述深大党委书记李清泉，媒体口径，【待核实】以学校当年文件为准）。【行业分析】这是普通班学生最值得争取的通道之一：不设专业限制、大一下即可申请、直通院士团队。时间上恰好与主报告第十六部分的14周计划衔接——大一上用ESP32项目攒出手上功夫，大一下带着作品去申请。", "n": 264}, {"id": "c80", "vol": 2, "part": "第二部分 特色班体系：你最该关注的制度资源", "title": "2.4 双学位、辅修与微专业", "page": 45, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span><\/p>\n<p><strong>双学士学位<\/strong>：2026年新增8个双学位项目（6个为AI+，如”信息管理与信息系统+人工智能”），高考直招（<span class=\"cite\">深大官网<\/span>）——双学位项目需在高考志愿阶段进入，入校后通常不能再转入<span class=\"tag nv\">待核实<\/span>。<\/p>\n<p><strong>辅修<\/strong>：人工智能学院设<strong>人工智能辅修专业，面向全校学生开放申请<\/strong>（<span class=\"cite\">深大官网<\/span>）。申请时间为第三学期（大二上），要求必修课合格无处分（<span class=\"cite\">辅修规定<\/span>，第三方整理，以教务部文件为准<span class=\"tag nv\">待核实<\/span>）。<strong>对EE学生，“电子信息工程+人工智能辅修”是补齐AI课程的制度化路径。<\/strong><\/p>\n<p><strong>微专业<\/strong>：全校40余个微专业可跨专业修读，其中<strong>“人工智能芯片设计与应用”“智能感知与运动控制”<\/strong>两个与你的方向几乎完全对口（<span class=\"cite\">深大招生网<\/span>）。微专业学分负担轻于辅修，适合低成本试水。<\/p>", "text": "【已证实】双学士学位：2026年新增8个双学位项目（6个为AI+，如”信息管理与信息系统+人工智能”），高考直招（深大官网）——双学位项目需在高考志愿阶段进入，入校后通常不能再转入【待核实】。辅修：人工智能学院设人工智能辅修专业，面向全校学生开放申请（深大官网）。申请时间为第三学期（大二上），要求必修课合格无处分（辅修规定，第三方整理，以教务部文件为准【待核实】）。对EE学生，“电子信息工程+人工智能辅修”是补齐AI课程的制度化路径。微专业：全校40余个微专业可跨专业修读，其中“人工智能芯片设计与应用”“智能感知与运动控制”两个与你的方向几乎完全对口（深大招生网）。微专业学分负担轻于辅修，适合低成本试水。", "n": 306}, {"id": "c81", "vol": 2, "part": "第三部分 转专业与大类分流", "title": "第三部分 转专业与大类分流", "page": 45, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c82", "vol": 2, "part": "第三部分 转专业与大类分流", "title": "3.1 转专业政策要点", "page": 45, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>依据《深圳大学本科生转专业管理办法（试行）》（<span class=\"cite\">教务部文件<\/span>）与招生网说明（<span class=\"cite\">转专业&amp;大类分流<\/span>）：<\/p>\n<p><strong>时间窗口<\/strong>：每学年第二学期（约每年4–5月）；<strong>在学期间只能转一次<\/strong>。<\/p>\n<p><strong>基本规则<\/strong>：“转出无条件，转入要考核”——转入须参加专业能力笔试+面试（理工类笔试通常考数学），笔试低于60分无效；接收名额原则上为该专业本年级人数的<strong>15%<\/strong>；按笔试成绩1:1.2确定面试名单。<\/p>\n<p><strong>成功率参考<\/strong>：往年整体转专业成功比例约45%–50%（<span class=\"cite\">360eol政策页<\/span>、<span class=\"cite\">深圳本地宝<\/span>，口径为往年整体值<span class=\"tag an\">行业分析<\/span>）。<\/p>\n<p><strong>限制<\/strong>：卓越班转入有绩点要求且原则上限入校第一学年；中外合作办学专业不得转出；已转过一次不能再转。<\/p>\n<p><strong><span class=\"tag an\">行业分析<\/span>对你的策略含义<\/strong>：如果你录取专业不是电子信息工程而是相近专业（如物理、自动化），转专业进EE或微电是可行的，但注意三点：①窗口在大一下（第二学期），届时你的高数成绩就是笔试成绩的基本盘；②只能转一次，不存在”先转去试试”；③转入集成电路学院/计软学院的竞争会比转入EE激烈得多，需提前评估。<\/p>", "text": "【已证实】依据《深圳大学本科生转专业管理办法（试行）》（教务部文件）与招生网说明（转专业&大类分流）：时间窗口：每学年第二学期（约每年4–5月）；在学期间只能转一次。基本规则：“转出无条件，转入要考核”——转入须参加专业能力笔试+面试（理工类笔试通常考数学），笔试低于60分无效；接收名额原则上为该专业本年级人数的15%；按笔试成绩1:1.2确定面试名单。成功率参考：往年整体转专业成功比例约45%–50%（360eol政策页、深圳本地宝，口径为往年整体值【行业分析】）。限制：卓越班转入有绩点要求且原则上限入校第一学年；中外合作办学专业不得转出；已转过一次不能再转。【行业分析】对你的策略含义：如果你录取专业不是电子信息工程而是相近专业（如物理、自动化），转专业进EE或微电是可行的，但注意三点：①窗口在大一下（第二学期），届时你的高数成绩就是笔试成绩的基本盘；②只能转一次，不存在”先转去试试”；③转入集成电路学院/计软学院的竞争会比转入EE激烈得多，需提前评估。", "n": 434}, {"id": "c83", "vol": 2, "part": "第三部分 转专业与大类分流", "title": "3.2 大类分流", "page": 46, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>按大类录取的学生，大一下学期按”意愿+在校成绩”双向选择分流到具体专业；广东省外按专业录取的考生可优先选择原录取专业（<span class=\"cite\">深大招生网<\/span>）。<strong>若你是大类招生录取，大一上的成绩直接决定分流选择权——这又一次印证”大一大二绩点是最高优先级”。<\/strong><\/p>", "text": "【已证实】按大类录取的学生，大一下学期按”意愿+在校成绩”双向选择分流到具体专业；广东省外按专业录取的考生可优先选择原录取专业（深大招生网）。若你是大类招生录取，大一上的成绩直接决定分流选择权——这又一次印证”大一大二绩点是最高优先级”。", "n": 119}, {"id": "c84", "vol": 2, "part": "第四部分 推免（保研）政策详解", "title": "第四部分 推免（保研）政策详解", "page": 46, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c85", "vol": 2, "part": "第四部分 推免（保研）政策详解", "title": "4.1 名额与比率", "page": 46, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>2025届（2021级）深大推免名额<strong>406人<\/strong>，以7130名本科新生基数计，推免率约<strong>5.69%<\/strong>（<span class=\"cite\">高顿教育整理的公开数据<\/span>，B级信源；请以学校当年公示为准）。分学院看，2025届四个推免大院为：医学部37人、物理与光电工程学院33人、<strong>电子与信息工程学院44人<\/strong>、计算机与软件学院31人（<span class=\"cite\">政策分析转载<\/span>，B级信源<span class=\"tag nv\">待核实<\/span>，核验路径：每年9月教务部公示的《推免生名额分配表》）。<\/p>\n<p><strong><span class=\"tag an\">行业分析<\/span>关键解读<\/strong>：5.69%是全校平均，但电信学院44人是全校最多的学院之一——<strong>你的专业处在校内推免资源最厚的池子里<\/strong>。此外普通推免之外还有三块叠加资源：特色班推免倾斜（IEEE班30%、卓越班30%）、科创训练营30%推免指标、以及”3+1+5”本博贯通计划（本科三年级选拔，第四学年开始修研究生课程（<span class=\"cite\">央广网<\/span>））。<\/p>", "text": "【已证实】2025届（2021级）深大推免名额406人，以7130名本科新生基数计，推免率约5.69%（高顿教育整理的公开数据，B级信源；请以学校当年公示为准）。分学院看，2025届四个推免大院为：医学部37人、物理与光电工程学院33人、电子与信息工程学院44人、计算机与软件学院31人（政策分析转载，B级信源【待核实】，核验路径：每年9月教务部公示的《推免生名额分配表》）。【行业分析】关键解读：5.69%是全校平均，但电信学院44人是全校最多的学院之一——你的专业处在校内推免资源最厚的池子里。此外普通推免之外还有三块叠加资源：特色班推免倾斜（IEEE班30%、卓越班30%）、科创训练营30%推免指标、以及”3+1+5”本博贯通计划（本科三年级选拔，第四学年开始修研究生课程（央广网））。", "n": 347}, {"id": "c86", "vol": 2, "part": "第四部分 推免（保研）政策详解", "title": "4.2 推免硬条件", "page": 46, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>综合公开整理（<span class=\"cite\">高顿整理<\/span>，以教务部当年文件为准）：<\/p>\n<p>学分绩点 <strong>≥3.5<\/strong>（不含交换成绩）；<\/p>\n<p>英语门槛：非外语专业要求四级500+/六级425+/托福80+/雅思6.0+ 之一；<\/p>\n<p>评价结构：学业成绩约70%权重为核心，学科竞赛/论文专利取最高项计分，志愿服务等为辅助；<\/p>\n<p>无违纪记录。<\/p>\n<p><strong><span class=\"tag an\">行业分析<\/span><\/strong>绩点3.5只是”准入线”不是”安全线”——电信学院44个名额对应全年级数百人，实际竞争者的绩点远高于此。<strong>主报告第十二部分”大三上结束前不预设升学/就业”的前提，就是大一大二绩点始终保持在专业前10%以内。<\/strong><\/p>", "text": "【已证实】综合公开整理（高顿整理，以教务部当年文件为准）：学分绩点≥3.5（不含交换成绩）；英语门槛：非外语专业要求四级500+/六级425+/托福80+/雅思6.0+之一；评价结构：学业成绩约70%权重为核心，学科竞赛/论文专利取最高项计分，志愿服务等为辅助；无违纪记录。【行业分析】绩点3.5只是”准入线”不是”安全线”——电信学院44个名额对应全年级数百人，实际竞争者的绩点远高于此。主报告第十二部分”大三上结束前不预设升学/就业”的前提，就是大一大二绩点始终保持在专业前10%以内。", "n": 245}, {"id": "c87", "vol": 2, "part": "第四部分 推免（保研）政策详解", "title": "4.3 推免去向（历史参考）", "page": 46, "kind": "sec", "html": "<p>【已证实，B级信源整理】深大近年推免去向覆盖北京大学（深圳研究生院微电子学与固体电子学等）、<strong>浙江大学<\/strong>、中国科学技术大学、同济大学、中山大学、南方科技大学等（<span class=\"cite\">政策分析转载<\/span>）。<\/p>\n<p><strong>注意<\/strong>：这些是历年个案汇总，不代表任何保证；深大→浙大的推免路径存在但每年仅个位数，决定性变量是科研产出与夏令营表现（与主报告9.6节结论一致）。<\/p>", "text": "【已证实，B级信源整理】深大近年推免去向覆盖北京大学（深圳研究生院微电子学与固体电子学等）、浙江大学、中国科学技术大学、同济大学、中山大学、南方科技大学等（政策分析转载）。注意：这些是历年个案汇总，不代表任何保证；深大→浙大的推免路径存在但每年仅个位数，决定性变量是科研产出与夏令营表现（与主报告9.6节结论一致）。", "n": 158}, {"id": "c88", "vol": 2, "part": "第五部分 奖学金与资助（预算敏感专项）", "title": "第五部分 奖学金与资助（预算敏感专项）", "page": 47, "kind": "part", "html": "<p><span class=\"tag ok\">已证实<\/span><\/p>\n<p><strong>国家层面<\/strong>：国家奖学金、国家励志奖学金、国家助学贷款、勤工助学岗位（家庭经济困难学生优先安排）（<span class=\"cite\">深大2026招生章程<\/span>）。<\/p>\n<p><strong>特色班层面<\/strong>：理工创新实验班第一学年全额学费奖学金；卓越班设专门奖学金（<span class=\"cite\">招生指南<\/span>、<span class=\"cite\">央广网<\/span>）。<\/p>\n<p><strong>科创经费<\/strong>：学校每年投入过千万元支持学生创新创业，建有校内学生创业园（<span class=\"cite\">教育在线<\/span>）——大创项目、学科竞赛的器件费用（如主报告第十四部分的开发板）通常可经项目经费报销，立项后实际个人支出可能接近零<span class=\"tag an\">行业分析<\/span>。<\/p>", "text": "【已证实】国家层面：国家奖学金、国家励志奖学金、国家助学贷款、勤工助学岗位（家庭经济困难学生优先安排）（深大2026招生章程）。特色班层面：理工创新实验班第一学年全额学费奖学金；卓越班设专门奖学金（招生指南、央广网）。科创经费：学校每年投入过千万元支持学生创新创业，建有校内学生创业园（教育在线）——大创项目、学科竞赛的器件费用（如主报告第十四部分的开发板）通常可经项目经费报销，立项后实际个人支出可能接近零【行业分析】。", "n": 211}, {"id": "c89", "vol": 2, "part": "第六部分 汇总：2026级入学后的制度性行动清单", "title": "第六部分 汇总：2026级入学后的制度性行动清单", "page": 47, "kind": "part", "html": "<p>按时间顺序整理本册全部”有截止窗口”的事项：<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>时点<\/strong><\/th><th><strong>事项<\/strong><\/th><th><strong>依据<\/strong><\/th><\/tr><\/thead><tbody><tr><td>录取后的暑假<\/td><td>准备特色班校内二次选拔（文华班/IEEE班等，面试常在9月初新生注册前后）；自学Python/C语言入门<\/td><td>第二部分<\/td><\/tr><tr><td>大一上<\/td><td>保住绩点（推免准入线3.5，实际安全线远高于此）；执行主报告14周ESP32计划；关注大类分流规则（若适用）<\/td><td>第三、四部分<\/td><\/tr><tr><td>大一下（第二学期）<\/td><td><strong>院士领航科创训练营申请<\/strong>（最早窗口）；<strong>转专业申请<\/strong>（若有需要，一生一次）；<strong>大类分流<\/strong>（若适用）<\/td><td>第二、三部分<\/td><\/tr><tr><td>大二上（第三学期）<\/td><td>申请<strong>人工智能辅修<\/strong>或”人工智能芯片设计与应用”微专业；进组科研（主报告10.0节）<\/td><td>第二部分<\/td><\/tr><tr><td>大二下–大三上<\/td><td>产出科研/竞赛成果；大三上末做保研/考研/就业决策（主报告12.3节）<\/td><td>第四部分<\/td><\/tr><tr><td>大三下<\/td><td>若冲保研：准备夏令营（浙大等校5–7月）；关注”3+1+5”本博贯通选拔（三年级启动）<\/td><td>第四部分<\/td><\/tr><tr><td>大四<\/td><td>9月推免系统填报；或考研冲刺；或秋招<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>两个反复出现的结论<span class=\"tag an\">行业分析<\/span><\/strong>：<\/p>\n<p>1. <strong>绩点是所有制度通道的公共钥匙<\/strong>——特色班转入、转专业、分流、推免、训练营，全部以成绩为第一筛选变量。任何课外探索（包括主报告的全部项目计划）都不应以牺牲绩点为代价。<\/p>\n<p>2. <strong>深大的制度资源密度高于多数同层次学校<\/strong>（院士班、训练营、全国重点实验室、同城产业），但几乎全部需要<strong>主动申请<\/strong>而非自动获得——信息差本身就是竞争力，本册的目的就是消除你在制度层面的信息差。<\/p>\n<p><strong>免责声明<\/strong>：本册为公开信息整理，所有政策均有时效性。涉及个人学籍决策（转专业、特色班报名、推免申请）前，请以深圳大学教务部、本科招生网及所在学院当年发布的正式文件为唯一依据。报告生成日期：2026年10月。<\/p>", "text": "按时间顺序整理本册全部”有截止窗口”的事项：时点事项依据录取后的暑假准备特色班校内二次选拔（文华班/IEEE班等，面试常在9月初新生注册前后）；自学Python/C语言入门第二部分大一上保住绩点（推免准入线3.5，实际安全线远高于此）；执行主报告14周ESP32计划；关注大类分流规则（若适用）第三、四部分大一下（第二学期）院士领航科创训练营申请（最早窗口）；转专业申请（若有需要，一生一次）；大类分流（若适用）第二、三部分大二上（第三学期）申请人工智能辅修或”人工智能芯片设计与应用”微专业；进组科研（主报告10.0节）第二部分大二下–大三上产出科研/竞赛成果；大三上末做保研/考研/就业决策（主报告12.3节）第四部分大三下若冲保研：准备夏令营（浙大等校5–7月）；关注”3+1+5”本博贯通选拔（三年级启动）第四部分大四9月推免系统填报；或考研冲刺；或秋招—两个反复出现的结论【行业分析】：1.绩点是所有制度通道的公共钥匙——特色班转入、转专业、分流、推免、训练营，全部以成绩为第一筛选变量。任何课外探索（包括主报告的全部项目计划）都不应以牺牲绩点为代价。2.深大的制度资源密度高于多数同层次学校（院士班、训练营、全国重点实验室、同城产业），但几乎全部需要主动申请而非自动获得——信息差本身就是竞争力，本册的目的就是消除你在制度层面的信息差。免责声明：本册为公开信息整理，所有政策均有时效性。涉及个人学籍决策（转专业、特色班报名、推免申请）前，请以深圳大学教务部、本科招生网及所在学院当年发布的正式文件为唯一依据。报告生成日期：2026年10月。", "n": 676}, {"id": "c90", "vol": 3, "part": "开篇", "title": "开篇：阅读指南", "page": 50, "kind": "front", "html": "<p><strong>——《离线AI/端侧AI全景调查报告》配套册（第三册），改写自《上海交通大学生存手册》的通用经验，并落到深大情境<\/strong><\/p>\n<p>报告性质：经验方法册（非数据调查册），观点类内容不再逐条标注证据等级<\/p>\n<p>主要参考：《上海交通大学生存手册》（SurviveSJTUManual，2008年初版、持续更新，survivesjtu.gitbook.io）——本册将其中普适的心法迁移到深大语境，并剔除交大特有的内容（如留沪政策）<\/p>\n<p>报告日期：2026年10月<\/p>", "text": "——《离线AI/端侧AI全景调查报告》配套册（第三册），改写自《上海交通大学生存手册》的通用经验，并落到深大情境报告性质：经验方法册（非数据调查册），观点类内容不再逐条标注证据等级主要参考：《上海交通大学生存手册》（SurviveSJTUManual，2008年初版、持续更新，survivesjtu.gitbook.io）——本册将其中普适的心法迁移到深大语境，并剔除交大特有的内容（如留沪政策）报告日期：2026年10月", "n": 212}, {"id": "c91", "vol": 3, "part": "开篇", "title": "为什么需要第三册", "page": 50, "kind": "sec", "html": "<p>第一册告诉你 Edge AI 这个<strong>方向<\/strong>值不值得走；第二册告诉你深大的<strong>制度<\/strong>里有哪些门。但两册都默认了一件事：你知道怎么在大学里”正确地行动”。事实上，绝大多数新生的问题不在方向也不在信息，而在<strong>思维方式还停留在高中<\/strong>。《交大学生存手册》之所以流传十几年，正是因为它讲的不是交大的事，而是”如何从被安排的高中生变成自己负责的大学生”——这部分对所有学校通用。本册把它落到你的具体处境上。<\/p>", "text": "第一册告诉你EdgeAI这个方向值不值得走；第二册告诉你深大的制度里有哪些门。但两册都默认了一件事：你知道怎么在大学里”正确地行动”。事实上，绝大多数新生的问题不在方向也不在信息，而在思维方式还停留在高中。《交大学生存手册》之所以流传十几年，正是因为它讲的不是交大的事，而是”如何从被安排的高中生变成自己负责的大学生”——这部分对所有学校通用。本册把它落到你的具体处境上。", "n": 186}, {"id": "c92", "vol": 3, "part": "第一部分 思维方式：先拆掉高中操作系统", "title": "第一部分 思维方式：先拆掉高中操作系统", "page": 50, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c93", "vol": 3, "part": "第一部分 思维方式：先拆掉高中操作系统", "title": "1.1 高考思维 vs 大学思维", "page": 50, "kind": "sec", "html": "<p>高中世界是一个<strong>单目标、全排名、有标准答案<\/strong>的系统：分数是唯一的优化目标，所有人排一条队，每道题有确定解。大学是<strong>多目标、无总排名、大量开放问题<\/strong>的系统——你完全可以在成绩保持中上的同时，把省下的精力投到科研、项目、实习上，最终综合评价远超”纯绩点战士”。<\/p>\n<p><strong>落到你的处境<\/strong>：主报告给的14周ESP32计划、每周3–5小时的约束，就是”多目标系统”的具体设计——它不是让你少学习，而是让你把绩点之外的边际时间投到复利更高的地方。如果你用高考思维执行，会把这5小时也拿去刷题，四年后你会发现自己是一个”高绩点但简历空白”的保研边缘人。<\/p>", "text": "高中世界是一个单目标、全排名、有标准答案的系统：分数是唯一的优化目标，所有人排一条队，每道题有确定解。大学是多目标、无总排名、大量开放问题的系统——你完全可以在成绩保持中上的同时，把省下的精力投到科研、项目、实习上，最终综合评价远超”纯绩点战士”。落到你的处境：主报告给的14周ESP32计划、每周3–5小时的约束，就是”多目标系统”的具体设计——它不是让你少学习，而是让你把绩点之外的边际时间投到复利更高的地方。如果你用高考思维执行，会把这5小时也拿去刷题，四年后你会发现自己是一个”高绩点但简历空白”的保研边缘人。", "n": 259}, {"id": "c94", "vol": 3, "part": "第一部分 思维方式：先拆掉高中操作系统", "title": "1.2 被动思维：大学不会主动给你任何东西", "page": 50, "kind": "sec", "html": "<p>高中的一切资源（教材、进度、辅导）是<strong>投喂<\/strong>的；大学的一切资源（实验室、导师、训练营、竞赛信息）是<strong>自助<\/strong>的。深大的院士训练营、文华班二次选拔、实验室进组机会，全部需要自己盯通知、自己申请——没人会来提醒你。第二册第六章那张时间轴清单，就是用来对抗被动思维的工具：<strong>把每个窗口期写进日历，设提前两周的提醒<\/strong>。<\/p>", "text": "高中的一切资源（教材、进度、辅导）是投喂的；大学的一切资源（实验室、导师、训练营、竞赛信息）是自助的。深大的院士训练营、文华班二次选拔、实验室进组机会，全部需要自己盯通知、自己申请——没人会来提醒你。第二册第六章那张时间轴清单，就是用来对抗被动思维的工具：把每个窗口期写进日历，设提前两周的提醒。", "n": 148}, {"id": "c95", "vol": 3, "part": "第一部分 思维方式：先拆掉高中操作系统", "title": "1.3 反对PUA：识别有毒的师生关系", "page": 51, "kind": "sec", "html": "<p>《生存手册》中反复强调的一点：本科生进实验室是<strong>双向选择<\/strong>，不是施舍。需要警惕的信号（适用于任何学校）：<\/p>\n<p>导师安排大量与科研无关的杂活（报销、取快递、写与课题无关的材料）；<\/p>\n<p>承诺”发论文带你署名”但从不给具体指导，只用威胁和画饼驱动；<\/p>\n<p>组内学生延毕比例异常高；<\/p>\n<p>克扣助研补助、抢一作；<\/p>\n<p>试图用”你不努力”“你要感恩”来控制你的时间与私人生活。<\/p>\n<p><strong>判断方法<\/strong>：进组前务必找组内2–3名在读学生私聊，问三个问题——“老师每周和你聊几次？”“上一个本科进组的学长做出了什么、去了哪？”“如果重来你还会进这个组吗？”第三个问题的表情比答案更真实。<\/p>", "text": "《生存手册》中反复强调的一点：本科生进实验室是双向选择，不是施舍。需要警惕的信号（适用于任何学校）：导师安排大量与科研无关的杂活（报销、取快递、写与课题无关的材料）；承诺”发论文带你署名”但从不给具体指导，只用威胁和画饼驱动；组内学生延毕比例异常高；克扣助研补助、抢一作；试图用”你不努力”“你要感恩”来控制你的时间与私人生活。判断方法：进组前务必找组内2–3名在读学生私聊，问三个问题——“老师每周和你聊几次？”“上一个本科进组的学长做出了什么、去了哪？”“如果重来你还会进这个组吗？”第三个问题的表情比答案更真实。", "n": 259}, {"id": "c96", "vol": 3, "part": "第二部分 科研心法：上学和做研究是两回事", "title": "第二部分 科研心法：上学和做研究是两回事", "page": 51, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c97", "vol": 3, "part": "第二部分 科研心法：上学和做研究是两回事", "title": "2.1 一个必须建立的认知", "page": 51, "kind": "sec", "html": "<p>上课做题是<strong>在已有答案的轨道上加速<\/strong>；做研究是<strong>在没有地图的海上航行<\/strong>。两者的能力模型几乎不重叠：绩点第一的人可能完全不适合科研，绩点中等的人可能是优秀的研究者。这意味着两件事：<\/p>\n<p>1. <strong>不要用绩点预测科研能力，也不要用科研热情透支绩点<\/strong>——它们是两套肌肉，都需要练，但训练方式不同；<\/p>\n<p>2. 主报告建议大一先做题、大二再进组，部分原因就在于此：你需要先在”有答案的世界”里证明基本功，再去”无答案的世界”里试错。<\/p>", "text": "上课做题是在已有答案的轨道上加速；做研究是在没有地图的海上航行。两者的能力模型几乎不重叠：绩点第一的人可能完全不适合科研，绩点中等的人可能是优秀的研究者。这意味着两件事：1.不要用绩点预测科研能力，也不要用科研热情透支绩点——它们是两套肌肉，都需要练，但训练方式不同；2.主报告建议大一先做题、大二再进组，部分原因就在于此：你需要先在”有答案的世界”里证明基本功，再去”无答案的世界”里试错。", "n": 196}, {"id": "c98", "vol": 3, "part": "第二部分 科研心法：上学和做研究是两回事", "title": "2.2 位置感：比知识更重要的东西", "page": 51, "kind": "sec", "html": "<p>《生存手册》里最精辟的要求是：当被问及你的工作时，你应该能像从 Google Earth 找到自己家一样，<strong>把你的小课题放进整个学科的时间尺度和知识版图里<\/strong>。对应到你的方向：当你大二进组做一个”存算一体阵列的量化感知训练”课题时，你应该能说清楚——它解决的是主报告第二部分D节（模型压缩）和F节（AI芯片）交叉地带的哪一个问题，和 MCUNet/AWQ 这些已有工作的关系是什么。<strong>如果你说不出自己的工作在版图中的位置，说明你还没有开始做研究，只是在完成任务。<\/strong><\/p>", "text": "《生存手册》里最精辟的要求是：当被问及你的工作时，你应该能像从GoogleEarth找到自己家一样，把你的小课题放进整个学科的时间尺度和知识版图里。对应到你的方向：当你大二进组做一个”存算一体阵列的量化感知训练”课题时，你应该能说清楚——它解决的是主报告第二部分D节（模型压缩）和F节（AI芯片）交叉地带的哪一个问题，和MCUNet/AWQ这些已有工作的关系是什么。如果你说不出自己的工作在版图中的位置，说明你还没有开始做研究，只是在完成任务。", "n": 222}, {"id": "c99", "vol": 3, "part": "第二部分 科研心法：上学和做研究是两回事", "title": "2.3 习惯失败", "page": 52, "kind": "sec", "html": "<p>研究的常态是”长期没有正反馈，偶尔豁然开朗”。这与高中的”刷题—提分”即时反馈循环完全相反。如果你发现自己极度依赖即时反馈（这很正常，大部分人都这样），<strong>先用工程项目过渡<\/strong>：主报告的五级项目阶梯（L1–L5）每一级都有明确的”做出来”时刻，这是为你设计的反馈缓冲带。等到L4（论文复现）时你才会真正体验”没有标准答案”的感觉——那时再判断自己是否适合走学术路线。<\/p>", "text": "研究的常态是”长期没有正反馈，偶尔豁然开朗”。这与高中的”刷题—提分”即时反馈循环完全相反。如果你发现自己极度依赖即时反馈（这很正常，大部分人都这样），先用工程项目过渡：主报告的五级项目阶梯（L1–L5）每一级都有明确的”做出来”时刻，这是为你设计的反馈缓冲带。等到L4（论文复现）时你才会真正体验”没有标准答案”的感觉——那时再判断自己是否适合走学术路线。", "n": 179}, {"id": "c100", "vol": 3, "part": "第二部分 科研心法：上学和做研究是两回事", "title": "2.4 动机检查：你为什么读研", "page": 52, "kind": "sec", "html": "<p>《生存手册》对读研动机的分类至今有效：①为文凭更好就业；②为积累研究经验。两种都正当，但<strong>要诚实<\/strong>——假装热爱科研去读博会非常痛苦，而为了”逃避就业”去读研同样代价高昂。主报告第七部分已经告诉过你：对于端侧AI的大部分岗位，硕士是主流门槛但博士并非必需；只有AI芯片架构、体系结构研究等少数方向，博士才是硬通货。把读研当作”默认选项”是高考思维的延续——<strong>每多一层学历，都要能回答”这层学历给了我什么不可替代的东西”<\/strong>。<\/p>", "text": "《生存手册》对读研动机的分类至今有效：①为文凭更好就业；②为积累研究经验。两种都正当，但要诚实——假装热爱科研去读博会非常痛苦，而为了”逃避就业”去读研同样代价高昂。主报告第七部分已经告诉过你：对于端侧AI的大部分岗位，硕士是主流门槛但博士并非必需；只有AI芯片架构、体系结构研究等少数方向，博士才是硬通货。把读研当作”默认选项”是高考思维的延续——每多一层学历，都要能回答”这层学历给了我什么不可替代的东西”。", "n": 206}, {"id": "c101", "vol": 3, "part": "第三部分 信息素养：差距的真正来源", "title": "第三部分 信息素养：差距的真正来源", "page": 52, "kind": "part", "html": "<p>《生存手册》一针见血：所谓”信息差”，本质就是信息素养差。同一个深大，有人大一就知道院士训练营的申请窗口，有人大四才发现它的存在——这不是资源差异，是检索习惯的差异。以下清单按优先级排列：<\/p>", "text": "《生存手册》一针见血：所谓”信息差”，本质就是信息素养差。同一个深大，有人大一就知道院士训练营的申请窗口，有人大四才发现它的存在——这不是资源差异，是检索习惯的差异。以下清单按优先级排列：", "n": 94}, {"id": "c102", "vol": 3, "part": "第三部分 信息素养：差距的真正来源", "title": "3.1 一手信源纪律", "page": 52, "kind": "sec", "html": "<p><strong>政策类<\/strong>：只看官网原文。深大教务部（jwb.szu.edu.cn）、本科招生网（zs.szu.edu.cn）、各学院官网（ceie.szu.edu.cn 等）。第二册引用的每条政策都给了官网路径——养成”听到任何政策先找原文”的条件反射，二手信息（公众号、学长转述）只用于发现线索，不用于做决策。<\/p>\n<p><strong>技术类<\/strong>：论文看 arXiv 原文而非公众号解读；框架看 GitHub README 和官方文档而非中文教程；芯片参数看厂商 datasheet 而非数码媒体。主报告全文都遵循了这个纪律，你可以把它当模板。<\/p>\n<p><strong>提问前先搜索<\/strong>：查过搜索引擎、群文件、群公告再提问，是对他人时间的基本尊重，也是你判断信息渠道质量的机会。<\/p>", "text": "政策类：只看官网原文。深大教务部（jwb.szu.edu.cn）、本科招生网（zs.szu.edu.cn）、各学院官网（ceie.szu.edu.cn等）。第二册引用的每条政策都给了官网路径——养成”听到任何政策先找原文”的条件反射，二手信息（公众号、学长转述）只用于发现线索，不用于做决策。技术类：论文看arXiv原文而非公众号解读；框架看GitHubREADME和官方文档而非中文教程；芯片参数看厂商datasheet而非数码媒体。主报告全文都遵循了这个纪律，你可以把它当模板。提问前先搜索：查过搜索引擎、群文件、群公告再提问，是对他人时间的基本尊重，也是你判断信息渠道质量的机会。", "n": 293}, {"id": "c103", "vol": 3, "part": "第三部分 信息素养：差距的真正来源", "title": "3.2 深大具体的信息渠道", "page": 52, "kind": "sec", "html": "<p>教务部通知（选课、转专业、推免的原始文件都在此）；<\/p>\n<p>学院官网+学院公众号（特色班二次选拔、讲座、导师信息）；<\/p>\n<p>创新创业教育中心（大创、训练营）；<\/p>\n<p>图书馆（正版软件、数据库访问、信息素养讲座）；<\/p>\n<p>高年级学长群——但记住 3.1：群里听到的任何事，回官网核验。<\/p>", "text": "教务部通知（选课、转专业、推免的原始文件都在此）；学院官网+学院公众号（特色班二次选拔、讲座、导师信息）；创新创业教育中心（大创、训练营）；图书馆（正版软件、数据库访问、信息素养讲座）；高年级学长群——但记住3.1：群里听到的任何事，回官网核验。", "n": 123}, {"id": "c104", "vol": 3, "part": "第三部分 信息素养：差距的真正来源", "title": "3.3 一个可执行的习惯", "page": 53, "kind": "sec", "html": "<p><strong>每周花30分钟做”信息巡逻”<\/strong>：浏览教务部通知栏、学院官网新闻、目标导师主页的更新。这个习惯的复利极高——主报告和第二册里那些”有截止窗口的机会”，都是靠这个习惯才不会错过。<\/p>", "text": "每周花30分钟做”信息巡逻”：浏览教务部通知栏、学院官网新闻、目标导师主页的更新。这个习惯的复利极高——主报告和第二册里那些”有截止窗口的机会”，都是靠这个习惯才不会错过。", "n": 86}, {"id": "c105", "vol": 3, "part": "第四部分 选导师：比选方向更重要的选择", "title": "第四部分 选导师：比选方向更重要的选择", "page": 53, "kind": "part", "html": "<p>这是《生存手册》中最实用的章节之一，此处按深大情境改写。你在本科阶段会面临两次选导师：深大本校进组（大二前后）和保研/考研选导师（大三大四）。<\/p>", "text": "这是《生存手册》中最实用的章节之一，此处按深大情境改写。你在本科阶段会面临两次选导师：深大本校进组（大二前后）和保研/考研选导师（大三大四）。", "n": 71}, {"id": "c106", "vol": 3, "part": "第四部分 选导师：比选方向更重要的选择", "title": "4.1 导师的四种类型", "page": 53, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>类型<\/strong><\/th><th><strong>特征<\/strong><\/th><th><strong>适合谁<\/strong><\/th><th><strong>风险<\/strong><\/th><\/tr><\/thead><tbody><tr><td>大老板（院士/杰青级）<\/td><td>资源雄厚但不亲自带本科生，实际指导靠组内青年教师和博士生<\/td><td>目标明确、自驱力强、能在大组里抢到注意力的人<\/td><td>你可能一年见不到导师三次；跟到不靠谱的”小老板”需要运气<\/td><\/tr><tr><td>上升期青年教师（“青椒”）<\/td><td>亲自带学生、有论文压力、指导密度高<\/td><td><strong>本科进组的最优选择<\/strong>——你能得到真实的科研训练和一作机会<\/td><td>资源有限；个别青椒压力传导为学生的高强度push<\/td><\/tr><tr><td>养老型教授<\/td><td>职位稳定、动力不足、放养<\/td><td>只想要文凭的学生<\/td><td>毕业时成长有限<\/td><\/tr><tr><td>横向项目型教授<\/td><td>精力在公司和工程项目上<\/td><td>想积累工程经验、目标就业的人<\/td><td>容易沦为廉价劳动力；学术训练薄弱<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>对你的具体建议<\/strong>：本科第一段科研，优先选<strong>上升期青年教师<\/strong>（如主报告10.0节中核查过的那些课题组里，刚入职几年、主页更新频繁、近期有一作/通讯论文的老师），而不是名气最大的院士——院士组的资源轮不到本科生，青年教师的指导密度才是你需要的东西。保研选导师时再根据目标（学术/就业）重新评估。<\/p>", "text": "类型特征适合谁风险大老板（院士/杰青级）资源雄厚但不亲自带本科生，实际指导靠组内青年教师和博士生目标明确、自驱力强、能在大组里抢到注意力的人你可能一年见不到导师三次；跟到不靠谱的”小老板”需要运气上升期青年教师（“青椒”）亲自带学生、有论文压力、指导密度高本科进组的最优选择——你能得到真实的科研训练和一作机会资源有限；个别青椒压力传导为学生的高强度push养老型教授职位稳定、动力不足、放养只想要文凭的学生毕业时成长有限横向项目型教授精力在公司和工程项目上想积累工程经验、目标就业的人容易沦为廉价劳动力；学术训练薄弱对你的具体建议：本科第一段科研，优先选上升期青年教师（如主报告10.0节中核查过的那些课题组里，刚入职几年、主页更新频繁、近期有一作/通讯论文的老师），而不是名气最大的院士——院士组的资源轮不到本科生，青年教师的指导密度才是你需要的东西。保研选导师时再根据目标（学术/就业）重新评估。", "n": 401}, {"id": "c107", "vol": 3, "part": "第四部分 选导师：比选方向更重要的选择", "title": "4.2 五个可观察的硬指标", "page": 53, "kind": "sec", "html": "<p>1. <strong>在读学生的出路<\/strong>：组里近3年毕业的硕士/本科进组学生去了哪？这是”导师愿意为学生投入多少”的最终体现；<\/p>\n<p>2. <strong>在读学生平均发文情况<\/strong>：第一篇论文的发表耗时和质量；<\/p>\n<p>3. <strong>经费与资源<\/strong>：纵向项目（国自然等）与横向的比例；对学生是否舍得投入（设备、参会、补助）；<\/p>\n<p>4. <strong>指导频率<\/strong>：是否有固定的每周meeting；<\/p>\n<p>5. <strong>实验室文化<\/strong>：打卡要求、合作氛围、组内学生之间的关系。<\/p>\n<p>以上信息官方主页都不会写，唯一可靠的获取方式是 1.3 节的方法：私聊在读学生。<\/p>", "text": "1.在读学生的出路：组里近3年毕业的硕士/本科进组学生去了哪？这是”导师愿意为学生投入多少”的最终体现；2.在读学生平均发文情况：第一篇论文的发表耗时和质量；3.经费与资源：纵向项目（国自然等）与横向的比例；对学生是否舍得投入（设备、参会、补助）；4.指导频率：是否有固定的每周meeting；5.实验室文化：打卡要求、合作氛围、组内学生之间的关系。以上信息官方主页都不会写，唯一可靠的获取方式是1.3节的方法：私聊在读学生。", "n": 213}, {"id": "c108", "vol": 3, "part": "第四部分 选导师：比选方向更重要的选择", "title": "4.3 项目的质量识别", "page": 54, "kind": "sec", "html": "<p>警惕三类项目：题目空洞好大喜功的（“XX领域综合研究”）；实质是资料整理而非研究的；人数失控的（一个本科项目十几二十人，你在里面只会做分组和通知）。好项目的特征：<strong>有明确可检验的目标、你能说清楚自己的那部分贡献、结束时能留下可展示的成果<\/strong>（代码、论文、demo）。<\/p>", "text": "警惕三类项目：题目空洞好大喜功的（“XX领域综合研究”）；实质是资料整理而非研究的；人数失控的（一个本科项目十几二十人，你在里面只会做分组和通知）。好项目的特征：有明确可检验的目标、你能说清楚自己的那部分贡献、结束时能留下可展示的成果（代码、论文、demo）。", "n": 130}, {"id": "c109", "vol": 3, "part": "第五部分 选课与成绩的策略性管理", "title": "第五部分 选课与成绩的策略性管理", "page": 54, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c110", "vol": 3, "part": "第五部分 选课与成绩的策略性管理", "title": "5.1 选课是信息战", "page": 54, "kind": "sec", "html": "<p>《生存手册》的”广占坑、占好坑”讲的是交大选课系统的抢课策略，深大系统细节不同，但<strong>底层原则通用<\/strong>：<\/p>\n<p>开课前两周是情报收集期：向高年级学生打听同一门课不同任课老师的给分结构（平时分占比、考试难度），在补退选窗口内换到合适的班；<\/p>\n<p>对考试难度大、分数普遍不高的硬课（高数、大物、信号与系统），优先选平时成绩占比高的老师——平时分拿满比期末考满分容易得多；<\/p>\n<p>跨选计软学院的课（第二册1.3节已确认深大支持跨院系选课）补408缺口时，同样先打听给分情况再选。<\/p>", "text": "《生存手册》的”广占坑、占好坑”讲的是交大选课系统的抢课策略，深大系统细节不同，但底层原则通用：开课前两周是情报收集期：向高年级学生打听同一门课不同任课老师的给分结构（平时分占比、考试难度），在补退选窗口内换到合适的班；对考试难度大、分数普遍不高的硬课（高数、大物、信号与系统），优先选平时成绩占比高的老师——平时分拿满比期末考满分容易得多；跨选计软学院的课（第二册1.3节已确认深大支持跨院系选课）补408缺口时，同样先打听给分情况再选。", "n": 220}, {"id": "c111", "vol": 3, "part": "第五部分 选课与成绩的策略性管理", "title": "5.2 GPA 的工具属性", "page": 54, "kind": "sec", "html": "<p>绩点不是目的，是<strong>钥匙<\/strong>——它打开第二册里所有的门（文华班选拔、转专业、推免准入、夏令营初审）。策略含义：<\/p>\n<p>保研对成绩的要求是”<strong>首次通过率<\/strong>”——挂科后重修刷分在推免评价中通常不划算，所以每门硬课的第一遍就要投入到位；<\/p>\n<p>谨慎对待交换项目：交换学分转换可能出问题（只转Pass或延迟转入），在推免名额确定前造成风险——想交换的同学要提前向教务确认转换规则；<\/p>\n<p>合理配置课程难度：同一学期不要把所有硬课堆在一起，留一门”稳分课”平衡绩点波动。<\/p>", "text": "绩点不是目的，是钥匙——它打开第二册里所有的门（文华班选拔、转专业、推免准入、夏令营初审）。策略含义：保研对成绩的要求是”首次通过率”——挂科后重修刷分在推免评价中通常不划算，所以每门硬课的第一遍就要投入到位；谨慎对待交换项目：交换学分转换可能出问题（只转Pass或延迟转入），在推免名额确定前造成风险——想交换的同学要提前向教务确认转换规则；合理配置课程难度：同一学期不要把所有硬课堆在一起，留一门”稳分课”平衡绩点波动。", "n": 212}, {"id": "c112", "vol": 3, "part": "第五部分 选课与成绩的策略性管理", "title": "5.3 不要做的事", "page": 55, "kind": "sec", "html": "<p>不要为了一门水课的高分选它替代硬课——保研面试和考研复试看的是硬课成绩单；<\/p>\n<p>不要把所有希望押在绩点上放弃科研——电信学院44个推免名额的竞争中，“绩点高+零科研”会输给”绩点略低+有论文/项目”的组合（推免综合评价中学业约占70%，剩下30%正是科研竞赛）；<\/p>\n<p>更不要反过来为了科研让绩点跌破3.5准入线——<strong>两手都要，这就是这条路难走的原因，也是它值得走的原因<\/strong>。<\/p>", "text": "不要为了一门水课的高分选它替代硬课——保研面试和考研复试看的是硬课成绩单；不要把所有希望押在绩点上放弃科研——电信学院44个推免名额的竞争中，“绩点高+零科研”会输给”绩点略低+有论文/项目”的组合（推免综合评价中学业约占70%，剩下30%正是科研竞赛）；更不要反过来为了科研让绩点跌破3.5准入线——两手都要，这就是这条路难走的原因，也是它值得走的原因。", "n": 178}, {"id": "c113", "vol": 3, "part": "第六部分 三册联读：完整的决策地图", "title": "第六部分 三册联读：完整的决策地图", "page": 55, "kind": "part", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>册<\/strong><\/th><th><strong>回答的问题<\/strong><\/th><th><strong>什么时候用<\/strong><\/th><\/tr><\/thead><tbody><tr><td>第一册《Edge AI 全景调查报告》<\/td><td>这个<strong>方向<\/strong>值不值得走、哪个细分适合我<\/td><td>每学期重读一次，对照自己的实验结果更新判断<\/td><\/tr><tr><td>第二册《深大求学手册》<\/td><td>深大的<strong>制度<\/strong>里有哪些门、何时开<\/td><td>每个学期初对照第六章清单检查窗口期<\/td><\/tr><tr><td>第三册《本科生存指南》（本册）<\/td><td>如何在大学里<strong>正确地行动<\/strong>：思维、信息、选导师、选课<\/td><td>大一上学期通读，之后遇到具体决策（进组、选课、保研）时翻对应章节<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>最后一段（改自《生存手册》的结语精神）<\/strong>：这三册报告能给你的只是信息——信息只能消除”不知道自己不知道”的部分。真正决定四年后你在哪里的，是那些报告写不进来的东西：你在实验室熬过的夜、被示波器波形折磨过的下午、第一次让模型在30块钱的板子上跑起来时的那个瞬间。<strong>现在，合上报告，去做那个 ESP32 实验。<\/strong><\/p>\n<p><strong>致谢与说明<\/strong>：本册改写自《上海交通大学生存手册》（https://survivesjtu.gitbook.io/survivesjtumanual）中的通用经验章节（立志篇、访谈集、生存技巧），并向该项目开源贡献者致谢。所有迁移到深大情境的具体信息（制度、课题组、数据）均以第一、二册的官方来源核验为准。本册为经验方法类内容，不构成对任何具体导师、课程或个人的评价。<\/p>", "text": "册回答的问题什么时候用第一册《EdgeAI全景调查报告》这个方向值不值得走、哪个细分适合我每学期重读一次，对照自己的实验结果更新判断第二册《深大求学手册》深大的制度里有哪些门、何时开每个学期初对照第六章清单检查窗口期第三册《本科生存指南》（本册）如何在大学里正确地行动：思维、信息、选导师、选课大一上学期通读，之后遇到具体决策（进组、选课、保研）时翻对应章节最后一段（改自《生存手册》的结语精神）：这三册报告能给你的只是信息——信息只能消除”不知道自己不知道”的部分。真正决定四年后你在哪里的，是那些报告写不进来的东西：你在实验室熬过的夜、被示波器波形折磨过的下午、第一次让模型在30块钱的板子上跑起来时的那个瞬间。现在，合上报告，去做那个ESP32实验。致谢与说明：本册改写自《上海交通大学生存手册》（https://survivesjtu.gitbook.io/survivesjtumanual）中的通用经验章节（立志篇、访谈集、生存技巧），并向该项目开源贡献者致谢。所有迁移到深大情境的具体信息（制度、课题组、数据）均以第一、二册的官方来源核验为准。本册为经验方法类内容，不构成对任何具体导师、课程或个人的评价。", "n": 510}], "volmeta": {"1": {"num": "第一册", "title": "离线AI / 端侧AI / Edge AI / TinyML", "sub": "技术—产业—就业—学术—个人发展 全景调查报告"}, "2": {"num": "第二册", "title": "深圳大学求学手册", "sub": "培养方案 · 特色班 · 转专业 · 推免政策"}, "3": {"num": "第三册", "title": "本科生存指南", "sub": "心态 · 信息素养 · 选导师 · 选课策略"}}, "quick": [{"src": "assets/research-map.png", "title": "研究地图——你的研究处在分支的哪一环", "note": "用法：读论文、选课题、进实验室之前，先在图上定位——它解决哪一层的问题？受哪一层约束？改变哪一层的成本？各层对应的深大/浙大课题组详见第一册第九、十部分。"}, {"src": "assets/timeline.png", "title": "个人行动时间轴", "note": "红色=有截止窗口的制度性机会（错过即失）；蓝色=可自主掌控的能力建设。"}], "nchapters": 113, "total_chars": 37141};</script>
<script>
(function(){
  var D = window.DOC, C = D.chapters;
  var $ = function(s){ return document.querySelector(s); };
  var content = $('#content'), nav = $('#nav'), q = $('#q'), res = $('#searchres');
  var state = { cur: null };

  function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function strip(s){ var d = document.createElement('div'); d.innerHTML = s; return d.textContent || ''; }

  /* -------- 目录 -------- */
  function buildNav(){
    var h = '<div class="nv-vol" data-vol="q"><div class="nv-volh"><b>速查</b><span>研究地图 · 行动时间轴</span><span class="cv">▾</span></div><div class="nv-body">' +
            '<div class="nv-sec" data-go="quick">研究地图 & 个人行动时间轴</div></div></div>';
    D.nav.forEach(function(v){
      h += '<div class="nv-vol" data-vol="'+v.vol+'"><div class="nv-volh"><b>'+v.num+'</b><span>'+v.title+'</span><span class="cv">▾</span></div><div class="nv-body">';
      v.parts.forEach(function(p){
        h += '<div class="nv-part" data-go="'+(p.id||'')+'">'+p.title+'</div>';
        p.secs.forEach(function(s){ h += '<div class="nv-sec" data-go="'+s.id+'">'+s.title+'</div>'; });
      });
      h += '</div></div>';
    });
    nav.innerHTML = h;
    nav.addEventListener('click', function(e){
      var vol = e.target.closest('.nv-volh');
      if(vol){ vol.parentNode.classList.toggle('closed'); return; }
      var go = e.target.closest('[data-go]');
      if(go && go.getAttribute('data-go')){ location.hash = '#' + go.getAttribute('data-go'); closeSide(); }
    });
  }

  /* -------- 渲染章节 -------- */
  function render(id, anchor){
    if(id === 'quick'){ renderQuick(); return; }
    var c = C.filter(function(x){ return x.id === id; })[0]; if(!c) return;
    var vm = D.volmeta[String(c.vol)];
    state.cur = id;
    content.innerHTML =
      '<div class="chap-head">' +
        '<div class="chap-meta"><span class="pill">'+vm.num+'　'+vm.title+'</span>' +
        (c.part && c.part !== c.title ? '<span class="pill">'+c.part+'</span>' : '') +
        '<span class="pill">原书 p.'+c.page+'</span>' +
        '<span class="pill">'+c.n+' 字</span>' +
        '<button class="pill" id="copylink" style="border:none">复制本页链接</button></div>' +
        '<h1 class="chap-title">'+c.title+'</h1>' +
      '</div>' + c.html;
    document.title = c.title + ' · ' + D.title;
    var i = C.indexOf(c);
    var p = C[i-1], n = C[i+1];
    $('#prev').style.visibility = p ? 'visible' : 'hidden';
    $('#next').style.visibility = n ? 'visible' : 'hidden';
    if(p) $('#prev').innerHTML = '<span>上一节</span><b>'+p.title+'</b>', $('#prev').href = '#'+p.id;
    if(n) $('#next').innerHTML = '<span>下一节</span><b>'+n.title+'</b>', $('#next').href = '#'+n.id;
    $('#crumb').innerHTML = vm.num + ' · ' + (c.part && c.part !== c.title ? '<b>'+c.part+'</b> · ' : '') + '<b>'+c.title+'</b>';
    // 目录高亮
    [].forEach.call(nav.querySelectorAll('.nv-sec'), function(a){ a.classList.toggle('on', a.getAttribute('data-go') === id); });
    var act = nav.querySelector('.nv-sec.on'); if(act) act.scrollIntoView({block:'nearest'});
    var cl = $('#copylink');
    if(cl) cl.onclick = function(){ navigator.clipboard && navigator.clipboard.writeText(location.href); cl.textContent = '已复制 ✓'; setTimeout(function(){ cl.textContent = '复制本页链接'; }, 1600); };
    bindFigures();
    if(anchor) { var t = document.getElementById(anchor); if(t) t.scrollIntoView(); }
    else window.scrollTo(0,0);
    localStorage.setItem('wb-pos', id);
  }

  function renderQuick(){
    state.cur = 'quick';
    var h = '<div class="chap-head"><div class="chap-meta"><span class="pill">速查</span>' +
            '<span class="pill">全册 2 张图</span></div><h1 class="chap-title">研究地图 &amp; 个人行动时间轴</h1></div>';
    D.quick.forEach(function(q){
      h += '<figure><img src="'+q.src+'" alt="'+q.title+'" loading="lazy"><figcaption>'+q.title+'</figcaption>' +
           '<p class="small" style="text-align:center;margin-top:-0.4em">'+q.note+'</p></figure>';
    });
    content.innerHTML = h;
    document.title = '速查 · ' + D.title;
    $('#crumb').innerHTML = '速查 · <b>研究地图 &amp; 个人行动时间轴</b>';
    $('#prev').style.visibility = 'hidden';
    $('#next').style.visibility = 'visible';
    $('#next').innerHTML = '<span>开始阅读</span><b>'+ (C[0] ? C[0].title : '') +'</b>';
    $('#next').href = '#' + (C[0] ? C[0].id : '');
    [].forEach.call(nav.querySelectorAll('.nv-sec'), function(a){ a.classList.toggle('on', a.getAttribute('data-go') === 'quick'); });
    bindFigures();
    localStorage.setItem('wb-pos', 'quick');
    window.scrollTo(0,0);
  }

  function bindFigures(){
    [].forEach.call(content.querySelectorAll('figure img'), function(im){
      im.onclick = function(){ $('#lbimg').src = im.src; $('#lightbox').classList.add('on'); };
    });
  }

  /* -------- 路由 -------- */
  function route(){
    var h = decodeURIComponent(location.hash.replace(/^#/,''));
    if(!h) h = localStorage.getItem('wb-pos') || (C[0] && C[0].id);
    var id = h.split('+')[0];
    if(id !== 'quick' && !C.filter(function(x){ return x.id === id; })[0]) id = C[0].id;
    render(id, h.indexOf('+') > -1 ? h.split('+')[1] : null);
  }
  window.addEventListener('hashchange', route);

  /* -------- 搜索 -------- */
  function doSearch(){
    var s = q.value.trim();
    if(s.length < 1){ res.classList.remove('on'); res.innerHTML=''; clearHl(); return; }
    var re = new RegExp(esc(s), 'gi'), out = [], total = 0;
    C.forEach(function(c){
      var hay = c.title + ' ' + c.text;
      var m = hay.match(re); if(!m) return;
      total += m.length;
      var i = c.text.search(re);
      var snip = '';
      if(i > -1) snip = (i > 26 ? '…' : '') + c.text.slice(Math.max(0, i-26), i + 78) + '…';
      else snip = c.text.slice(0, 70) + '…';
      out.push({c:c, n:m.length, snip:snip, titleHit: re.test(c.title)});
      re.lastIndex = 0;
    });
    out.sort(function(a,b){ return (b.titleHit - a.titleHit) || (b.n - a.n); });
    if(!out.length){ res.innerHTML = '<div class="hint">没有找到「'+s+'」</div>'; res.classList.add('on'); return; }
    res.innerHTML = '<div class="hint">'+total+' 处匹配 · '+out.length+' 个章节</div>' + out.slice(0,14).map(function(o){
      var sn = o.snip.replace(/</g,'&lt;').replace(new RegExp(esc(s),'gi'), function(x){ return '<mark>'+x+'</mark>'; });
      return '<a href="#'+o.c.id+'" data-q="'+s.replace(/"/g,'&quot;')+'"><div class="rt">'+o.c.title+'</div>' +
             '<div class="rv">'+D.volmeta[String(o.c.vol)].num+' · '+o.c.part+' · 命中 '+o.n+' 处</div>' +
             '<div class="rs">'+sn+'</div></a>';
    }).join('');
    res.classList.add('on');
  }
  function clearHl(){
    [].forEach.call(content.querySelectorAll('mark.hl'), function(m){
      var t = document.createTextNode(m.textContent); m.parentNode.replaceChild(t, m);
    });
    content.normalize();
  }
  function highlight(s){
    if(!s) return;
    clearHl();
    var re = new RegExp(esc(s), 'gi'), nodes = [], w = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
    while(w.nextNode()){ var n = w.currentNode; if(n.nodeValue.trim() && !n.parentNode.closest('pre')) nodes.push(n); }
    var first = null;
    nodes.forEach(function(n){
      var s0 = n.nodeValue; re.lastIndex = 0;
      if(!re.test(s0)) return;
      re.lastIndex = 0;
      var frag = document.createDocumentFragment(), last = 0, m;
      while((m = re.exec(s0))){
        frag.appendChild(document.createTextNode(s0.slice(last, m.index)));
        var mk = document.createElement('mark'); mk.className = 'hl'; mk.textContent = m[0];
        frag.appendChild(mk); if(!first) first = mk;
        last = m.index + m[0].length;
        if(m[0].length === 0) re.lastIndex++;
      }
      frag.appendChild(document.createTextNode(s0.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
    if(first) setTimeout(function(){ first.scrollIntoView({block:'center'}); }, 60);
  }
  var tmr;
  q.addEventListener('input', function(){ clearTimeout(tmr); tmr = setTimeout(doSearch, 160); });
  res.addEventListener('click', function(e){
    var a = e.target.closest('a'); if(!a) return;
    var s = a.getAttribute('data-q');
    setTimeout(function(){ highlight(s); res.classList.remove('on'); }, 90);
    closeSide();
  });
  $('#qclr').onclick = function(){ q.value=''; res.classList.remove('on'); clearHl(); q.focus(); };
  $('#btn-search').onclick = function(){ openSide(); q.focus(); q.select(); };
  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); openSide(); q.focus(); }
    if(e.key === 'Escape'){ res.classList.remove('on'); clearHl(); q.blur(); $('#lightbox').classList.remove('on'); closeSide(); }
  });

  /* -------- 配色 / 侧栏 / 其它 -------- */
  function setTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('wb-theme', t);
    $('#btn-theme').innerHTML = (t === 'dark' ? '☀' : '◐') + '<span class="lb"> 配色</span>';
  }
  $('#btn-theme').onclick = function(){ setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); };
  $('#btn-print').onclick = function(){ window.print(); };
  function openSide(){ $('#sidebar').classList.add('on'); $('#scrim').classList.add('on'); }
  function closeSide(){ $('#sidebar').classList.remove('on'); $('#scrim').classList.remove('on'); }
  $('#burger').onclick = openSide;
  $('#scrim').onclick = closeSide;
  $('#totop').onclick = function(){ window.scrollTo({top:0, behavior:'smooth'}); };
  $('#lightbox').onclick = function(){ this.classList.remove('on'); };
  window.addEventListener('scroll', function(){
    var h = document.documentElement.scrollHeight - innerHeight;
    $('#progress').style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + '%';
    $('#totop').classList.toggle('on', scrollY > 600);
  });

  setTheme(localStorage.getItem('wb-theme') || 'light');
  buildNav();
  var totalChar = D.total_chars;
  $('#sidefoot').textContent = D.nchapters + ' 个章节 · 约 ' + (totalChar/10000).toFixed(1) + ' 万字 · 数据源自原 PDF';
  route();
  window.addEventListener('load', function(){
    if(!location.hash){ /* 首次进入：停留在上次位置，不隐藏 */ }
  });
})();
</script>
</body>
</html>
