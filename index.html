<html lang="zh-CN" data-theme="light">
<head>

<title>离线AI · 深大求学 · 生存指南（三册合订本）</title>

<style>
:root{
  --bg:#ffffff; --bg2:#f7f8fa; --bg3:#eef1f5; --text:#1f2328; --text2:#4b5563;
  --muted:#6b7280; --border:#e3e6ec; --border2:#d0d5dd; --accent:#2f5496; --accent2:#eaf0fa;
  --th:#f3f5f8; --zebra:#fafbfc; --code:#f5f7fa;
  --ok-bg:#e7f6ec; --ok-fg:#186d3c; --an-bg:#e9eff9; --an-fg:#2f5496;
  --fc-bg:#fdf1e0; --fc-fg:#9a5b00; --nv-bg:#f2eefb; --nv-fg:#6b46c1; --na-bg:#eef0f3; --na-fg:#5a6472;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
html[data-theme="dark"]{
  --bg:#15171c; --bg2:#1b1e25; --bg3:#22262e; --text:#e6e8eb; --text2:#c2c7cf;
  --muted:#98a1ad; --border:#2b3038; --border2:#3a414b; --accent:#7fa8e8; --accent2:#1d2734;
  --th:#232830; --zebra:#1a1d23; --code:#1e222a;
  --ok-bg:#16301f; --ok-fg:#79d29b; --an-bg:#1a2739; --an-fg:#9cc0f5;
  --fc-bg:#372a12; --fc-fg:#e8b76a; --nv-bg:#291f3d; --nv-fg:#bda6f0; --na-bg:#2a2e35; --na-fg:#a9b2be;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:15px; line-height:1.7;
}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--border2);
  border-radius:7px;padding:6px 11px;cursor:pointer;transition:.15s}
button:hover{background:var(--bg3);border-color:var(--accent)}
#progress{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:60;transition:width .1s}

/* ---------- 侧栏 ---------- */
#sidebar{position:fixed;inset:0 auto 0 0;width:308px;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:40}
.side-head{padding:18px 18px 12px;border-bottom:1px solid var(--border)}
.side-title{font-size:15px;font-weight:700;letter-spacing:.2px}
.side-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.searchbox{position:relative;margin-top:12px}
.searchbox input{width:100%;padding:9px 30px 9px 32px;border:1px solid var(--border2);border-radius:8px;
  background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.searchbox .ico{position:absolute;left:10px;top:8px;color:var(--muted);font-size:13px}
.searchbox .clr{position:absolute;right:6px;top:5px;border:none;background:none;font-size:15px;color:var(--muted);padding:2px 6px}
#searchres{display:none;margin-top:10px;max-height:52vh;overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
#searchres.on{display:block}
#searchres .hint{font-size:12px;color:var(--muted);padding:8px 10px}
#searchres a{display:block;padding:9px 11px;border-bottom:1px solid var(--border);color:var(--text)}
#searchres a:last-child{border-bottom:none}
#searchres a:hover{background:var(--accent2)}
#searchres .rt{font-size:12.5px;font-weight:600;line-height:1.5}
#searchres .rv{font-size:11px;color:var(--muted);margin-top:2px}
#searchres .rs{font-size:11.5px;color:var(--text2);margin-top:3px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#searchres mark{background:#fff3b0;color:#5a4500;padding:0 1px;border-radius:2px}
html[data-theme="dark"] #searchres mark{background:#5c4b12;color:#ffe9a3}
#nav{flex:1;overflow-y:auto;padding:10px 0 24px}
#nav::-webkit-scrollbar,#searchres::-webkit-scrollbar{width:9px}
#nav::-webkit-scrollbar-thumb,#searchres::-webkit-scrollbar-thumb{background:var(--border2);border-radius:9px}
.nv-vol{margin:12px 10px 4px;border-radius:9px;background:var(--bg);border:1px solid var(--border);overflow:hidden}
.nv-volh{display:flex;gap:8px;align-items:baseline;padding:9px 11px;cursor:pointer;user-select:none}
.nv-volh b{font-size:12.5px;color:var(--accent)}
.nv-volh span{font-size:12.5px;font-weight:600}
.nv-volh .cv{margin-left:auto;color:var(--muted);font-size:10px;transition:.2s}
.nv-vol.closed .cv{transform:rotate(-90deg)}
.nv-vol.closed .nv-body{display:none}
.nv-body{padding:2px 0 8px}
.nv-part{padding:6px 11px 3px;font-size:11.5px;font-weight:700;color:var(--text2);cursor:pointer;letter-spacing:.2px}
.nv-part:hover{color:var(--accent)}
.nv-sec{display:block;padding:4px 11px 4px 20px;font-size:12.5px;color:var(--text2);border-left:2px solid transparent;cursor:pointer}
.nv-sec:hover{background:var(--accent2);color:var(--text)}
.nv-sec.on{background:var(--accent2);color:var(--accent);font-weight:600;border-left-color:var(--accent)}
.side-foot{padding:9px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

/* ---------- 主区 ---------- */
#main{margin-left:308px;min-height:100vh;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:12px;padding:11px 28px;min-height:56px}
#crumb{font-size:12.5px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumb b{color:var(--text)}
.actions{display:flex;gap:8px;flex-shrink:0}
#burger{display:none}
#content{flex:1;width:100%;max-width:880px;margin:0 auto;padding:34px 28px 80px;
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,Georgia,serif}
.chap-head{margin-bottom:22px;padding-bottom:16px;border-bottom:2px solid var(--border)}
.chap-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:11.5px;color:var(--muted);margin-bottom:10px}
.chap-meta .pill{background:var(--bg3);border-radius:20px;padding:2px 10px}
.chap-title{font-size:27px;line-height:1.4;font-weight:700;margin:0;letter-spacing:.3px}
#content h1{font-size:25px}
#content p{margin:0 0 1.05em;text-align:justify;font-size:17px;line-height:1.95}
#content p.small{font-size:14.5px;color:var(--text2);line-height:1.8}
#content p.note{background:var(--bg2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:12px 16px;color:var(--text2);font-size:15.5px}
#content pre{background:var(--code);border:1px solid var(--border);border-radius:9px;padding:15px 17px;overflow:auto;
  font-family:"DejaVu Sans Mono",Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.62;color:var(--text2)}
#content .tablewrap{overflow-x:auto;margin:0 0 1.4em;border:1px solid var(--border);border-radius:10px}
#content table{border-collapse:collapse;width:100%;font-family:-apple-system,"Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:13.5px}
#content th{background:var(--th);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--border2);
  border-right:1px solid var(--border);white-space:nowrap}
#content td{padding:9px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);vertical-align:top;line-height:1.62}
#content tr:last-child td{border-bottom:none}
#content th:last-child,#content td:last-child{border-right:none}
#content tbody tr:nth-child(even){background:var(--zebra)}
#content figure{margin:0 0 1.5em;text-align:center}
#content figure img{max-width:100%;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;cursor:zoom-in}
#content figcaption{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px;color:var(--muted);margin-top:8px}
.cite{color:var(--accent);font-size:.94em}
.dim{color:var(--muted)}
.tag{display:inline-block;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:.78em;
  line-height:1.7;padding:0 7px;border-radius:5px;white-space:nowrap;font-weight:600;vertical-align:1px}
.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}
.tag.an{background:var(--an-bg);color:var(--an-fg)}
.tag.fc{background:var(--fc-bg);color:var(--fc-fg)}
.tag.nv{background:var(--nv-bg);color:var(--nv-fg)}
.tag.na{background:var(--na-bg);color:var(--na-fg)}
mark.hl{background:#ffe27a;color:#3d2f00;border-radius:3px;padding:0 2px}
html[data-theme="dark"] mark.hl{background:#6b5510;color:#ffe9a3}
.pager{max-width:880px;margin:0 auto;padding:0 28px 60px;display:flex;gap:14px;justify-content:space-between}
.pager a{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px 15px;background:var(--bg2);line-height:1.5}
.pager a:hover{border-color:var(--accent);background:var(--accent2)}
.pager a span{display:block;font-size:11px;color:var(--muted)}
.pager a b{font-size:13px;font-weight:600}
.pager a.next{text-align:right}
.foot{max-width:880px;margin:0 auto;padding:0 28px 60px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.8}
#totop{position:fixed;right:24px;bottom:24px;width:42px;height:42px;border-radius:50%;box-shadow:var(--shadow);
  display:none;z-index:45;font-size:16px;padding:0}
#totop.on{display:block}
#lightbox{position:fixed;inset:0;background:rgba(10,12,16,.88);display:none;z-index:80;overflow:auto;padding:32px 20px}
#lightbox.on{display:block}
#lightbox img{display:block;max-width:none;margin:0 auto;background:#fff;border-radius:10px;padding:14px;width:1400px;max-width:100%}
#lightbox .lb-hint{color:#c9cfd8;text-align:center;font-size:12px;margin-top:12px}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
@media (max-width:1060px){
  #sidebar{transform:translateX(-100%);transition:.22s;box-shadow:var(--shadow);width:300px}
  #sidebar.on{transform:none}
  #main{margin-left:0}
  #burger{display:inline-block}
  #scrim.on{display:block}
  .actions button .lb{display:none}
}
@media print{
  #sidebar,#topbar,#progress,#totop,#burger,#scrim,#lightbox,#searchres,
  .pager,.chap-meta .pill,.chap-meta .copy{display:none!important}
  #main{margin:0}
  #content{max-width:none;padding:0}
  #content p{font-size:11.5pt;line-height:1.8}
  #content h1{font-size:17pt}
  #content h2{font-size:13.5pt}
  .tablewrap{overflow:visible}
  #content table{font-size:9pt}
  #content pre{overflow:visible;font-size:8.4pt;line-height:1.35;white-space:pre}
  #content figure img{max-height:150mm;width:auto}
  a{color:inherit}
}
</style>

年方向选择决策参考<\/strong><\/p>\n<p>报告性质：深度调查报告（非科普文章）<\/p>\n<p>决策背景：深圳大学电子信息工程方向（2026年入学），保研/考研目标重点考虑浙江大学，兼顾本科就业<\/p>\n<p>调研基准时间：2026年10月；产业与技术数据优先采用2024–2026年来源<\/p>\n<p>报告日期：2026年10月<\/p>", "text": "——面向2026级电子信息本科生的4–8年方向选择决策参考报告性质：深度调查报告（非科普文章）决策背景：深圳大学电子信息工程方向（2026年入学），保研/考研目标重点考虑浙江大学，兼顾本科就业调研基准时间：2026年10月；产业与技术数据优先采用2024–2026年来源报告日期：2026年10月", "n": 148}, {"id": "c2", "vol": 1, "part": "开篇", "title": "阅读指南：证据分级与使用约定", "page": 8, "kind": "sec", "html": "<p>本报告对所有关键信息做如下分级标注：<\/p>\n<p><strong><span class=\"tag ok\">已证实<\/span><\/strong>：有企业官网、学校官网、导师/实验室主页、论文、招聘JD、上市公司财报、政府文件或权威机构报告等直接证据。<\/p>\n<p><strong><span class=\"tag an\">行业分析<\/span><\/strong>：基于多份资料的合理归纳，不是任何单一机构的直接结论。<\/p>\n<p><strong><span class=\"tag fc\">预测<\/span><\/strong>：对未来的判断，可能出错，请按”观点”而非”事实”对待。<\/p>\n<p><strong><span class=\"tag nv\">待核实<\/span><\/strong>：无法找到可靠直接证据，报告中给出进一步核实的关键词或官网入口。<\/p>\n<p><strong>三条重要使用约定：<\/strong><\/p>\n<p>1. 薪资数字全部来自招聘广告区间或平台统计报告，<strong>不是权威薪酬调查<\/strong>，只能用于量级参考；招聘广告中的薪资通常偏乐观（用于吸引投递）。<\/p>\n<p>2. 市场规模数据各机构口径差异极大（本报告第一部分将专门展示这种分歧），请只相信数量级，不要相信精确值。<\/p>\n<p>3. 涉及具体导师招生情况的信息具有强时效性，本报告仅锁定”研究组真实存在且方向匹配”，<strong>招生名额、是否接收保研生等必须在报考当年以官网和直接联系导师为准<\/strong>。<\/p>", "text": "本报告对所有关键信息做如下分级标注：【已证实】：有企业官网、学校官网、导师/实验室主页、论文、招聘JD、上市公司财报、政府文件或权威机构报告等直接证据。【行业分析】：基于多份资料的合理归纳，不是任何单一机构的直接结论。【预测】：对未来的判断，可能出错，请按”观点”而非”事实”对待。【待核实】：无法找到可靠直接证据，报告中给出进一步核实的关键词或官网入口。三条重要使用约定：1.薪资数字全部来自招聘广告区间或平台统计报告，不是权威薪酬调查，只能用于量级参考；招聘广告中的薪资通常偏乐观（用于吸引投递）。2.市场规模数据各机构口径差异极大（本报告第一部分将专门展示这种分歧），请只相信数量级，不要相信精确值。3.涉及具体导师招生情况的信息具有强时效性，本报告仅锁定”研究组真实存在且方向匹配”，招生名额、是否接收保研生等必须在报考当年以官网和直接联系导师为准。", "n": 379}, {"id": "c3", "vol": 1, "part": "开篇", "title": "执行摘要（TL;DR）", "page": 8, "kind": "sec", "html": "<p><strong>Edge AI 是一个真实且正在放大的产业方向，但它不是单一赛道<\/strong>，而是横跨”MCU级TinyML—手机/嵌入式SoC—端侧大模型—机器人/车载—AI芯片”的连续谱。谱系上不同位置的就业门槛、学历要求、AI替代风险完全不同。<\/p>\n<p>全球 Edge AI 市场2025年约 <strong>250–356 亿美元<\/strong>（四家机构口径），2026年预计 300–470 亿美元，年增速 20%–30% 量级【已证实，口径分歧见正文】。GenAI 手机出货占比将从2025年的36%升至2026年的45%（Counterpoint）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p><strong>对”软硬件结合+深圳/长三角就业+AI替代风险低”三个标准匹配度最高的细分<\/strong>，证据指向两个方向：<strong>（1）端侧推理系统/AI编译器/部署优化<\/strong>（软件为主、紧贴硬件，本科可入行、硕士明显加分、岗位横跨互联网/芯片/机器人/车企）；<strong>（2）AI芯片/NPU软硬件协同<\/strong>（壁垒最高、AI替代风险最低，但基本要硕士起步、读博价值大）。TinyML 单独作为主方向则岗位面偏窄，更适合作为入门练兵而非终点<span class=\"tag an\">行业分析<\/span>。<\/p>\n<p>浙江大学与该方向高度匹配的研究组真实存在：信电学院<strong>尹勋钊（存算一体/软硬件跨层协同）<\/strong>、<strong>赵亮（存内计算与类脑芯片）<\/strong>、<strong>黄科杰（深度学习加速器）<\/strong>；计算机学院 <strong>ARCLab（陈文智）<\/strong>、<strong>EmNets（董玮/高艺）<\/strong>、<strong>RC4ML（王则可）<\/strong>、<strong>智能存算系统实验室（孙贤和/何水兵）<\/strong>；微纳电子学院<strong>微纳电子前沿技术研究所（俞滨、徐杨等）<\/strong>等【已证实，详见第九部分】。<\/p>\n<p>大一上学期<strong>不应该<\/strong>直接扎进 Transformer/LLM 论文，而应该用每周3–5小时完成一条”ESP32+TinyML→树莓派+NCNN→端侧小模型”的低成本实证路线（总预算可控制在300–1500元人民币），先把”自己是否真喜欢软硬结合”这个假设验证掉<span class=\"tag an\">行业分析<\/span>。<\/p>", "text": "EdgeAI是一个真实且正在放大的产业方向，但它不是单一赛道，而是横跨”MCU级TinyML—手机/嵌入式SoC—端侧大模型—机器人/车载—AI芯片”的连续谱。谱系上不同位置的就业门槛、学历要求、AI替代风险完全不同。全球EdgeAI市场2025年约250–356亿美元（四家机构口径），2026年预计300–470亿美元，年增速20%–30%量级【已证实，口径分歧见正文】。GenAI手机出货占比将从2025年的36%升至2026年的45%（Counterpoint）【已证实】。对”软硬件结合+深圳/长三角就业+AI替代风险低”三个标准匹配度最高的细分，证据指向两个方向：（1）端侧推理系统/AI编译器/部署优化（软件为主、紧贴硬件，本科可入行、硕士明显加分、岗位横跨互联网/芯片/机器人/车企）；（2）AI芯片/NPU软硬件协同（壁垒最高、AI替代风险最低，但基本要硕士起步、读博价值大）。TinyML单独作为主方向则岗位面偏窄，更适合作为入门练兵而非终点【行业分析】。浙江大学与该方向高度匹配的研究组真实存在：信电学院尹勋钊（存算一体/软硬件跨层协同）、赵亮（存内计算与类脑芯片）、黄科杰（深度学习加速器）；计算机学院ARCLab（陈文智）、EmNets（董玮/高艺）、RC4ML（王则可）、智能存算系统实验室（孙贤和/何水兵）；微纳电子学院微纳电子前沿技术研究所（俞滨、徐杨等）等【已证实，详见第九部分】。大一上学期不应该直接扎进Transformer/LLM论文，而应该用每周3–5小时完成一条”ESP32+TinyML→树莓派+NCNN→端侧小模型”的低成本实证路线（总预算可控制在300–1500元人民币），先把”自己是否真喜欢软硬结合”这个假设验证掉【行业分析】。", "n": 741}, {"id": "c4", "vol": 1, "part": "第一部分 重新定义”离线AI”：概念体系与边界", "title": "第一部分 重新定义”离线AI”：概念体系与边界", "page": 9, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c5", "vol": 1, "part": "第一部分 重新定义”离线AI”：概念体系与边界", "title": "1.1 五个概念不是同义词", "page": 9, "kind": "sec", "html": "<p>行业里”离线AI”“端侧AI”“Edge AI”“TinyML”经常被混用，但它们描述的是<strong>不同维度的属性<\/strong>，必须先拆开。<\/p>\n<p><strong>Cloud AI（云端AI）<\/strong>：模型训练与推理发生在数据中心，设备只是输入输出终端。典型代表是调用 GPT、Claude、Qwen 云端 API。<\/p>\n<p><strong>Edge Computing（边缘计算）<\/strong>：一个<strong>计算架构概念<\/strong>，指计算发生在靠近数据源的网络边缘（基站侧MEC、园区网关、车载计算平台、工厂边缘服务器都算）。它回答的是”计算放在网络拓扑的哪个位置”。<\/p>\n<p><strong>Edge AI（边缘AI）<\/strong>：在边缘计算节点上运行AI。注意它的载体可以是机房级的边缘服务器（如NVIDIA Jetson AGX Thor 这类 40–130W 的平台），不一定是”小设备”。<\/p>\n<p><strong>On-device AI（端侧AI/设备端AI）<\/strong>：强调<strong>模型运行在用户持有的终端设备上<\/strong>——手机、PC、眼镜、手表、机器人本体。它回答的是”计算放在谁的设备上”，核心动机是隐私、延迟和离线可用。Google 的 Gemma 3n 官方定位即是”privacy-first, offline-ready”的设备端模型（<span class=\"cite\">Google Deep Mind<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p><strong>TinyML<\/strong>：特指在<strong>微控制器（MCU）级<\/strong>资源上运行机器学习——典型约束是几百KB的RAM、1–2MB的Flash、mW级功耗。MIT HAN Lab 的 MCUNet 即是”在只有1MB Flash的IoT设备上实现ImageNet级推理”的代表工作（<span class=\"cite\">MIT HAN Lab<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p>因此正确的关系是：<strong>TinyML ⊂ On-device AI ⊂ Edge AI ⊂ Edge Computing<\/strong>，而”离线AI”不是技术分层，而是一种<strong>运行状态描述<\/strong>（不依赖网络连接）。<\/p>\n<pre>Cloud AI（数据中心训练+推理）\n  └── Edge Computing（计算靠近数据源：边缘服务器/网关/基站）\n        └── Edge AI（边缘节点上的AI推理）\n└── On-device AI（用户终端上的AI：手机/PC/眼镜/机器人）\n                    └── TinyML（MCU级：KB级RAM、mW级功耗）<\/pre>", "text": "行业里”离线AI”“端侧AI”“EdgeAI”“TinyML”经常被混用，但它们描述的是不同维度的属性，必须先拆开。CloudAI（云端AI）：模型训练与推理发生在数据中心，设备只是输入输出终端。典型代表是调用GPT、Claude、Qwen云端API。EdgeComputing（边缘计算）：一个计算架构概念，指计算发生在靠近数据源的网络边缘（基站侧MEC、园区网关、车载计算平台、工厂边缘服务器都算）。它回答的是”计算放在网络拓扑的哪个位置”。EdgeAI（边缘AI）：在边缘计算节点上运行AI。注意它的载体可以是机房级的边缘服务器（如NVIDIAJetsonAGXThor这类40–130W的平台），不一定是”小设备”。On-deviceAI（端侧AI/设备端AI）：强调模型运行在用户持有的终端设备上——手机、PC、眼镜、手表、机器人本体。它回答的是”计算放在谁的设备上”，核心动机是隐私、延迟和离线可用。Google的Gemma3n官方定位即是”privacy-first,offline-ready”的设备端模型（GoogleDeepMind）【已证实】。TinyML：特指在微控制器（MCU）级资源上运行机器学习——典型约束是几百KB的RAM、1–2MB的Flash、mW级功耗。MITHANLab的MCUNet即是”在只有1MBFlash的IoT设备上实现ImageNet级推理”的代表工作（MITHANLab）【已证实】。因此正确的关系是：TinyML⊂On-deviceAI⊂EdgeAI⊂EdgeComputing，而”离线AI”不是技术分层，而是一种运行状态描述（不依赖网络连接）。CloudAI（数据中心训练+推理）└──EdgeComputing（计算靠近数据源：边缘服务器/网关/基站）└──EdgeAI（边缘节点上的AI推理）└──On-deviceAI（用户终端上的AI：手机/PC/眼镜/机器人）└──TinyML（MCU级：KB级RAM、mW级功耗）", "n": 843}, {"id": "c6", "vol": 1, "part": "第一部分 重新定义”离线AI”：概念体系与边界", "title": "1.2 四维对比表", "page": 10, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>维度<\/strong><\/th><th><strong>云端AI<\/strong><\/th><th><strong>Edge AI<\/strong>（<strong>边缘服务<\/strong>器<strong>/网关<\/strong>）<\/th><th><strong>On-device AI<\/strong>（<strong>手机/PC/眼镜<\/strong>）<\/th><th><strong>TinyML<\/strong>（<strong>MCU<\/strong>）<\/th><\/tr><\/thead><tbody><tr><td>数据位置<\/td><td>上传到云端<\/td><td>本地园区/车端<\/td><td>设备本地<\/td><td>设备本地<\/td><\/tr><tr><td>网络依赖<\/td><td>强依赖<\/td><td>弱依赖（通常联网协同）<\/td><td>可完全离线<\/td><td>通常完全离线<\/td><\/tr><tr><td>延迟<\/td><td>百毫秒级+网络波动<\/td><td>十毫秒级<\/td><td>毫秒级<\/td><td>毫秒级、确定性最高<\/td><\/tr><tr><td>隐私<\/td><td>数据离设备<\/td><td>数据不出园区/车<\/td><td>数据不出设备<\/td><td>数据不出设备<\/td><\/tr><tr><td>功耗<\/td><td>设备端几乎为零（服务器承担）<\/td><td>几十至几百瓦<\/td><td>瓦级（受电池约束）<\/td><td>毫瓦级<\/td><\/tr><tr><td>算力<\/td><td>千卡集群<\/td><td>几十至数千TOPS<\/td><td>几十TOPS级NPU<\/td><td>GOPS级以下<\/td><\/tr><tr><td>模型规模<\/td><td>千亿参数级<\/td><td>十亿至百亿参数级<\/td><td>1B–10B级（量化后）<\/td><td>10KB–1MB级模型<\/td><\/tr><tr><td>成本结构<\/td><td>按token/时长持续付费<\/td><td>设备+运维<\/td><td>一次性硬件成本<\/td><td>芯片成本可低至数元人民币<\/td><\/tr><tr><td>典型设备<\/td><td>GPU服务器<\/td><td>Jetson Thor、Atlas边缘卡、车载域控<\/td><td>手机SoC、AI PC、AI眼镜<\/td><td>STM32、ESP32-S3、传感器节点<\/td><\/tr><tr><td>典型应用<\/td><td>通用对话、训练<\/td><td>工厂质检、城区NOA智驾<\/td><td>端侧助手、实时翻译、影像增强<\/td><td>关键词唤醒、振动异常检测、姿态识别<\/td><\/tr><\/tbody><\/table><\/div>", "text": "维度云端AIEdgeAI（边缘服务器/网关）On-deviceAI（手机/PC/眼镜）TinyML（MCU）数据位置上传到云端本地园区/车端设备本地设备本地网络依赖强依赖弱依赖（通常联网协同）可完全离线通常完全离线延迟百毫秒级+网络波动十毫秒级毫秒级毫秒级、确定性最高隐私数据离设备数据不出园区/车数据不出设备数据不出设备功耗设备端几乎为零（服务器承担）几十至几百瓦瓦级（受电池约束）毫瓦级算力千卡集群几十至数千TOPS几十TOPS级NPUGOPS级以下模型规模千亿参数级十亿至百亿参数级1B–10B级（量化后）10KB–1MB级模型成本结构按token/时长持续付费设备+运维一次性硬件成本芯片成本可低至数元人民币典型设备GPU服务器JetsonThor、Atlas边缘卡、车载域控手机SoC、AIPC、AI眼镜STM32、ESP32-S3、传感器节点典型应用通用对话、训练工厂质检、城区NOA智驾端侧助手、实时翻译、影像增强关键词唤醒、振动异常检测、姿态识别", "n": 431}, {"id": "c7", "vol": 1, "part": "第一部分 重新定义”离线AI”：概念体系与边界", "title": "1.3 两个必须澄清的问题", "page": 10, "kind": "sec", "html": "<p><strong>“离线AI是否一定意味着完全不联网？”——不是。<\/strong><span class=\"tag an\">行业分析<\/span>“离线”在工程上通常指<strong>推理闭环不依赖网络<\/strong>，而不是设备物理断网。实际产品普遍是”端侧推理为主、云端协同为辅”：例如智能眼镜的语音唤醒和降噪在本地完成、复杂问答回传云端；IDC数据显示2025年中国智能眼镜中支持大模型语音助手的产品比例已达50.5%，但这些产品绝大多数采用端云混合架构（<span class=\"cite\">IDC中国<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p><strong>“为什么实际产品多用云—边—端协同，而不是纯端侧AI？”——因为纯端侧在三个硬约束下做不到全能：<\/strong><span class=\"tag an\">行业分析<\/span><\/p>\n<p>1. <strong>内存墙<\/strong>：端侧设备的可用内存和带宽装不下大模型。端侧LLM的首要瓶颈是内存容量与带宽而非算力——这也是为何 Gemma 3n 要用 Per-Layer Embeddings（PLE）把5B/8B原始参数压到等效2B/4B的内存占用（2GB/3GB）才能在手机上跑（<span class=\"cite\">InfoWorld<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p>2. <strong>能力天花板<\/strong>：端侧7B量化模型与云端大模型存在可测量的质量差距。工程社区的实测结论是：端侧 7B Q4 量化模型的首 token 延迟比云端 API 快5–10倍，但复杂任务质量显著低于云端70B级模型，因此”端云协同”被普遍视为最佳实践（<span class=\"cite\">腾讯云开发者社区<\/span>）【行业分析，单一来源】。<\/p>\n<p>3. <strong>成本结构<\/strong>：对厂商而言，端侧推理把每次调用的边际成本从”厂商付云账单”变成”用户付购机成本”，这是AI手机/AI PC商业逻辑的核心驱动力之一；反之，当云端推理价格持续下降时，一部分端侧需求会被重新吸回云端——这是本报告第八部分讨论的核心风险。<\/p>", "text": "“离线AI是否一定意味着完全不联网？”——不是。【行业分析】“离线”在工程上通常指推理闭环不依赖网络，而不是设备物理断网。实际产品普遍是”端侧推理为主、云端协同为辅”：例如智能眼镜的语音唤醒和降噪在本地完成、复杂问答回传云端；IDC数据显示2025年中国智能眼镜中支持大模型语音助手的产品比例已达50.5%，但这些产品绝大多数采用端云混合架构（IDC中国）【已证实】。“为什么实际产品多用云—边—端协同，而不是纯端侧AI？”——因为纯端侧在三个硬约束下做不到全能：【行业分析】1.内存墙：端侧设备的可用内存和带宽装不下大模型。端侧LLM的首要瓶颈是内存容量与带宽而非算力——这也是为何Gemma3n要用Per-LayerEmbeddings（PLE）把5B/8B原始参数压到等效2B/4B的内存占用（2GB/3GB）才能在手机上跑（InfoWorld）【已证实】。2.能力天花板：端侧7B量化模型与云端大模型存在可测量的质量差距。工程社区的实测结论是：端侧7BQ4量化模型的首token延迟比云端API快5–10倍，但复杂任务质量显著低于云端70B级模型，因此”端云协同”被普遍视为最佳实践（腾讯云开发者社区）【行业分析，单一来源】。3.成本结构：对厂商而言，端侧推理把每次调用的边际成本从”厂商付云账单”变成”用户付购机成本”，这是AI手机/AIPC商业逻辑的核心驱动力之一；反之，当云端推理价格持续下降时，一部分端侧需求会被重新吸回云端——这是本报告第八部分讨论的核心风险。", "n": 639}, {"id": "c8", "vol": 1, "part": "第一部分 重新定义”离线AI”：概念体系与边界", "title": "1.4 市场规模与渗透率：事实与预测的分界", "page": 11, "kind": "sec", "html": "<p><strong>市场规模口径分歧【已证实存在分歧】<\/strong>：四家市场研究机构对全球 Edge AI 市场2025年规模的估计从约250亿美元到356亿美元不等（相差42%），2026年预计300–470亿美元，远期（2030年前后）预测分歧更大。GMI 估计2025年约252亿美元、2030年约309亿后加速（<span class=\"cite\">GMI<\/span>）；Grand View Research约249 亿美元（<span class=\"cite\">Grand View Research<\/span> ）；Fortune Business Insights 约356 亿美元（<span class=\"cite\">Fortune BI<\/span> ）；Precedence Research 约256亿美元（<span class=\"cite\">Precedence<\/span>）。<strong>结论只应取数量级：数百亿美元级、年增速20%–30%量级<\/strong>；任何引用单一机构精确值做决策的行为都不可靠。<\/p>\n<figure><img src=\"assets/fig1-market-size.png\" alt=\"图1 四家机构对全球Edge AI市场规模的估计（2025/2026年，亿美元）——口径分歧本身就是重要信息\" loading=\"lazy\"><figcaption>图1 四家机构对全球Edge AI市场规模的估计（2025/2026年，亿美元）——口径分歧本身就是重要信息<\/figcaption><\/figure>\n<p><strong>渗透率数据【已证实+预测】<\/strong>：相比”市场规模”这类机构估算，<strong>出货量与渗透率是更硬的事实锚<\/strong>。Canalys 统计中国 AI PC 渗透率2023年8%→2024年15%→2025年34%，并预测2026年52%、2028年73%；Counterpoint 统计全球 GenAI 手机出货占比2025年36%、预计2026年45%、2027年52%（<span class=\"cite\">Counterpoint<\/span>）。注意：2026年及以后的数字均为<strong>预测<\/strong>，且不同机构预测分歧巨大（Gartner 预计2026年AI PC占54.7%，摩根士丹利口径仅约28%（<span class=\"cite\">accpc整理<\/span>））——本报告始终将预测标注为<span class=\"tag fc\">预测<\/span>，请按观点对待。<\/p>\n<figure><img src=\"assets/fig2-penetration.png\" alt=\"图2 AI PC与GenAI手机渗透率（实线为已发生统计，虚线为机构预测）\" loading=\"lazy\"><figcaption>图2 AI PC与GenAI手机渗透率（实线为已发生统计，虚线为机构预测）<\/figcaption><\/figure>", "text": "市场规模口径分歧【已证实存在分歧】：四家市场研究机构对全球EdgeAI市场2025年规模的估计从约250亿美元到356亿美元不等（相差42%），2026年预计300–470亿美元，远期（2030年前后）预测分歧更大。GMI估计2025年约252亿美元、2030年约309亿后加速（GMI）；GrandViewResearch约249亿美元（GrandViewResearch）；FortuneBusinessInsights约356亿美元（FortuneBI）；PrecedenceResearch约256亿美元（Precedence）。结论只应取数量级：数百亿美元级、年增速20%–30%量级；任何引用单一机构精确值做决策的行为都不可靠。渗透率数据【已证实+预测】：相比”市场规模”这类机构估算，出货量与渗透率是更硬的事实锚。Canalys统计中国AIPC渗透率2023年8%→2024年15%→2025年34%，并预测2026年52%、2028年73%；Counterpoint统计全球GenAI手机出货占比2025年36%、预计2026年45%、2027年52%（Counterpoint）。注意：2026年及以后的数字均为预测，且不同机构预测分歧巨大（Gartner预计2026年AIPC占54.7%，摩根士丹利口径仅约28%（accpc整理））——本报告始终将预测标注为【预测】，请按观点对待。", "n": 602}, {"id": "c9", "vol": 1, "part": "第二部分 Edge AI 技术地图", "title": "第二部分 Edge AI 技术地图", "page": 12, "kind": "part", "html": "<p>本部分的目标不是罗列名词，而是把”从模型到硅片”的完整技术栈建立起来。六个子方向（A–F）自下而上构成：<strong>芯片（F）承载推理系统（E），推理系统执行被压缩（D）后的模型（A/B/C）<\/strong>。<\/p>", "text": "本部分的目标不是罗列名词，而是把”从模型到硅片”的完整技术栈建立起来。六个子方向（A–F）自下而上构成：芯片（F）承载推理系统（E），推理系统执行被压缩（D）后的模型（A/B/C）。", "n": 91}, {"id": "c10", "vol": 1, "part": "第二部分 Edge AI 技术地图", "title": "A. TinyML：MCU 上的机器学习", "page": 12, "kind": "sec", "html": "<p><strong>技术边界<span class=\"tag ok\">已证实<\/span><\/strong>：TinyML 的目标平台是 Cortex-M 级 MCU 与同级 SoC（STM32 系列、ESP32-S3、Arduino Nano 33 BLE Sense、Seeed XIAO 等），资源约束通常是 RAM 几十KB–几百KB、Flash 1–2MB、主频几十到几百 MHz、功耗毫瓦级。主流软件栈是 TensorFlow Lite Micro（TFLM）+ Arm CMSIS-NN 优化算子库；Edge Impulse 提供从数据采集、云端训练到一键导出 Arduino 库的低门槛流水线，其官方教程显示一个关键词识别模型在 Arduino Nano RP2040 上推理耗时仅 6ms、峰值RAM 占用 12.5KB、Flash 占用 49.7KB（<span class=\"cite\">Arm Learning Paths<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p><strong>当前成熟度<span class=\"tag an\">行业分析<\/span><\/strong>：TinyML 在<strong>关键词唤醒、振动/声学异常检测、简单姿态识别<\/strong>等窄任务上已规模商用（耳机、家电、工业传感器）；但模型能力上限低，无法承载大模型浪潮的主线叙事。市场规模口径分歧极大：NextMSC 估计2025年全球约17.6亿美元（<span class=\"cite\">NextMSC<\/span>），另一家机构 Market Growth Reports 同期口径仅约12.4亿美元（<span class=\"cite\">Market Growth Reports<\/span>）——两家数字相差40%以上且都偏营销口径，建议只采信”十亿美元量级、增速两位数”这一粗结论【已证实存在分歧】。<\/p>\n<p><strong>对本科生的意义<\/strong>：TinyML 是<strong>验证自己是否喜欢软硬结合的最低成本实验场<\/strong>（一块 ESP32-S3 开发板2026年在淘宝售价约10–50元（<span class=\"cite\">淘宝搜索页<\/span>）<span class=\"tag ok\">已证实<\/span>），但它对应的专职岗位面窄，不宜作为终点方向，详见第六、七部分。<\/p>", "text": "技术边界【已证实】：TinyML的目标平台是Cortex-M级MCU与同级SoC（STM32系列、ESP32-S3、ArduinoNano33BLESense、SeeedXIAO等），资源约束通常是RAM几十KB–几百KB、Flash1–2MB、主频几十到几百MHz、功耗毫瓦级。主流软件栈是TensorFlowLiteMicro（TFLM）+ArmCMSIS-NN优化算子库；EdgeImpulse提供从数据采集、云端训练到一键导出Arduino库的低门槛流水线，其官方教程显示一个关键词识别模型在ArduinoNanoRP2040上推理耗时仅6ms、峰值RAM占用12.5KB、Flash占用49.7KB（ArmLearningPaths）【已证实】。当前成熟度【行业分析】：TinyML在关键词唤醒、振动/声学异常检测、简单姿态识别等窄任务上已规模商用（耳机、家电、工业传感器）；但模型能力上限低，无法承载大模型浪潮的主线叙事。市场规模口径分歧极大：NextMSC估计2025年全球约17.6亿美元（NextMSC），另一家机构MarketGrowthReports同期口径仅约12.4亿美元（MarketGrowthReports）——两家数字相差40%以上且都偏营销口径，建议只采信”十亿美元量级、增速两位数”这一粗结论【已证实存在分歧】。对本科生的意义：TinyML是验证自己是否喜欢软硬结合的最低成本实验场（一块ESP32-S3开发板2026年在淘宝售价约10–50元（淘宝搜索页）【已证实】），但它对应的专职岗位面窄，不宜作为终点方向，详见第六、七部分。", "n": 685}, {"id": "c11", "vol": 1, "part": "第二部分 Edge AI 技术地图", "title": "B. Mobile / Embedded AI：手机SoC与单板机", "page": 13, "kind": "sec", "html": "<p><strong>硬件格局（2025–2026旗舰）<span class=\"tag ok\">已证实<\/span><\/strong>：<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>平台<\/strong><\/th><th><strong>代表芯片<\/strong><\/th><th><strong>AI单元<\/strong><\/th><th><strong>已公布算力信息<\/strong><\/th><th><strong>制程<\/strong><\/th><\/tr><\/thead><tbody><tr><td>高通<\/td><td>Snapdragon 8 Elite Gen 5（2025.9发布）<\/td><td>Hexagon NPU<\/td><td>官方称较上代快37%、功耗降16%；第三方口径约80–100 TOPS（<span class=\"cite\">Android Headlines<\/span>、<span class=\"cite\">tech-insider<\/span>）<\/td><td>TSMC 3nm (N3P)<\/td><\/tr><tr><td>联发科<\/td><td>Dimensity 9500（2025.9发布）<\/td><td>NPU 990<\/td><td>第三方口径约100 TOPS（<span class=\"cite\">Notebookcheck<\/span>）<\/td><td>TSMC 3nm<\/td><\/tr><tr><td>苹果<\/td><td>A19 Pro（iPhone 17 Pro，2025.9）<\/td><td>16核 Neural Engine<\/td><td><strong>苹果不公布TOPS<\/strong>，第三方估算从35到160 TOPS不等、互相矛盾，均不可全信<span class=\"tag nv\">待核实<\/span><\/td><td>TSMC 3nm<\/td><\/tr><tr><td>PC平台<\/td><td>Snapdragon X2 Elite /Ryzen AI 400 / Core Ultra 3<\/td><td>NPU<\/td><td>80 / 50–60 / 最高50 TOPS（微软Copilot+准入线为40 TOPS+16GB内存）（<span class=\"cite\">Axis Intelligence<\/span>）<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong><span class=\"tag an\">行业分析<\/span><\/strong>两点值得注意：其一，<strong>TOPS数字不等于实际体验<\/strong>——苹果统一内存架构+软硬一体的实际任务表现常优于纸面TOPS更高的竞品，NPU算力是必要条件而非充分条件，软件栈成熟度才是决定因素（<span class=\"cite\">Agentic Lab 分析<\/span>）；其二，<strong>同一颗芯片上 CPU/GPU/NPU/DSP 的调度是核心技术<\/strong>——推理框架需要为同一模型的不同算子选择不同硬件后端（如 llama.cpp 已支持高通 Hexagon NPU 后端），这正是”端侧推理工程师”岗位存在的理由（<span class=\"cite\">arXiv 2609.14643<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p>单板机（SBC）一极：Raspberry Pi 5 主打通用与教育市场（入门价数十欧元级），NVIDIA Jetson 系列统治高性能边缘AI——Orin Nano Super 定价249美元（67 TOPS），是”现代机载AI的甜点位”（<span class=\"cite\">Mon Raspberry 对比测评<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>", "text": "硬件格局（2025–2026旗舰）【已证实】：平台代表芯片AI单元已公布算力信息制程高通Snapdragon8EliteGen5（2025.9发布）HexagonNPU官方称较上代快37%、功耗降16%；第三方口径约80–100TOPS（AndroidHeadlines、tech-insider）TSMC3nm(N3P)联发科Dimensity9500（2025.9发布）NPU990第三方口径约100TOPS（Notebookcheck）TSMC3nm苹果A19Pro（iPhone17Pro，2025.9）16核NeuralEngine苹果不公布TOPS，第三方估算从35到160TOPS不等、互相矛盾，均不可全信【待核实】TSMC3nmPC平台SnapdragonX2Elite/RyzenAI400/CoreUltra3NPU80/50–60/最高50TOPS（微软Copilot+准入线为40TOPS+16GB内存）（AxisIntelligence）—【行业分析】两点值得注意：其一，TOPS数字不等于实际体验——苹果统一内存架构+软硬一体的实际任务表现常优于纸面TOPS更高的竞品，NPU算力是必要条件而非充分条件，软件栈成熟度才是决定因素（AgenticLab分析）；其二，同一颗芯片上CPU/GPU/NPU/DSP的调度是核心技术——推理框架需要为同一模型的不同算子选择不同硬件后端（如llama.cpp已支持高通HexagonNPU后端），这正是”端侧推理工程师”岗位存在的理由（arXiv2609.14643）【已证实】。单板机（SBC）一极：RaspberryPi5主打通用与教育市场（入门价数十欧元级），NVIDIAJetson系列统治高性能边缘AI——OrinNanoSuper定价249美元（67TOPS），是”现代机载AI的甜点位”（MonRaspberry对比测评）【已证实】。", "n": 807}, {"id": "c12", "vol": 1, "part": "第二部分 Edge AI 技术地图", "title": "C. On-device LLM / VLM / 语音 / 本地Agent", "page": 13, "kind": "sec", "html": "<p><strong>模型侧（2025–2026）<span class=\"tag ok\">已证实<\/span><\/strong>：<\/p>\n<p><strong>Qwen3 系列<\/strong>（阿里，2025.4发布）：覆盖 0.6B / 1.7B / 4B / 8B / 14B / 32B 稠密模型及 30B-A3B、235B-A22B MoE，小尺寸模型明确面向端侧（<span class=\"cite\">Qwen3 GitHub<\/span>）。<\/p>\n<p><strong>Gemma 3n<\/strong>（Google，2025.6正式版）：E2B/E4B 两档，采用 MatFormer 嵌套子模型 + Per-Layer Embeddings，5B/8B原始参数仅需2GB/3GB内存运行，与高通、联发科、三星联合针对移动硬件优化（<span class=\"cite\">Google DeepMind<\/span>）。<\/p>\n<p><strong>DeepSeek 蒸馏小模型<\/strong>（R1-Distill 系列）被广泛用于端侧实验；工程社区已有在 Apple Silicon、高通 Hexagon NPU、Android 上部署的成熟调参实践（<span class=\"cite\">博客园技术长文<\/span>）<span class=\"tag an\">行业分析<\/span>。<\/p>\n<p>手机端运行 MoE 已成为学术前沿：2026年9月的 arXiv 论文 BigMoMo 已在搭载 Snapdragon 8 Elite Gen 5 的一加15上实现 Qwen3-30B-A3B 等大 MoE 模型的投机解码端侧推理（<span class=\"cite\">arXiv<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p><strong>工程瓶颈<span class=\"tag an\">行业分析<\/span><\/strong>：端侧LLM的第一瓶颈是<strong>内存带宽与容量<\/strong>（权重读取），第二是<strong>KV Cache 随上下文增长的显存占用<\/strong>（StreamingLLM 等工作正是针对此），第三是<strong>功耗与热设计<\/strong>——旗舰SoC峰值功耗已达约19.5–22W，远超手机散热能力，持续负载下性能大幅缩水（<span class=\"cite\">newfortech 拆解<\/span>）【已证实为第三方评测口径】。这解释了为什么”端侧大模型”的工程岗位本质上是<strong>内存与功耗约束下的系统优化<\/strong>，而非模型本身。<\/p>", "text": "模型侧（2025–2026）【已证实】：Qwen3系列（阿里，2025.4发布）：覆盖0.6B/1.7B/4B/8B/14B/32B稠密模型及30B-A3B、235B-A22BMoE，小尺寸模型明确面向端侧（Qwen3GitHub）。Gemma3n（Google，2025.6正式版）：E2B/E4B两档，采用MatFormer嵌套子模型+Per-LayerEmbeddings，5B/8B原始参数仅需2GB/3GB内存运行，与高通、联发科、三星联合针对移动硬件优化（GoogleDeepMind）。DeepSeek蒸馏小模型（R1-Distill系列）被广泛用于端侧实验；工程社区已有在AppleSilicon、高通HexagonNPU、Android上部署的成熟调参实践（博客园技术长文）【行业分析】。手机端运行MoE已成为学术前沿：2026年9月的arXiv论文BigMoMo已在搭载Snapdragon8EliteGen5的一加15上实现Qwen3-30B-A3B等大MoE模型的投机解码端侧推理（arXiv）【已证实】。工程瓶颈【行业分析】：端侧LLM的第一瓶颈是内存带宽与容量（权重读取），第二是KVCache随上下文增长的显存占用（StreamingLLM等工作正是针对此），第三是功耗与热设计——旗舰SoC峰值功耗已达约19.5–22W，远超手机散热能力，持续负载下性能大幅缩水（newfortech拆解）【已证实为第三方评测口径】。这解释了为什么”端侧大模型”的工程岗位本质上是内存与功耗约束下的系统优化，而非模型本身。", "n": 669}, {"id": "c13", "vol": 1, "part": "第二部分 Edge AI 技术地图", "title": "D. 模型压缩：为什么 INT8/INT4 是端侧的生命线", "page": 14, "kind": "sec", "html": "<p>六类核心技术的关系【已证实，综合自 MIT 6.5940 课程体系（<span class=\"cite\">efficientml.ai 课程页<\/span>）】：<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>技术<\/strong><\/th><th><strong>核心思想<\/strong><\/th><th><strong>代表工作<\/strong><\/th><th><strong>端侧角色<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Quantization 量化<\/td><td>FP32→INT8/INT4，权重与激活低位宽表示<\/td><td>SmoothQuant、GPTQ、GGUF Q4_K 系列<\/td><td><strong>端侧部署的默认动作<\/strong>，模型体积与带宽需求直接减半/减至1/4<\/td><\/tr><tr><td>Pruning 剪枝<\/td><td>移除不重要权重/通道<\/td><td>Deep Compression（Han et al., ICLR’16最佳论文）<\/td><td>结构化剪枝可真实加速，非结构化需硬件支持<\/td><\/tr><tr><td>Knowledge Distillation 蒸馏<\/td><td>大模型教小模型<\/td><td>DeepSeek-R1-Distill 系列、各家端侧小模型<\/td><td>端侧小模型的主要生产方式<\/td><\/tr><tr><td>Low-rank 低秩分解<\/td><td>权重矩阵低秩近似<\/td><td>LoRA 系（训练侧更常用）压缩与适配<\/td><td><\/td><\/tr><tr><td>Weight sharing 权重共享<\/td><td>多路复用同一组权重<\/td><td>ALBERT、量化码本<\/td><td>压缩率来源之一<\/td><\/tr><tr><td>Mixed precision 混合精度<\/td><td>不同层不同位宽<\/td><td>HAQ（硬件感知自动量化，CVPR’19 oral）<\/td><td>NPU 上榨干能效的关键<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>为什么 INT8/INT4 对端侧如此重要<span class=\"tag an\">行业分析<\/span><\/strong>：端侧推理是<strong>内存带宽受限<\/strong>而非算力受限的工作负载——把权重从 FP16 压到 INT4，内存读取量直接降为1/4，延迟和功耗同步下降；同时 INT8 是几乎所有 NPU/DSP 的原生甜点位。换言之，<strong>量化不是”可选优化”，而是端侧部署的前提条件<\/strong>。<\/p>\n<p><strong>“模型压缩更接近算法、系统还是芯片？”<span class=\"tag an\">行业分析<\/span><\/strong>：三者交界处。量化感知训练（QAT）是算法问题；量化模型的算子实现、内存排布是系统问题；INT4/INT2 能否真实加速取决于芯片是否提供对应计算单元（如 Blackwell 原生支持 FP4）——所以顶级团队（MIT HAN Lab、清华 NICS-EFC）全都按”算法—系统—硬件协同设计”组织研究。这也意味着：<strong>只会调参的”压缩算法工程师”会被自动化工具挤压，懂硬件的不会<\/strong>（详见第七部分）。<\/p>", "text": "六类核心技术的关系【已证实，综合自MIT6.5940课程体系（efficientml.ai课程页）】：技术核心思想代表工作端侧角色Quantization量化FP32→INT8/INT4，权重与激活低位宽表示SmoothQuant、GPTQ、GGUFQ4_K系列端侧部署的默认动作，模型体积与带宽需求直接减半/减至1/4Pruning剪枝移除不重要权重/通道DeepCompression（Hanetal.,ICLR’16最佳论文）结构化剪枝可真实加速，非结构化需硬件支持KnowledgeDistillation蒸馏大模型教小模型DeepSeek-R1-Distill系列、各家端侧小模型端侧小模型的主要生产方式Low-rank低秩分解权重矩阵低秩近似LoRA系（训练侧更常用）压缩与适配Weightsharing权重共享多路复用同一组权重ALBERT、量化码本压缩率来源之一Mixedprecision混合精度不同层不同位宽HAQ（硬件感知自动量化，CVPR’19oral）NPU上榨干能效的关键为什么INT8/INT4对端侧如此重要【行业分析】：端侧推理是内存带宽受限而非算力受限的工作负载——把权重从FP16压到INT4，内存读取量直接降为1/4，延迟和功耗同步下降；同时INT8是几乎所有NPU/DSP的原生甜点位。换言之，量化不是”可选优化”，而是端侧部署的前提条件。“模型压缩更接近算法、系统还是芯片？”【行业分析】：三者交界处。量化感知训练（QAT）是算法问题；量化模型的算子实现、内存排布是系统问题；INT4/INT2能否真实加速取决于芯片是否提供对应计算单元（如Blackwell原生支持FP4）——所以顶级团队（MITHANLab、清华NICS-EFC）全都按”算法—系统—硬件协同设计”组织研究。这也意味着：只会调参的”压缩算法工程师”会被自动化工具挤压，懂硬件的不会（详见第七部分）。", "n": 805}, {"id": "c14", "vol": 1, "part": "第二部分 Edge AI 技术地图", "title": "E. 推理系统：一个 PyTorch 模型如何跑到设备上", "page": 15, "kind": "sec", "html": "<p><strong>推理框架版图<span class=\"tag ok\">已证实<\/span><\/strong>：<\/p>\n<p><strong>llama.cpp<\/strong>：端侧LLM部署的事实标准，纯C/C++、GGUF格式、支持CPU/CUDA/Metal/Vulkan/高通QNN等后端（<span class=\"cite\">腾讯云技术百科<\/span>）。<\/p>\n<p><strong>ExecuTorch<\/strong>（Meta）：移动端框架，基础运行时仅约50KB，支持 Core ML、高通QNN/Hexagon、Arm XNNPACK 等12种以上后端，已用于 Instagram、WhatsApp、Quest 3（同上来源）。<\/p>\n<p><strong>MNN<\/strong>（阿里）、<strong>NCNN<\/strong>（腾讯）：国产移动端推理引擎双雄，国内招聘JD高频词（<span class=\"cite\">小米端侧推理优化实习JD<\/span>）。<\/p>\n<p><strong>TensorRT<\/strong>（NVIDIA）、<strong>OpenVINO<\/strong>（Intel）、<strong>ONNX Runtime<\/strong>（微软）、<strong>TVM/MLIR<\/strong>（编译器路线）：覆盖 GPU、x86、异构后端。<\/p>\n<p><strong>TFLite / TFLite Micro<\/strong>：移动端与MCU标准件。<\/p>\n<p><strong>从训练到上设备的完整链路【行业分析，综合上述框架官方文档】<\/strong>：<\/p>\n<pre>PyTorch 训练\n  → 导出（ONNX / GGUF / TorchScript）\n  → 图优化（算子融合、常量折叠、死代码消除）\n  → 算子转换（映射到目标硬件支持的算子集，不支持的算子需手写 kernel）\n  → 量化（PTQ 训练后量化 / QAT 量化感知训练，产出 INT8/INT4）\n  → 编译（面向具体后端生成代码：TensorRT engine、TVM/MLIR、厂商SDK如 QNN/RKNN）\n  → Runtime（内存管理、算子调度、异构分发：CPU/GPU/NPU/DSP）\n  → 真实设备（手机、Jetson、RK3588、MCU）<\/pre>\n<p><strong>这条链上的每一步都对应真实岗位<\/strong>：写转换器的是”AI编译器工程师”，写 kernel 的是”高性能计算/算子工程师”，做异构调度的是”推理引擎工程师”，把整条链在客户芯片上跑通的是”端侧部署/FAE工程师”。这是本报告第六部分岗位分析的骨架。<\/p>", "text": "推理框架版图【已证实】：llama.cpp：端侧LLM部署的事实标准，纯C/C++、GGUF格式、支持CPU/CUDA/Metal/Vulkan/高通QNN等后端（腾讯云技术百科）。ExecuTorch（Meta）：移动端框架，基础运行时仅约50KB，支持CoreML、高通QNN/Hexagon、ArmXNNPACK等12种以上后端，已用于Instagram、WhatsApp、Quest3（同上来源）。MNN（阿里）、NCNN（腾讯）：国产移动端推理引擎双雄，国内招聘JD高频词（小米端侧推理优化实习JD）。TensorRT（NVIDIA）、OpenVINO（Intel）、ONNXRuntime（微软）、TVM/MLIR（编译器路线）：覆盖GPU、x86、异构后端。TFLite/TFLiteMicro：移动端与MCU标准件。从训练到上设备的完整链路【行业分析，综合上述框架官方文档】：PyTorch训练→导出（ONNX/GGUF/TorchScript）→图优化（算子融合、常量折叠、死代码消除）→算子转换（映射到目标硬件支持的算子集，不支持的算子需手写kernel）→量化（PTQ训练后量化/QAT量化感知训练，产出INT8/INT4）→编译（面向具体后端生成代码：TensorRTengine、TVM/MLIR、厂商SDK如QNN/RKNN）→Runtime（内存管理、算子调度、异构分发：CPU/GPU/NPU/DSP）→真实设备（手机、Jetson、RK3588、MCU）这条链上的每一步都对应真实岗位：写转换器的是”AI编译器工程师”，写kernel的是”高性能计算/算子工程师”，做异构调度的是”推理引擎工程师”，把整条链在客户芯片上跑通的是”端侧部署/FAE工程师”。这是本报告第六部分岗位分析的骨架。", "n": 762}, {"id": "c15", "vol": 1, "part": "第二部分 Edge AI 技术地图", "title": "F. AI 芯片：为什么它和 CPU/GPU 不同", "page": 15, "kind": "sec", "html": "<p><strong><span class=\"tag ok\">已证实<\/span><\/strong>AI芯片与普通CPU/GPU的本质区别在于<strong>为矩阵乘加（MAC）与数据流做专用化<\/strong>：用大规模乘加阵列（脉动阵列等）换取单位功耗下的算力密度，用定制存储层次（大容量片上SRAM、近存/存内计算）缓解”内存墙”，用低精度单元（INT8/FP8/FP4）换取能效。代价是通用性丧失——这也是市场上 GPGPU 路线（兼容CUDA生态、通用性强）与 DSA/ASIC 路线（能效高、生态弱）长期并存的原因。上交所披露的燧原科技问询材料引用的数据显示：2025年国内云端AI芯片市场中 GPGPU 占43%、非GPGPU（DSA）占57%，后者由华为海思、寒武纪、昆仑芯等主导（<span class=\"cite\">上交所披露文件<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p><strong>“芯片架构—模型压缩—编译器—推理框架”的关系<span class=\"tag an\">行业分析<\/span><\/strong>：这是一条<strong>协同设计链<\/strong>——芯片决定支持什么精度与算子（如 FP4、稀疏），编译器把模型图映射到芯片能力上，推理框架在运行时调度，模型压缩则反过来按目标芯片的甜点精度定制模型。任何一环脱节，纸面算力都无法兑现（典型反例：未针对 Hexagon 优化的 ONNX 模型无法发挥 NPU 峰值性能（<span class=\"cite\">newfortech<\/span>）<span class=\"tag ok\">已证实<\/span>）。<strong>国产芯片”百花齐放”的直接后果是每一家都需要一支编译器/工具链团队<\/strong>——这是2025–2026年AI编译器岗位爆发的结构性原因（<span class=\"cite\">集微职场分析<\/span>）<span class=\"tag an\">行业分析<\/span>。<\/p>", "text": "【已证实】AI芯片与普通CPU/GPU的本质区别在于为矩阵乘加（MAC）与数据流做专用化：用大规模乘加阵列（脉动阵列等）换取单位功耗下的算力密度，用定制存储层次（大容量片上SRAM、近存/存内计算）缓解”内存墙”，用低精度单元（INT8/FP8/FP4）换取能效。代价是通用性丧失——这也是市场上GPGPU路线（兼容CUDA生态、通用性强）与DSA/ASIC路线（能效高、生态弱）长期并存的原因。上交所披露的燧原科技问询材料引用的数据显示：2025年国内云端AI芯片市场中GPGPU占43%、非GPGPU（DSA）占57%，后者由华为海思、寒武纪、昆仑芯等主导（上交所披露文件）【已证实】。“芯片架构—模型压缩—编译器—推理框架”的关系【行业分析】：这是一条协同设计链——芯片决定支持什么精度与算子（如FP4、稀疏），编译器把模型图映射到芯片能力上，推理框架在运行时调度，模型压缩则反过来按目标芯片的甜点精度定制模型。任何一环脱节，纸面算力都无法兑现（典型反例：未针对Hexagon优化的ONNX模型无法发挥NPU峰值性能（newfortech）【已证实】）。国产芯片”百花齐放”的直接后果是每一家都需要一支编译器/工具链团队——这是2025–2026年AI编译器岗位爆发的结构性原因（集微职场分析）【行业分析】。", "n": 557}, {"id": "c16", "vol": 1, "part": "第三部分 技术成熟度矩阵（2026年10月基准）", "title": "第三部分 技术成熟度矩阵（2026年10月基准）", "page": 16, "kind": "part", "html": "<p>成熟度判断依据<strong>已出货产品、芯片量产数据与公开部署案例<\/strong>，不采用主观评价。评级：●●● 规模商用 / ●●○ 早期商用 / ●○○ 技术验证。<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>技术<\/strong><\/th><th><strong>2026成熟度<\/strong><\/th><th><strong>产业落地证据<\/strong><\/th><th><strong>主要瓶颈<\/strong><\/th><th><strong>未来3–5年趋势<span class=\"tag fc\">预测<\/span><\/strong><\/th><\/tr><\/thead><tbody><tr><td>TinyML<\/td><td>●●●<\/td><td>关键词唤醒、工业预测性维护已规模商用；Edge Impulse生态成熟（<span class=\"cite\">Arm教程<\/span>）<\/td><td>模型能力上限低；市场小而散<\/td><td>稳定增长但非主叙事；与感算一体芯片结合<\/td><\/tr><tr><td>手机端AI<\/td><td>●●●<\/td><td>GenAI手机占2026年全球出货45%（<span class=\"cite\">Counterpoint<\/span>）；旗舰SoC NPU普遍数十至上百TOPS<\/td><td>内存成本推高整机价格；用户实际使用率存疑（有报道称超70%用户半年后关闭AI功能，单一信源<span class=\"tag nv\">待核实<\/span>）<\/td><td>中端机下放取决于内存降价与模型效率<\/td><\/tr><tr><td>Edge Vision（安防/工业视觉）<\/td><td>●●●<\/td><td>视频监控是 Edge AI最大单一应用（2025年约66亿美元，<span class=\"cite\">GMI<\/span>）<\/td><td>隐私监管；同质化<\/td><td>成熟市场，增速趋缓<\/td><\/tr><tr><td>On-device LLM<\/td><td>●●○<\/td><td>Qwen3-4B/Gemma 3n E4B 已可在手机运行；手机端 MoE投机解码见诸 arXiv（<span class=\"cite\">BigMoMo<\/span>）<\/td><td>内存带宽、KV Cache、散热<\/td><td>快速进步，但”端侧必须性”仍受云端降价挑战<\/td><\/tr><tr><td>On-device VLM<\/td><td>●●○<\/td><td>Gemma 3n 原生多模态；AI眼镜出货2025年全球1477万台（+44%，<span class=\"cite\">IDC<\/span>）<\/td><td>功耗与重量（眼镜需控制在40–50g）<\/td><td>AI眼镜是增速最快的载体之一（Omdia：2025年AI眼镜出货870万台，+322%）<\/td><\/tr><tr><td>AI PC<\/td><td>●●○<\/td><td>Copilot+ 标准（40 TOPS+16GB）成为准入线；中国市场渗透率2025年34%（Canalys）<\/td><td>机构预测分歧巨大（Gartner 2026年54.7% vs 摩根士丹利约28%，<span class=\"cite\">accpc整理<\/span>）；Gartner称多数AI PC功能尚未带来可测量生产力提升（<span class=\"cite\">Axis Intelligence<\/span>）<\/td><td>渗透靠换机潮与系统预装驱动，真实粘性待验证<\/td><\/tr><tr><td>机器人端侧AI<\/td><td>●●○<\/td><td>Jetson Thor 2025年发布；优必选Walker S2千台下线、14亿元订单（<span class=\"cite\">深圳市政府<\/span>）；宇树2025年营收17.08亿元（<span class=\"cite\">钛媒体<\/span>）<\/td><td>VLA模型泛化能力、数据稀缺、可靠性验证<\/td><td>具身智能是端侧AI最大增量场景，但波动大<\/td><\/tr><tr><td>自动驾驶端侧AI<\/td><td>●●●<\/td><td>地平线征程系列累计量产破1500万套，2025年出货超400万套（<span class=\"cite\">证券日报<\/span>）<\/td><td>城区NOA体验、法规、成本下探<\/td><td>端侧刚需最硬的场景（车不可能依赖云端实时推理）<\/td><\/tr><tr><td>AI芯片/NPU<\/td><td>●●●<\/td><td>2025年中国AI加速卡出货约400万张，英伟达占约55%（IDC数据，转引自<span class=\"cite\">上交所披露<\/span>）<\/td><td>国产软件栈生态、先进制程受限<\/td><td>国产化率持续提升；编译器/工具链人才缺口扩大<\/td><\/tr><tr><td>云边端协同<\/td><td>●●●<\/td><td>“云训端推”成为主流范式（<span class=\"cite\">锦囊专家报告<\/span>，营销口径，仅作参考）<\/td><td>端云任务划分标准化程度低<\/td><td>混合架构是默认解，纯端侧与纯云端都是少数派<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>矩阵解读<span class=\"tag an\">行业分析<\/span><\/strong>：成熟度最高的恰恰是”旧”方向（安防视觉、TinyML、车载），增量叙事最强的是”新”方向（端侧LLM、具身智能、AI眼镜）。对个人而言，<strong>成熟方向提供确定性就业，新兴方向提供超额成长但也承担技术路线风险<\/strong>——这个权衡将贯穿本报告后半部分。<\/p>", "text": "成熟度判断依据已出货产品、芯片量产数据与公开部署案例，不采用主观评价。评级：●●●规模商用/●●○早期商用/●○○技术验证。技术2026成熟度产业落地证据主要瓶颈未来3–5年趋势【预测】TinyML●●●关键词唤醒、工业预测性维护已规模商用；EdgeImpulse生态成熟（Arm教程）模型能力上限低；市场小而散稳定增长但非主叙事；与感算一体芯片结合手机端AI●●●GenAI手机占2026年全球出货45%（Counterpoint）；旗舰SoCNPU普遍数十至上百TOPS内存成本推高整机价格；用户实际使用率存疑（有报道称超70%用户半年后关闭AI功能，单一信源【待核实】）中端机下放取决于内存降价与模型效率EdgeVision（安防/工业视觉）●●●视频监控是EdgeAI最大单一应用（2025年约66亿美元，GMI）隐私监管；同质化成熟市场，增速趋缓On-deviceLLM●●○Qwen3-4B/Gemma3nE4B已可在手机运行；手机端MoE投机解码见诸arXiv（BigMoMo）内存带宽、KVCache、散热快速进步，但”端侧必须性”仍受云端降价挑战On-deviceVLM●●○Gemma3n原生多模态；AI眼镜出货2025年全球1477万台（+44%，IDC）功耗与重量（眼镜需控制在40–50g）AI眼镜是增速最快的载体之一（Omdia：2025年AI眼镜出货870万台，+322%）AIPC●●○Copilot+标准（40TOPS+16GB）成为准入线；中国市场渗透率2025年34%（Canalys）机构预测分歧巨大（Gartner2026年54.7%vs摩根士丹利约28%，accpc整理）；Gartner称多数AIPC功能尚未带来可测量生产力提升（AxisIntelligence）渗透靠换机潮与系统预装驱动，真实粘性待验证机器人端侧AI●●○JetsonThor2025年发布；优必选WalkerS2千台下线、14亿元订单（深圳市政府）；宇树2025年营收17.08亿元（钛媒体）VLA模型泛化能力、数据稀缺、可靠性验证具身智能是端侧AI最大增量场景，但波动大自动驾驶端侧AI●●●地平线征程系列累计量产破1500万套，2025年出货超400万套（证券日报）城区NOA体验、法规、成本下探端侧刚需最硬的场景（车不可能依赖云端实时推理）AI芯片/NPU●●●2025年中国AI加速卡出货约400万张，英伟达占约55%（IDC数据，转引自上交所披露）国产软件栈生态、先进制程受限国产化率持续提升；编译器/工具链人才缺口扩大云边端协同●●●“云训端推”成为主流范式（锦囊专家报告，营销口径，仅作参考）端云任务划分标准化程度低混合架构是默认解，纯端侧与纯云端都是少数派矩阵解读【行业分析】：成熟度最高的恰恰是”旧”方向（安防视觉、TinyML、车载），增量叙事最强的是”新”方向（端侧LLM、具身智能、AI眼镜）。对个人而言，成熟方向提供确定性就业，新兴方向提供超额成长但也承担技术路线风险——这个权衡将贯穿本报告后半部分。", "n": 1273}, {"id": "c17", "vol": 1, "part": "第四部分 全球产业地图", "title": "第四部分 全球产业地图", "page": 17, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c18", "vol": 1, "part": "第四部分 全球产业地图", "title": "4.1 手机 / PC / SoC 厂商", "page": 17, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span><strong>Apple<\/strong>（A19 Pro + Apple Intelligence，端云混合，强调隐私）、<strong>Qualcomm<\/strong>（骁龙8 Elite Gen 5 + AI Hub 175+预优化模型库，Edge AI 市场份额第一、2025年约15.6%，<span class=\"cite\">GMI<\/span>）、<strong>MediaTek<\/strong>（天玑9500 + NeuroPilot）、<strong>华为海思<\/strong>（麒麟NPU + 昇腾端侧）、<strong>Samsung<\/strong>（Exynos + Galaxy AI）、<strong>Intel/AMD<\/strong>（Core Ultra / Ryzen AI，抢 Copilot+ 准入）。该层的竞争本质是<strong>NPU算力+软件栈+生态绑定<\/strong>的三位一体。<\/p>", "text": "【已证实】Apple（A19Pro+AppleIntelligence，端云混合，强调隐私）、Qualcomm（骁龙8EliteGen5+AIHub175+预优化模型库，EdgeAI市场份额第一、2025年约15.6%，GMI）、MediaTek（天玑9500+NeuroPilot）、华为海思（麒麟NPU+昇腾端侧）、Samsung（Exynos+GalaxyAI）、Intel/AMD（CoreUltra/RyzenAI，抢Copilot+准入）。该层的竞争本质是NPU算力+软件栈+生态绑定的三位一体。", "n": 254}, {"id": "c19", "vol": 1, "part": "第四部分 全球产业地图", "title": "4.2 AI 芯片厂商", "page": 18, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span><\/p>\n<p><strong>NVIDIA<\/strong>：Jetson Thor（2025.8发布，T5000 模组 FP4 稀疏算力2070 TFLOPS、128GB内存、40–130W，为前代 Orin 的7.5倍算力、3.5倍能效），定位机器人与物理AI推理层（<span class=\"cite\">NVIDIA官方博客<\/span>、<span class=\"cite\">百度百科词条整理<\/span>）。<\/p>\n<p><strong>地平线（Horizon Robotics）<\/strong>：2025年营收37.58亿元（+57.7%），征程系列芯片出货超400万套，中高阶芯片出货180万套（同比近5倍），在20万元以下车型中高阶智驾方案份额44.2%；发布新一代 BPU”黎曼架构”（<span class=\"cite\">证券日报<\/span>、<span class=\"cite\">凤凰科技<\/span>）。<\/p>\n<p><strong>寒武纪<\/strong>：2025年营收64.97亿元（+453%）、首次年度盈利（净利20.6亿）——但<strong>几乎全部来自云端产品线，其边缘产品线（思元220）收入仅339万元且同比下滑48%<\/strong>（<span class=\"cite\">寒武纪2025年报，新浪披露<\/span>）。<strong>重要产业信号：寒武纪实质上已退出边缘市场，押注云端大模型算力。<\/strong>这提醒我们”AI芯片公司”≠“Edge AI公司”。<\/p>\n<p><strong>华为昇腾<\/strong>：昇腾310定位边缘推理（列入国家安全可靠清单），950PR（2026年发布）面向大模型推理，CANN+MindSpore 软件栈对标 CUDA（<span class=\"cite\">中显光电转引公告<\/span>，NA级信源<span class=\"tag nv\">待核实<\/span>；昇腾产品线结构见<span class=\"cite\">对比分析<\/span>）。<\/p>\n<p>其他中国厂商：黑芝麻（车载）、瑞芯微（RK3588，AIoT）、晶晨、全志、爱芯元智（视觉）、摩尔线程/沐曦/壁仞/燧原/天数智芯（均已在2025–2026年密集上市，详见第五部分）。<\/p>", "text": "【已证实】NVIDIA：JetsonThor（2025.8发布，T5000模组FP4稀疏算力2070TFLOPS、128GB内存、40–130W，为前代Orin的7.5倍算力、3.5倍能效），定位机器人与物理AI推理层（NVIDIA官方博客、百度百科词条整理）。地平线（HorizonRobotics）：2025年营收37.58亿元（+57.7%），征程系列芯片出货超400万套，中高阶芯片出货180万套（同比近5倍），在20万元以下车型中高阶智驾方案份额44.2%；发布新一代BPU”黎曼架构”（证券日报、凤凰科技）。寒武纪：2025年营收64.97亿元（+453%）、首次年度盈利（净利20.6亿）——但几乎全部来自云端产品线，其边缘产品线（思元220）收入仅339万元且同比下滑48%（寒武纪2025年报，新浪披露）。重要产业信号：寒武纪实质上已退出边缘市场，押注云端大模型算力。这提醒我们”AI芯片公司”≠“EdgeAI公司”。华为昇腾：昇腾310定位边缘推理（列入国家安全可靠清单），950PR（2026年发布）面向大模型推理，CANN+MindSpore软件栈对标CUDA（中显光电转引公告，NA级信源【待核实】；昇腾产品线结构见对比分析）。其他中国厂商：黑芝麻（车载）、瑞芯微（RK3588，AIoT）、晶晨、全志、爱芯元智（视觉）、摩尔线程/沐曦/壁仞/燧原/天数智芯（均已在2025–2026年密集上市，详见第五部分）。", "n": 619}, {"id": "c20", "vol": 1, "part": "第四部分 全球产业地图", "title": "4.3 大模型公司与端侧的关系", "page": 18, "kind": "sec", "html": "<p>【已证实/行业分析】<strong>并非所有大模型公司都有端侧业务<\/strong>，强行归类会失真：<\/p>\n<p><strong>有明显端侧布局<\/strong>：Google（Gemma 3n/Gemini Nano，与芯片厂联合优化）、Meta（Llama 开源 +ExecuTorch）、阿里（Qwen 全尺寸开源 + MNN + 平头哥芯片 + 千问AI眼镜）、小米（MiMo 端侧模型 + 玄戒O1 SoC，NPU 44 TOPS（<span class=\"cite\">定焦研报转引<\/span>））、苹果、华为（盘古+昇腾+鸿蒙全栈）。<\/p>\n<p><strong>端侧关系间接<\/strong>：DeepSeek（其开源模型是被端侧部署最多的模型之一，但公司本身不做端侧产品；价值在于<strong>蒸馏小模型大幅降低了端侧算力门槛<\/strong>（<span class=\"cite\">Canalys转引<\/span>））、字节（豆包+耳机/眼镜硬件尝试）、百度（昆仑芯+小度）、腾讯（混元+NCNN）。<\/p>\n<p><strong>基本无端侧业务<\/strong>：OpenAI、MiniMax、Moonshot（Kimi）等以云端API与订阅为核心商业模式的公司——它们的存在本身就是”云端推理”派的理由。<\/p>", "text": "【已证实/行业分析】并非所有大模型公司都有端侧业务，强行归类会失真：有明显端侧布局：Google（Gemma3n/GeminiNano，与芯片厂联合优化）、Meta（Llama开源+ExecuTorch）、阿里（Qwen全尺寸开源+MNN+平头哥芯片+千问AI眼镜）、小米（MiMo端侧模型+玄戒O1SoC，NPU44TOPS（定焦研报转引））、苹果、华为（盘古+昇腾+鸿蒙全栈）。端侧关系间接：DeepSeek（其开源模型是被端侧部署最多的模型之一，但公司本身不做端侧产品；价值在于蒸馏小模型大幅降低了端侧算力门槛（Canalys转引））、字节（豆包+耳机/眼镜硬件尝试）、百度（昆仑芯+小度）、腾讯（混元+NCNN）。基本无端侧业务：OpenAI、MiniMax、Moonshot（Kimi）等以云端API与订阅为核心商业模式的公司——它们的存在本身就是”云端推理”派的理由。", "n": 390}, {"id": "c21", "vol": 1, "part": "第四部分 全球产业地图", "title": "4.4 机器人 / 自动驾驶 / 无人机 / 智能眼镜 / 工业视觉", "page": 18, "kind": "sec", "html": "<p><strong>为什么这些场景必须用端侧AI<span class=\"tag an\">行业分析<\/span><\/strong>：<\/p>\n<p>1. <strong>实时性与确定性<\/strong>：车辆行驶中100ms的云端往返延迟不可接受；机器人平衡控制环路需要毫秒级确定性响应。<\/p>\n<p>2. <strong>连接不可靠<\/strong>：矿区、隧道、农田、海上——云深处四足机器人的主战场正是防爆、强磁场、极寒等”别人进不去的场景”（<span class=\"cite\">钛媒体<\/span>）<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p>3. <strong>带宽经济性<\/strong>：一台4K摄像头原始视频流上传云端成本极高，本地过滤后只传结构化结果（GMI报告中的东南亚25万路智能监控合同即为该逻辑（<span class=\"cite\">GMI<\/span>））<span class=\"tag ok\">已证实<\/span>。<\/p>\n<p>4. <strong>隐私合规<\/strong>：座舱、医疗、家庭场景数据不宜离设备。<\/p>\n<p><span class=\"tag ok\">已证实<\/span>关键市场信号：TrendForce 预测2026年全球人形机器人出货超5万台（为2025年的8倍）（<span class=\"cite\">36氪<\/span>）；AI眼镜2025年全球出货870万台（+322%，Meta占85.2%，<span class=\"cite\">Omdia/36氪<\/span>）；IDC预计2026年中国产AI眼镜出货2267万副、占全球45%（<span class=\"cite\">艾邦AR/VR网转引IDC<\/span>）。<\/p>", "text": "为什么这些场景必须用端侧AI【行业分析】：1.实时性与确定性：车辆行驶中100ms的云端往返延迟不可接受；机器人平衡控制环路需要毫秒级确定性响应。2.连接不可靠：矿区、隧道、农田、海上——云深处四足机器人的主战场正是防爆、强磁场、极寒等”别人进不去的场景”（钛媒体）【已证实】。3.带宽经济性：一台4K摄像头原始视频流上传云端成本极高，本地过滤后只传结构化结果（GMI报告中的东南亚25万路智能监控合同即为该逻辑（GMI））【已证实】。4.隐私合规：座舱、医疗、家庭场景数据不宜离设备。【已证实】关键市场信号：TrendForce预测2026年全球人形机器人出货超5万台（为2025年的8倍）（36氪）；AI眼镜2025年全球出货870万台（+322%，Meta占85.2%，Omdia/36氪）；IDC预计2026年中国产AI眼镜出货2267万副、占全球45%（艾邦AR/VR网转引IDC）。", "n": 397}, {"id": "c22", "vol": 1, "part": "第五部分 深圳与长三角：区域产业验证", "title": "第五部分 深圳与长三角：区域产业验证", "page": 19, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c23", "vol": 1, "part": "第五部分 深圳与长三角：区域产业验证", "title": "5.1 深圳：是否真的特别适合 Edge AI？", "page": 19, "kind": "sec", "html": "<p><strong>结论<span class=\"tag an\">行业分析<\/span>：是，且证据链完整。<\/strong> 深圳的独特之处不在”有AI公司”，而在于<strong>从芯片到整机的完整硬件产业链都在一小时车程内<\/strong>——这正是 Edge AI（强依赖硬件迭代速度）最需要的土壤。<\/p>\n<p><strong>产业链逐级验证<span class=\"tag ok\">已证实<\/span><\/strong>：<\/p>\n<p><strong>政策层<\/strong>：深圳市政府2025年3月印发《深圳市加快推进人工智能终端产业发展行动计划（2025—2026年）》，明确”加快发展端侧大模型……通过模型压缩、蒸馏等轻量化和优化技术”（<span class=\"cite\">深圳政府在线<\/span>）；2026年3月再印发AI服务器产业链行动计划（2026–2028），覆盖国产GPU/NPU、存算一体、先进封装（<span class=\"cite\">深圳市政府<\/span>）。<\/p>\n<p><strong>规模<\/strong>：2025年深圳人工智能核心产业营收约2200亿元、规上AI企业超2600家（<span class=\"cite\">东方财富《2026年中国AI芯片发展趋势报告》<\/span>）。<\/p>\n<p><strong>机器人<\/strong>：优必选 Walker S2 第1000台下线、2025年订单超14亿元、2026年规划万台产能；众擎获多伦科技三年2000台采购协议；速腾聚创（激光雷达）、奥比中光（3D视觉）、雷赛智能（控制器）、拓邦/兆威机电（电机）构成核心零部件层；全市机器人相关企业3000余家（<span class=\"cite\">深圳市政府<\/span>、<span class=\"cite\">南山区政府<\/span>）。<\/p>\n<p><strong>整机与消费硬件<\/strong>：华为、腾讯、大疆、比亚迪、传音、荣耀，以及全球最大的消费电子代工与模组生态（华强北—东莞—惠州制造带）。<\/p>\n<p><strong>芯片与模组<\/strong>：海思（昇腾310边缘推理芯片+麒麟NPU）、瑞芯微生态、大量方案商。<\/p>\n<p><strong>“芯片→模组→设备→OEM→软件→AI→机器人”链条<span class=\"tag an\">行业分析<\/span><\/strong>：在深圳这条链是<strong>物理上存在的<\/strong>——同一块瑞芯微/君正/全志 SoC，上午在方案公司画板，下午在贴片厂打样，下周在整机组装厂试产。这种迭代速度是上海（强在芯片设计与资本）、北京（强在算法与基础研究）都不具备的。对你的意义：<strong>深圳大学的区位对”嵌入式+AI”复合路线的实习与就业是显著加成<\/strong>。<\/p>", "text": "结论【行业分析】：是，且证据链完整。深圳的独特之处不在”有AI公司”，而在于从芯片到整机的完整硬件产业链都在一小时车程内——这正是EdgeAI（强依赖硬件迭代速度）最需要的土壤。产业链逐级验证【已证实】：政策层：深圳市政府2025年3月印发《深圳市加快推进人工智能终端产业发展行动计划（2025—2026年）》，明确”加快发展端侧大模型……通过模型压缩、蒸馏等轻量化和优化技术”（深圳政府在线）；2026年3月再印发AI服务器产业链行动计划（2026–2028），覆盖国产GPU/NPU、存算一体、先进封装（深圳市政府）。规模：2025年深圳人工智能核心产业营收约2200亿元、规上AI企业超2600家（东方财富《2026年中国AI芯片发展趋势报告》）。机器人：优必选WalkerS2第1000台下线、2025年订单超14亿元、2026年规划万台产能；众擎获多伦科技三年2000台采购协议；速腾聚创（激光雷达）、奥比中光（3D视觉）、雷赛智能（控制器）、拓邦/兆威机电（电机）构成核心零部件层；全市机器人相关企业3000余家（深圳市政府、南山区政府）。整机与消费硬件：华为、腾讯、大疆、比亚迪、传音、荣耀，以及全球最大的消费电子代工与模组生态（华强北—东莞—惠州制造带）。芯片与模组：海思（昇腾310边缘推理芯片+麒麟NPU）、瑞芯微生态、大量方案商。“芯片→模组→设备→OEM→软件→AI→机器人”链条【行业分析】：在深圳这条链是物理上存在的——同一块瑞芯微/君正/全志SoC，上午在方案公司画板，下午在贴片厂打样，下周在整机组装厂试产。这种迭代速度是上海（强在芯片设计与资本）、北京（强在算法与基础研究）都不具备的。对你的意义：深圳大学的区位对”嵌入式+AI”复合路线的实习与就业是显著加成。", "n": 748}, {"id": "c24", "vol": 1, "part": "第五部分 深圳与长三角：区域产业验证", "title": "5.2 长三角：围绕浙大的科研—实习—就业路径是否连续？", "page": 20, "kind": "sec", "html": "<p><strong>结论<span class=\"tag an\">行业分析<\/span>：基本连续，但结构上与深圳不同——长三角强在”芯片设计+资本+整车+互联网”，深圳强在”硬件快速迭代+机器人整机+消费终端”。<\/strong><\/p>\n<p><span class=\"tag ok\">已证实<\/span><\/p>\n<p><strong>上海<\/strong>：2025年集成电路产业规模约5800亿元（+15.5%，五年翻倍）（<span class=\"cite\">上观新闻<\/span>）；AI芯片”四小龙”（沐曦、壁仞、天数智芯、燧原）2025年底至2026年密集上市，燧原科创板上市首日开盘涨188%、市值超1700亿元（同上）；平头哥发布真武810E（性能对标H20，已用于训练千问，<span class=\"cite\">上海市政府外宣<\/span>）。<\/p>\n<p><strong>杭州<\/strong>：DeepSeek（大模型）、宇树科技（2025年营收17.08亿元、人形机器人全球出货份额32.4%、科创板IPO获批、估值约420亿元）、云深处（四足机器人行业应用收入全球第一，2025年营收3.37亿元）（<span class=\"cite\">凤凰财经<\/span>、<span class=\"cite\">钛媒体<\/span>）；阿里（Qwen+MNN+平头哥）总部在杭。<\/p>\n<p><strong>苏州/南京/合肥<\/strong>：苏州有大量车规与半导体岗位（如元涌科技NPU设计岗，<span class=\"cite\">应届生求职网<\/span>）；南京有芯片公司开出模型量化压缩岗 40–70K·15薪（<span class=\"cite\">猎聘<\/span>）；合肥有中科大系+科大讯飞+综合性国家科学中心。<\/p>\n<p><strong>“浙大读研→杭州实习→长三角就业”路径验证<span class=\"tag an\">行业分析<\/span><\/strong>：成立。浙大计算机/微纳电子的实验室与阿里、平头哥、宇树、云深处、海康、大华等同城企业存在天然的联合项目与实习通道（例如浙大控制学院与阿里达摩院合办具身智能训练营、优秀学员直推阿里实习（<span class=\"cite\">浙江大学×达摩院训练营通知<\/span>）<span class=\"tag ok\">已证实<\/span>）。风险点：杭州房价与生活成本高于深圳关外，且杭州端侧岗位密度仍低于深圳——<strong>读研在长三角、第一份工作回深圳<\/strong>是完全可行的组合。<\/p>", "text": "结论【行业分析】：基本连续，但结构上与深圳不同——长三角强在”芯片设计+资本+整车+互联网”，深圳强在”硬件快速迭代+机器人整机+消费终端”。【已证实】上海：2025年集成电路产业规模约5800亿元（+15.5%，五年翻倍）（上观新闻）；AI芯片”四小龙”（沐曦、壁仞、天数智芯、燧原）2025年底至2026年密集上市，燧原科创板上市首日开盘涨188%、市值超1700亿元（同上）；平头哥发布真武810E（性能对标H20，已用于训练千问，上海市政府外宣）。杭州：DeepSeek（大模型）、宇树科技（2025年营收17.08亿元、人形机器人全球出货份额32.4%、科创板IPO获批、估值约420亿元）、云深处（四足机器人行业应用收入全球第一，2025年营收3.37亿元）（凤凰财经、钛媒体）；阿里（Qwen+MNN+平头哥）总部在杭。苏州/南京/合肥：苏州有大量车规与半导体岗位（如元涌科技NPU设计岗，应届生求职网）；南京有芯片公司开出模型量化压缩岗40–70K·15薪（猎聘）；合肥有中科大系+科大讯飞+综合性国家科学中心。“浙大读研→杭州实习→长三角就业”路径验证【行业分析】：成立。浙大计算机/微纳电子的实验室与阿里、平头哥、宇树、云深处、海康、大华等同城企业存在天然的联合项目与实习通道（例如浙大控制学院与阿里达摩院合办具身智能训练营、优秀学员直推阿里实习（浙江大学×达摩院训练营通知）【已证实】）。风险点：杭州房价与生活成本高于深圳关外，且杭州端侧岗位密度仍低于深圳——读研在长三角、第一份工作回深圳是完全可行的组合。", "n": 665}, {"id": "c25", "vol": 1, "part": "第六部分 就业岗位逆向分析", "title": "第六部分 就业岗位逆向分析", "page": 20, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c26", "vol": 1, "part": "第六部分 就业岗位逆向分析", "title": "6.0 方法论与数据可靠性声明", "page": 20, "kind": "sec", "html": "<p>本章岗位信息来自<strong>招聘平台的真实在招职位快照（2025–2026年）<\/strong>。必须先说明局限：①招聘广告薪资是<strong>谈判起点而非实际成交<\/strong>，存在虚标与区间夸大；②样本是偶发抓取而非系统普查；③不同平台的薪资口径（月薪/年薪、含不含股票）不统一。因此本章<strong>只做结构性分析（岗位需要什么能力、大致处于什么价位带），不做精确薪酬承诺<\/strong>。凡无法确认来源的，一律标注<span class=\"tag nv\">待核实<\/span>或<span class=\"tag na\">无法可靠估计<\/span>。<\/p>", "text": "本章岗位信息来自招聘平台的真实在招职位快照（2025–2026年）。必须先说明局限：①招聘广告薪资是谈判起点而非实际成交，存在虚标与区间夸大；②样本是偶发抓取而非系统普查；③不同平台的薪资口径（月薪/年薪、含不含股票）不统一。因此本章只做结构性分析（岗位需要什么能力、大致处于什么价位带），不做精确薪酬承诺。凡无法确认来源的，一律标注【待核实】或【无法可靠估计】。", "n": 182}, {"id": "c27", "vol": 1, "part": "第六部分 就业岗位逆向分析", "title": "6.1 岗位清单（职位名称 / 技能要求 / 学历 / 薪资区间 / 城市）", "page": 20, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>岗位<\/strong><\/th><th><strong>核心技能要求<\/strong>（<strong>摘自JD原文<\/strong>）<\/th><th><strong>学历要求<\/strong><\/th><th><strong>薪资<\/strong><\/th><th><strong>城市/来源<\/strong><\/th><\/tr><\/thead><tbody><tr><td>具身智能工程师（模型与仿真）<\/td><td>VLA模型（OpenVLA/PI0）、Isaac Lab、MimicGen、GPU资源估算<\/td><td>硕士及以上<\/td><td>30–60K·15薪<\/td><td>上海，上海宇叠智能（<span class=\"cite\">猎聘<\/span>）<\/td><\/tr><tr><td>具身智能数据采集工程师<\/td><td>机器人遥操作、VR设备采集、数据清洗、LoRA微调<\/td><td>本科及以上<\/td><td>25–45K<\/td><td>上海，字节跳动（<span class=\"cite\">猎聘<\/span>）<\/td><\/tr><tr><td>NPU芯片设计工程师<\/td><td>熟悉CNN/Transformer、Verilog、AI算法、论文复现能力<\/td><td>本科以上（3–5年经验）<\/td><td>30–60K<\/td><td>苏州，元涌科技（<span class=\"cite\">应届生求职网<\/span>）<\/td><\/tr><tr><td>AI编译器开发工程师（AI芯片）<\/td><td>MLIR/TVM/XLA、LLVM、图优化与算子优化<\/td><td>未注明（高门槛岗）<\/td><td>40–80K·13薪<\/td><td>地点未标注，某公司（<span class=\"cite\">猎聘<\/span>）<\/td><\/tr><tr><td>模型量化压缩工程师<\/td><td>QAT/PTQ/GPTQ、Transformer、模型微调、推理部署<\/td><td>未注明<\/td><td>40–70K·15薪<\/td><td>南京，某芯片公司（<span class=\"cite\">猎聘<\/span>）<\/td><\/tr><tr><td>机器人算法工程师（行业统计）<\/td><td>—<\/td><td>—<\/td><td>平均月薪25364元（2025年1–5月平台统计）<\/td><td>全国，<span class=\"cite\">智联招聘《2025年机器人产业人才发展报告》<\/span><\/td><\/tr><tr><td>人形机器人算法岗（行业统计）<\/td><td>—<\/td><td>—<\/td><td>平均月薪31512元<\/td><td>全国，同上智联报告<\/td><\/tr><tr><td>嵌入式工程师（应届，深圳参考）<\/td><td>C/C++、RTOS、驱动<\/td><td>本科<\/td><td>约8.3–15K/月（样本量小）<\/td><td>深圳，<span class=\"cite\">猎聘嵌入式深圳页<\/span>——不同子页区间差异大，<strong>仅作量级参考，不作精确依据<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>图3将上述价位带可视化。<\/p>\n<figure><img src=\"assets/fig3-salary.png\" alt=\"图3 典型Edge AI相关岗位薪资区间（招聘广告区间或平台统计均值，非权威薪酬调查）\" loading=\"lazy\"><figcaption>图3 典型Edge AI相关岗位薪资区间（招聘广告区间或平台统计均值，非权威薪酬调查）<\/figcaption><\/figure>", "text": "岗位核心技能要求（摘自JD原文）学历要求薪资城市/来源具身智能工程师（模型与仿真）VLA模型（OpenVLA/PI0）、IsaacLab、MimicGen、GPU资源估算硕士及以上30–60K·15薪上海，上海宇叠智能（猎聘）具身智能数据采集工程师机器人遥操作、VR设备采集、数据清洗、LoRA微调本科及以上25–45K上海，字节跳动（猎聘）NPU芯片设计工程师熟悉CNN/Transformer、Verilog、AI算法、论文复现能力本科以上（3–5年经验）30–60K苏州，元涌科技（应届生求职网）AI编译器开发工程师（AI芯片）MLIR/TVM/XLA、LLVM、图优化与算子优化未注明（高门槛岗）40–80K·13薪地点未标注，某公司（猎聘）模型量化压缩工程师QAT/PTQ/GPTQ、Transformer、模型微调、推理部署未注明40–70K·15薪南京，某芯片公司（猎聘）机器人算法工程师（行业统计）——平均月薪25364元（2025年1–5月平台统计）全国，智联招聘《2025年机器人产业人才发展报告》人形机器人算法岗（行业统计）——平均月薪31512元全国，同上智联报告嵌入式工程师（应届，深圳参考）C/C++、RTOS、驱动本科约8.3–15K/月（样本量小）深圳，猎聘嵌入式深圳页——不同子页区间差异大，仅作量级参考，不作精确依据图3将上述价位带可视化。", "n": 588}, {"id": "c28", "vol": 1, "part": "第六部分 就业岗位逆向分析", "title": "6.2 关键要求提取（跨岗位共性）", "page": 22, "kind": "sec", "html": "<p><span class=\"tag an\">行业分析<\/span>对以上JD做词频与结构分析，反复出现的要求可归为五组：<\/p>\n<p>1. <strong>C/C++ 与系统功底<\/strong>：几乎所有底层岗（编译器、推理引擎、嵌入式）的硬门槛；Rust 在部分岗位开始出现。<\/p>\n<p>2. <strong>深度学习框架 + 模型结构理解<\/strong>：PyTorch 是默认；对 CNN/Transformer/扩散模型<strong>内部结构<\/strong>的理解（而非只会调API）是中高薪岗的分水岭。<\/p>\n<p>3. <strong>部署工具链<\/strong>：TVM/MLIR/LLVM、ONNX、TensorRT、量化工具链（GPTQ等）、TFLite/NCNN/MNN。<\/p>\n<p>4. <strong>硬件知识<\/strong>：计算机体系结构、内存带宽、NPU/DSP架构、Verilog（芯片岗）、CUDA/算子开发。<\/p>\n<p>5. <strong>领域叠加<\/strong>：机器人岗要求 Isaac Lab/MuJoCo 仿真与 VLA 模型；视觉岗要求 OpenCV/检测分割；车载岗要求功能安全与车规流程。<\/p>", "text": "【行业分析】对以上JD做词频与结构分析，反复出现的要求可归为五组：1.C/C++与系统功底：几乎所有底层岗（编译器、推理引擎、嵌入式）的硬门槛；Rust在部分岗位开始出现。2.深度学习框架+模型结构理解：PyTorch是默认；对CNN/Transformer/扩散模型内部结构的理解（而非只会调API）是中高薪岗的分水岭。3.部署工具链：TVM/MLIR/LLVM、ONNX、TensorRT、量化工具链（GPTQ等）、TFLite/NCNN/MNN。4.硬件知识：计算机体系结构、内存带宽、NPU/DSP架构、Verilog（芯片岗）、CUDA/算子开发。5.领域叠加：机器人岗要求IsaacLab/MuJoCo仿真与VLA模型；视觉岗要求OpenCV/检测分割；车载岗要求功能安全与车规流程。", "n": 348}, {"id": "c29", "vol": 1, "part": "第六部分 就业岗位逆向分析", "title": "6.3 岗位密度：深圳 vs 长三角", "page": 22, "kind": "sec", "html": "<p><span class=\"tag an\">行业分析<\/span>从平台职位量与产业结构推断：<strong>嵌入式/硬件/整机类岗位深圳密度显著更高<\/strong>（硬件制造生态决定）；<strong>芯片设计、AI编译器、大模型系统岗上海/杭州更集中<\/strong>（设计公司与互联网大厂分布决定）；机器人整机研发两地都有，但深圳偏硬件与量产、杭州偏算法与本体（宇树/云深处）。对”深大本科→长三角读研→回深圳就业”路线而言，这个分布反而是利好：读研期间在长三角补”芯片/系统/算法”，回深圳补”硬件落地”，两地能力组合恰好互补。<\/p>", "text": "【行业分析】从平台职位量与产业结构推断：嵌入式/硬件/整机类岗位深圳密度显著更高（硬件制造生态决定）；芯片设计、AI编译器、大模型系统岗上海/杭州更集中（设计公司与互联网大厂分布决定）；机器人整机研发两地都有，但深圳偏硬件与量产、杭州偏算法与本体（宇树/云深处）。对”深大本科→长三角读研→回深圳就业”路线而言，这个分布反而是利好：读研期间在长三角补”芯片/系统/算法”，回深圳补”硬件落地”，两地能力组合恰好互补。", "n": 208}, {"id": "c30", "vol": 1, "part": "第六部分 就业岗位逆向分析", "title": "6.4 3–5年涨幅与晋升路径【无法可靠估计】", "page": 23, "kind": "sec", "html": "<p><strong>必须诚实声明<\/strong>：公开的、可信的分岗位3–5年薪资涨幅追踪数据<strong>不存在<\/strong>（招聘平台只有当期快照，薪酬咨询报告不公开细分到”端侧推理工程师”颗粒度）。因此本节<strong>不做数字预测<\/strong>。可以做的是结构性判断<span class=\"tag an\">行业分析<\/span>：晋升路径通常为 工程师→资深/专家（技术线）或→组长/架构师（管理/架构线）；在芯片与编译器等高门槛方向，资深专家的市场议价能力显著强于应用层算法岗——因为其能力难以速成、供给稀缺（AI编译器人才短缺的结构性原因见第二部分F节）。但这只是方向性判断，不是薪酬承诺。<\/p>", "text": "必须诚实声明：公开的、可信的分岗位3–5年薪资涨幅追踪数据不存在（招聘平台只有当期快照，薪酬咨询报告不公开细分到”端侧推理工程师”颗粒度）。因此本节不做数字预测。可以做的是结构性判断【行业分析】：晋升路径通常为工程师→资深/专家（技术线）或→组长/架构师（管理/架构线）；在芯片与编译器等高门槛方向，资深专家的市场议价能力显著强于应用层算法岗——因为其能力难以速成、供给稀缺（AI编译器人才短缺的结构性原因见第二部分F节）。但这只是方向性判断，不是薪酬承诺。", "n": 229}, {"id": "c31", "vol": 1, "part": "第六部分 就业岗位逆向分析", "title": "6.5 哪些岗位已经过剩、哪些仍有缺口", "page": 23, "kind": "sec", "html": "<p>【行业分析，基于智联报告与招聘平台结构数据】<\/p>\n<p><strong>缺口明确的方向<\/strong>：机器人/具身智能算法（智联：2025年前5个月机器人产业招聘职位数同比+409%、求职+396%，<strong>需求增速仍高于供给增速<\/strong>）；AI编译器/推理系统（结构性短缺，见前文）；模型压缩部署（端侧LLM浪潮直接拉动）；NPU/AI芯片设计（国产替代+上市公司扩编）。<\/p>\n<p><strong>趋于拥挤的方向<\/strong>：通用CV算法（安防红利期已过，供给远大于需求）；纯调参/调API的大模型应用岗（门槛快速下降，2024–2026年供给爆炸）；传统嵌入式（岗位量大但薪资天花板低，且受消费电子周期影响）。<\/p>\n<p><strong>数据缺口警示<\/strong>：智联报告同时显示人形机器人领域求职者同比+396%——<strong>一个赛道从”缺人”到”内卷”可能只需要2–3年<\/strong>。你入学时（2026）的紧缺方向，到你硕士毕业时（2031–2033）未必仍紧缺。这是本报告反复强调”不预设方向、保持迁移能力”的原因之一。<\/p>", "text": "【行业分析，基于智联报告与招聘平台结构数据】缺口明确的方向：机器人/具身智能算法（智联：2025年前5个月机器人产业招聘职位数同比+409%、求职+396%，需求增速仍高于供给增速）；AI编译器/推理系统（结构性短缺，见前文）；模型压缩部署（端侧LLM浪潮直接拉动）；NPU/AI芯片设计（国产替代+上市公司扩编）。趋于拥挤的方向：通用CV算法（安防红利期已过，供给远大于需求）；纯调参/调API的大模型应用岗（门槛快速下降，2024–2026年供给爆炸）；传统嵌入式（岗位量大但薪资天花板低，且受消费电子周期影响）。数据缺口警示：智联报告同时显示人形机器人领域求职者同比+396%——一个赛道从”缺人”到”内卷”可能只需要2–3年。你入学时（2026）的紧缺方向，到你硕士毕业时（2031–2033）未必仍紧缺。这是本报告反复强调”不预设方向、保持迁移能力”的原因之一。", "n": 386}, {"id": "c32", "vol": 1, "part": "第七部分 AI 替代性检验（针对六个子方向）", "title": "第七部分 AI 替代性检验（针对六个子方向）", "page": 23, "kind": "part", "html": "<p><span class=\"dim\">本章不做安慰性结论。判断标准：该岗位的工作内容中，有多大比例是”可被AI编码/AI设计工具自动化的例行性任务”，以及该方向的<\/span><strong>就业人数<\/strong><span class=\"dim\">是否会被AI效率提升直接压缩。<\/span><\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>子方向<\/strong><\/th><th><strong>替代风险评估<\/strong><\/th><th><strong>理由<\/strong>（<strong><span class=\"tag an\">行业分析<\/span><\/strong>，<strong>基于任务结构判断<\/strong>）<\/th><\/tr><\/thead><tbody><tr><td>A. TinyML / MCU端智能<\/td><td><strong>中低<\/strong><\/td><td>工作高度物理耦合：硬件调试、功耗测量、传感器标定、现场部署——AI无法替你去实验室焊板子、抓波形。风险在于岗位总量小，而非被替代<\/td><\/tr><tr><td>B. 手机/嵌入式AI<\/td><td><strong>中<\/strong><\/td><td>上层”调用SDK部署模型”的工作正被自动化工具链压缩（Edge Impulse、AI Hub等已半自动化）；但SoC级联调、功耗优化、NPU算子适配仍需深厚经验。越靠近芯片越安全<\/td><\/tr><tr><td>C. 端侧LLM/推理引擎<\/td><td><strong>中低<\/strong><\/td><td>推理引擎开发涉及底层内核手写与硬件特性适配，AI辅助能提效但难以独立交付；该领域专家是AI工具的”制造者”而非”被替代者”。但注意：纯”模型部署工程师”（拿现成模型转格式）是其中最容易被自动化的<\/td><\/tr><tr><td>D. 模型压缩与加速<\/td><td><strong>中低<\/strong><\/td><td>研究性强，需要设计新量化方案、写论文、做消融实验——是AI研究的”卖水人”。风险：AutoML与自动化压缩工具在蚕食低端工作<\/td><\/tr><tr><td>E. 推理系统 / AI编译器<\/td><td><strong>低<\/strong><\/td><td>编译器是全行业公认的AI最难替代领域之一：需要形式化正确性、跨层全局优化、对未流片硬件的前瞻适配。供给稀缺+AI工具的产出本身需要编译器专家把关<\/td><\/tr><tr><td>F. AI芯片设计<\/td><td><strong>低到中<\/strong><\/td><td>前端设计已有AI辅助（如AI生成Verilog的学术与工业尝试），但验证、物理实现、架构权衡仍高度依赖人。真正的风险不是”被AI替代”而是<strong>行业周期与公司倒闭<\/strong>（参考寒武纪边缘线的萎缩——业务线消失比工具替代更致命）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>给你的三条诚实结论<\/strong>：<\/p>\n<p>1. <strong>“AI替代性低”是一个梯度而非开关<\/strong>。六个方向中，越靠近”物理世界+底层系统+形式化正确性”的位置越安全；越靠近”调用现成工具做集成”的位置越危险。你希望的”软件+硬件/物理世界结合”恰好落在相对安全的区间——这不是迎合，是任务结构的客观分布。<\/p>\n<p>2. <strong>比”被AI替代”更现实的风险是”赛道消失”<\/strong>。寒武纪边缘产品线收入萎缩至339万元、传统CV岗位内卷，都是<strong>需求侧<\/strong>的消失，与AI替代无关。抗风险的方法是选择”可迁移的底层能力”（系统、编译、体系结构），而非绑定单一应用场景。<\/p>\n<p>3. <strong>任何方向都不能躺平<\/strong>。上述”低风险”全部有一个前提：你做到该方向的中上水平。低水平的编译器工程师同样会被淘汰——方向只能决定风险的下限，不能替代个人能力的上限。<\/p>", "text": "本章不做安慰性结论。判断标准：该岗位的工作内容中，有多大比例是”可被AI编码/AI设计工具自动化的例行性任务”，以及该方向的就业人数是否会被AI效率提升直接压缩。子方向替代风险评估理由（【行业分析】，基于任务结构判断）A.TinyML/MCU端智能中低工作高度物理耦合：硬件调试、功耗测量、传感器标定、现场部署——AI无法替你去实验室焊板子、抓波形。风险在于岗位总量小，而非被替代B.手机/嵌入式AI中上层”调用SDK部署模型”的工作正被自动化工具链压缩（EdgeImpulse、AIHub等已半自动化）；但SoC级联调、功耗优化、NPU算子适配仍需深厚经验。越靠近芯片越安全C.端侧LLM/推理引擎中低推理引擎开发涉及底层内核手写与硬件特性适配，AI辅助能提效但难以独立交付；该领域专家是AI工具的”制造者”而非”被替代者”。但注意：纯”模型部署工程师”（拿现成模型转格式）是其中最容易被自动化的D.模型压缩与加速中低研究性强，需要设计新量化方案、写论文、做消融实验——是AI研究的”卖水人”。风险：AutoML与自动化压缩工具在蚕食低端工作E.推理系统/AI编译器低编译器是全行业公认的AI最难替代领域之一：需要形式化正确性、跨层全局优化、对未流片硬件的前瞻适配。供给稀缺+AI工具的产出本身需要编译器专家把关F.AI芯片设计低到中前端设计已有AI辅助（如AI生成Verilog的学术与工业尝试），但验证、物理实现、架构权衡仍高度依赖人。真正的风险不是”被AI替代”而是行业周期与公司倒闭（参考寒武纪边缘线的萎缩——业务线消失比工具替代更致命）给你的三条诚实结论：1.“AI替代性低”是一个梯度而非开关。六个方向中，越靠近”物理世界+底层系统+形式化正确性”的位置越安全；越靠近”调用现成工具做集成”的位置越危险。你希望的”软件+硬件/物理世界结合”恰好落在相对安全的区间——这不是迎合，是任务结构的客观分布。2.比”被AI替代”更现实的风险是”赛道消失”。寒武纪边缘产品线收入萎缩至339万元、传统CV岗位内卷，都是需求侧的消失，与AI替代无关。抗风险的方法是选择”可迁移的底层能力”（系统、编译、体系结构），而非绑定单一应用场景。3.任何方向都不能躺平。上述”低风险”全部有一个前提：你做到该方向的中上水平。低水平的编译器工程师同样会被淘汰——方向只能决定风险的下限，不能替代个人能力的上限。", "n": 1000}, {"id": "c33", "vol": 1, "part": "第八部分 未来5–10年增长逻辑与风险", "title": "第八部分 未来5–10年增长逻辑与风险", "page": 25, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c34", "vol": 1, "part": "第八部分 未来5–10年增长逻辑与风险", "title": "8.1 增长引擎（按驱动力分类）", "page": 25, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>驱动力<\/strong><\/th><th><strong>内容【已证实/行业分析】<\/strong><\/th><th><strong>对应受益方向<\/strong><\/th><\/tr><\/thead><tbody><tr><td>推理成本下降<\/td><td>模型蒸馏+量化使7B级模型可在手机运行；DeepSeek类高效模型大幅降低端侧门槛（<span class=\"cite\">Canalys<\/span>）<\/td><td>端侧LLM、推理引擎、压缩<\/td><\/tr><tr><td>换机与准入标准<\/td><td>Copilot+ 40TOPS标准、中国AI PC渗透率2026年预计52%（Canalys）<\/td><td>手机/PC端AI、SoC<\/td><\/tr><tr><td>新终端形态<\/td><td>AI眼镜2025年出货+322%（Omdia）；人形机器人2026年预计5万台（TrendForce）<\/td><td>机器人端侧AI、VLM、传感器融合<\/td><\/tr><tr><td>数据合规<\/td><td>欧盟AI法案2026年8月对通用AI模型生效、并设”数字主权”条款（<span class=\"cite\">GMI<\/span>）；中国个保法<\/td><td>端侧推理整体<\/td><\/tr><tr><td>国产化<\/td><td>2025年中国AI加速卡国产份额约45%（IDC数据转引自<span class=\"cite\">上交所披露<\/span>）<\/td><td>AI芯片、编译器、软件栈<\/td><\/tr><tr><td>云端经济学<\/td><td>云端推理的规模化成本压力使”能端侧就端侧”成为终端厂商的财务理性（Counterpoint指出端侧AI可使OEM收入结构升级（<span class=\"cite\">Counterpoint<\/span>））<\/td><td>云边端协同<\/td><\/tr><\/tbody><\/table><\/div>", "text": "驱动力内容【已证实/行业分析】对应受益方向推理成本下降模型蒸馏+量化使7B级模型可在手机运行；DeepSeek类高效模型大幅降低端侧门槛（Canalys）端侧LLM、推理引擎、压缩换机与准入标准Copilot+40TOPS标准、中国AIPC渗透率2026年预计52%（Canalys）手机/PC端AI、SoC新终端形态AI眼镜2025年出货+322%（Omdia）；人形机器人2026年预计5万台（TrendForce）机器人端侧AI、VLM、传感器融合数据合规欧盟AI法案2026年8月对通用AI模型生效、并设”数字主权”条款（GMI）；中国个保法端侧推理整体国产化2025年中国AI加速卡国产份额约45%（IDC数据转引自上交所披露）AI芯片、编译器、软件栈云端经济学云端推理的规模化成本压力使”能端侧就端侧”成为终端厂商的财务理性（Counterpoint指出端侧AI可使OEM收入结构升级（Counterpoint））云边端协同", "n": 418}, {"id": "c35", "vol": 1, "part": "第八部分 未来5–10年增长逻辑与风险", "title": "8.2 技术驱动力", "page": 25, "kind": "sec", "html": "<p>内存带宽瓶颈的缓解路径（更大带宽LPDDR6、存内计算、KV Cache压缩、稀疏化、MoE条件计算）每一步都在扩大”可端侧部署的模型尺寸上限”<span class=\"tag an\">行业分析<\/span>。这意味着<strong>端侧能力天花板在持续上移<\/strong>——今天需要云端的中等模型，3年后可能就是端侧模型。这对从业者既是机会（新场景不断打开）也是挑战（技能需要持续更新）。<\/p>", "text": "内存带宽瓶颈的缓解路径（更大带宽LPDDR6、存内计算、KVCache压缩、稀疏化、MoE条件计算）每一步都在扩大”可端侧部署的模型尺寸上限”【行业分析】。这意味着端侧能力天花板在持续上移——今天需要云端的中等模型，3年后可能就是端侧模型。这对从业者既是机会（新场景不断打开）也是挑战（技能需要持续更新）。", "n": 153}, {"id": "c36", "vol": 1, "part": "第八部分 未来5–10年增长逻辑与风险", "title": "8.3 风险分析【行业分析】", "page": 25, "kind": "sec", "html": "<p>1. <strong>云端推理的反击<\/strong>：如果云端API价格下降速度超过端侧硬件进步速度（2024–2026年的实际趋势正是API价格暴跌），“端侧必须性”会被削弱——大量场景会停留在云端。这是端侧叙事最大的敌人。<\/p>\n<p>2. <strong>专用NPU被通用GPU吞噬<\/strong>：历史反复上演（GPU吃掉物理加速卡、CPU集成显卡吃掉低端独显）。若手机GPU+软件栈足以跑端侧LLM，独立NPU的价值主张会收窄。<\/p>\n<p>3. <strong>机器人量产不及预期<\/strong>：人形机器人当前订单多为试点性质（科研、展厅、半结构化工厂），若2030年前无法进入家庭或大规模商用，相关岗位需求会剧烈回调。<\/p>\n<p>4. <strong>AI工具对初级岗位的压缩<\/strong>：初级”模型部署”“嵌入式应用”岗的工作正被自动化，入行门槛在抬高——<strong>这对2026年入学的你反而是好消息<\/strong>：你毕业时（2030+）该过程已基本完成，市场要求的起点能力会更清晰。<\/p>\n<p>5. <strong>地缘政治与制程限制<\/strong>：先进制程获取受限会约束国产端侧芯片的算力上限，可能迫使中国路线更倚重”模型-系统协同优化”而非算力堆叠——<strong>这反而利好压缩/编译/系统方向的人才需求<\/strong><span class=\"tag an\">行业分析<\/span>。<\/p>", "text": "1.云端推理的反击：如果云端API价格下降速度超过端侧硬件进步速度（2024–2026年的实际趋势正是API价格暴跌），“端侧必须性”会被削弱——大量场景会停留在云端。这是端侧叙事最大的敌人。2.专用NPU被通用GPU吞噬：历史反复上演（GPU吃掉物理加速卡、CPU集成显卡吃掉低端独显）。若手机GPU+软件栈足以跑端侧LLM，独立NPU的价值主张会收窄。3.机器人量产不及预期：人形机器人当前订单多为试点性质（科研、展厅、半结构化工厂），若2030年前无法进入家庭或大规模商用，相关岗位需求会剧烈回调。4.AI工具对初级岗位的压缩：初级”模型部署”“嵌入式应用”岗的工作正被自动化，入行门槛在抬高——这对2026年入学的你反而是好消息：你毕业时（2030+）该过程已基本完成，市场要求的起点能力会更清晰。5.地缘政治与制程限制：先进制程获取受限会约束国产端侧芯片的算力上限，可能迫使中国路线更倚重”模型-系统协同优化”而非算力堆叠——这反而利好压缩/编译/系统方向的人才需求【行业分析】。", "n": 445}, {"id": "c37", "vol": 1, "part": "第八部分 未来5–10年增长逻辑与风险", "title": "8.4 个人机会窗口", "page": 26, "kind": "sec", "html": "<p><strong>为什么2026年入学是较好的时点<span class=\"tag an\">行业分析<\/span><\/strong>：①产业处于”硬件就绪、软件生态与人才供给滞后”的窗口期——编译器、推理系统、软硬协同人才缺口明确；②你的培养周期（本科4年+硕士3年）正好覆盖2026–2033年，即端侧LLM、AI眼镜、机器人从小众走向主流的关键放量期；③AI编程工具的普及使”个人完成软硬全栈项目”的成本大幅下降，学生项目的上限被显著抬高。<strong>但窗口期不等于确定性<\/strong>——8.3的任何一条风险兑现，都会重排方向优先级。保持底层能力的可迁移性，是穿越窗口期的唯一可靠策略。<\/p>", "text": "为什么2026年入学是较好的时点【行业分析】：①产业处于”硬件就绪、软件生态与人才供给滞后”的窗口期——编译器、推理系统、软硬协同人才缺口明确；②你的培养周期（本科4年+硕士3年）正好覆盖2026–2033年，即端侧LLM、AI眼镜、机器人从小众走向主流的关键放量期；③AI编程工具的普及使”个人完成软硬全栈项目”的成本大幅下降，学生项目的上限被显著抬高。但窗口期不等于确定性——8.3的任何一条风险兑现，都会重排方向优先级。保持底层能力的可迁移性，是穿越窗口期的唯一可靠策略。", "n": 239}, {"id": "c38", "vol": 1, "part": "第九部分 浙江大学重点调查", "title": "第九部分 浙江大学重点调查", "page": 26, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c39", "vol": 1, "part": "第九部分 浙江大学重点调查", "title": "9.1 为什么锁定浙大", "page": 26, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>浙大于2019年设立全国首批35个人工智能本科专业之一（<span class=\"cite\">浙大计算机学院<\/span>）；其人工智能研究始于1978年计算机系建系、1982年创建人工智能研究室（<span class=\"cite\">软科引述<\/span>）。更重要的是与你的路线匹配：<strong>杭州同时具备端侧AI企业生态（阿里/宇树/云深处/海康/大华/平头哥）与浙大学术资源<\/strong>，读研-实习-就业可在同城完成。<\/p>", "text": "【已证实】浙大于2019年设立全国首批35个人工智能本科专业之一（浙大计算机学院）；其人工智能研究始于1978年计算机系建系、1982年创建人工智能研究室（软科引述）。更重要的是与你的路线匹配：杭州同时具备端侧AI企业生态（阿里/宇树/云深处/海康/大华/平头哥）与浙大学术资源，读研-实习-就业可在同城完成。", "n": 155}, {"id": "c40", "vol": 1, "part": "第九部分 浙江大学重点调查", "title": "9.2 信息与电子工程学院", "page": 26, "kind": "sec", "html": "<p>以下三个团队均经浙大官方个人主页/团队主页逐一核验（2026年10月检索）：<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>团队<\/strong><\/th><th><strong>教师<\/strong><\/th><th><strong>方向【已证实<\/strong>，<strong>来自官方主页】<\/strong><\/th><th><strong>与Edge AI的关联<\/strong><\/th><th><strong>官方来源<\/strong><\/th><\/tr><\/thead><tbody><tr><td>尹勋钊课题组<\/td><td>尹勋钊（百人计划研究员、博导）<\/td><td>人工智能、存算一体技术、新型计算专用芯片设计、<strong>软硬件跨层协同设计优化<\/strong>、组合优化求解器、具身智能/大语言模型软硬件协同；代表作：首个基于铁电存算一体芯片的组合优化求解器（Nature Communications 2024）<\/td><td><strong>软硬协同设计（F方向）直接对口<\/strong>，且覆盖具身智能<\/td><td><span class=\"cite\">浙大个人主页<\/span>、<span class=\"cite\">信电学院成果报道<\/span><\/td><\/tr><tr><td>赵亮课题组<\/td><td>赵亮（百人计划研究员、信通系副系主任，斯坦福博士）<\/td><td>先进存储器（RRAM/MRAM/铁电）、<strong>存内计算与类脑计算芯片架构与电路设计<\/strong>；主页明示”课题组长期招收硕士、博士研究生”<\/td><td>存算一体/AI芯片（F方向）对口<\/td><td><span class=\"cite\">浙大个人主页<\/span><\/td><\/tr><tr><td>黄科杰课题组<\/td><td>黄科杰（长聘副教授、博导）<\/td><td>低功耗存算处理器、深度学习与硬件加速、FPGA硬件架构、光电耦合计算；团队主页明示欢迎对深度学习加速/存内计算/AI算法有兴趣的同学联系<\/td><td>深度学习加速器、FPGA（F/B方向）对口<\/td><td><span class=\"cite\">团队主页<\/span>、<span class=\"cite\">浙大个人主页<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong><span class=\"tag an\">行业分析<\/span><\/strong>信电学院这三组的共同点是<strong>“存算一体+软硬协同”<\/strong>——恰好对应本报告F方向（AI芯片软硬协同），且尹勋钊主页研究方向中明确列有”具身智能、大语言模型软硬件协同”，与C/E方向也有交集。另有两名教师（赵昱达：类视觉感知器件与感存算一体；程然：存算一体器件和芯片）在二手资料中出现且方向匹配，但本次未能打开其官方主页逐字核验，列为<span class=\"tag nv\">待核实<\/span>（核验路径：信电学院官网导师名录 → 个人主页）。<strong>仍需强调：招生名额与当年是否接收推免生，必须在报考当年以官方通知和直接邮件确认为准。<\/strong><\/p>", "text": "以下三个团队均经浙大官方个人主页/团队主页逐一核验（2026年10月检索）：团队教师方向【已证实，来自官方主页】与EdgeAI的关联官方来源尹勋钊课题组尹勋钊（百人计划研究员、博导）人工智能、存算一体技术、新型计算专用芯片设计、软硬件跨层协同设计优化、组合优化求解器、具身智能/大语言模型软硬件协同；代表作：首个基于铁电存算一体芯片的组合优化求解器（NatureCommunications2024）软硬协同设计（F方向）直接对口，且覆盖具身智能浙大个人主页、信电学院成果报道赵亮课题组赵亮（百人计划研究员、信通系副系主任，斯坦福博士）先进存储器（RRAM/MRAM/铁电）、存内计算与类脑计算芯片架构与电路设计；主页明示”课题组长期招收硕士、博士研究生”存算一体/AI芯片（F方向）对口浙大个人主页黄科杰课题组黄科杰（长聘副教授、博导）低功耗存算处理器、深度学习与硬件加速、FPGA硬件架构、光电耦合计算；团队主页明示欢迎对深度学习加速/存内计算/AI算法有兴趣的同学联系深度学习加速器、FPGA（F/B方向）对口团队主页、浙大个人主页【行业分析】信电学院这三组的共同点是“存算一体+软硬协同”——恰好对应本报告F方向（AI芯片软硬协同），且尹勋钊主页研究方向中明确列有”具身智能、大语言模型软硬件协同”，与C/E方向也有交集。另有两名教师（赵昱达：类视觉感知器件与感存算一体；程然：存算一体器件和芯片）在二手资料中出现且方向匹配，但本次未能打开其官方主页逐字核验，列为【待核实】（核验路径：信电学院官网导师名录→个人主页）。仍需强调：招生名额与当年是否接收推免生，必须在报考当年以官方通知和直接邮件确认为准。", "n": 706}, {"id": "c41", "vol": 1, "part": "第九部分 浙江大学重点调查", "title": "9.3 计算机科学与技术学院（确认存在的相关方向）", "page": 27, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>实验室/团队<\/strong><\/th><th><strong>教师<\/strong><\/th><th><strong>方向【已证实<\/strong>，<strong>来自官方页面】<\/strong><\/th><th><strong>与Edge AI的关联<\/strong><\/th><th><strong>官方来源<\/strong><\/th><\/tr><\/thead><tbody><tr><td>ARCLab<\/td><td>陈文智<\/td><td>系统软件、体系结构、AI System、大模型系统<\/td><td>推理系统/系统层核心对口<\/td><td><span class=\"cite\">arclab.cn<\/span><\/td><\/tr><tr><td>EmNets实验室<\/td><td>董玮、高艺<\/td><td>物联网系统、边缘智能<\/td><td>端侧/嵌入式AI直接对口<\/td><td><span class=\"cite\">浙江大学个人主页<\/span>、<span class=\"cite\">EmNets组介绍<\/span><\/td><\/tr><tr><td>RC4ML实验室<\/td><td>王则可（百人计划研究员）<\/td><td>异构硬件（FPGA/GPU/P4/SSD）与AI系统协同设计、<strong>大模型训练系统<\/strong>、推荐大模型推理优化；实验室页面明示长期招收本科生、实习生<\/td><td>AI系统/软硬协同（E/F交叉）对口；毕业生去向含阿里星、腾讯青云等<\/td><td><span class=\"cite\">浙大计算机学院介绍<\/span><\/td><\/tr><tr><td>智能存算系统实验室<\/td><td>孙贤和（求是讲座教授，IEEE Fellow）、何水兵（长聘教授，之江实验室副主任）<\/td><td>智能计算、并行与分布式计算、<strong>存算一体<\/strong>、非易失性内存、大模型存储系统<\/td><td>存算系统/体系结构（E/F交叉）对口<\/td><td><span class=\"cite\">计算机学院科研团队介绍<\/span><\/td><\/tr><tr><td>智能感知与检测研究所<\/td><td>史治国等<\/td><td>边缘计算、智能感知、自主系统<\/td><td>嵌入式视觉/感知对口<\/td><td><span class=\"cite\">iiee.zju.edu.cn<\/span><\/td><\/tr><\/tbody><\/table><\/div>", "text": "实验室/团队教师方向【已证实，来自官方页面】与EdgeAI的关联官方来源ARCLab陈文智系统软件、体系结构、AISystem、大模型系统推理系统/系统层核心对口arclab.cnEmNets实验室董玮、高艺物联网系统、边缘智能端侧/嵌入式AI直接对口浙江大学个人主页、EmNets组介绍RC4ML实验室王则可（百人计划研究员）异构硬件（FPGA/GPU/P4/SSD）与AI系统协同设计、大模型训练系统、推荐大模型推理优化；实验室页面明示长期招收本科生、实习生AI系统/软硬协同（E/F交叉）对口；毕业生去向含阿里星、腾讯青云等浙大计算机学院介绍智能存算系统实验室孙贤和（求是讲座教授，IEEEFellow）、何水兵（长聘教授，之江实验室副主任）智能计算、并行与分布式计算、存算一体、非易失性内存、大模型存储系统存算系统/体系结构（E/F交叉）对口计算机学院科研团队介绍智能感知与检测研究所史治国等边缘计算、智能感知、自主系统嵌入式视觉/感知对口iiee.zju.edu.cn", "n": 439}, {"id": "c42", "vol": 1, "part": "第九部分 浙江大学重点调查", "title": "9.4 微纳电子学院", "page": 28, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>团队<\/strong><\/th><th><strong>教师<\/strong><\/th><th><strong>方向<\/strong><\/th><th><strong>关联<\/strong><\/th><th><strong>来源<\/strong><\/th><\/tr><\/thead><tbody><tr><td>微纳电子前沿技术研究所<\/td><td>俞滨、徐杨、徐明生<\/td><td>类脑计算、后摩尔器件、感存算一体<span class=\"tag ok\">已证实<\/span><\/td><td>AI芯片/感算一体直接对口<\/td><td><span class=\"cite\">微纳电子学院<\/span>（团队页面）<\/td><\/tr><\/tbody><\/table><\/div>", "text": "团队教师方向关联来源微纳电子前沿技术研究所俞滨、徐杨、徐明生类脑计算、后摩尔器件、感存算一体【已证实】AI芯片/感算一体直接对口微纳电子学院（团队页面）", "n": 76}, {"id": "c43", "vol": 1, "part": "第九部分 浙江大学重点调查", "title": "9.5 软件学院", "page": 28, "kind": "sec", "html": "<p><span class=\"tag ok\">已证实<\/span>彭思达团队（三维视觉与图形，浙大软件学院个人主页列明 NeRF/3DGS 方向（<span class=\"cite\">彭思达主页<\/span>））——属于”端侧视觉内容生成”的上游算法，与边缘渲染/AI眼镜显示链路相关，但非严格意义的端侧推理。列入供视野参考。<\/p>", "text": "【已证实】彭思达团队（三维视觉与图形，浙大软件学院个人主页列明NeRF/3DGS方向（彭思达主页））——属于”端侧视觉内容生成”的上游算法，与边缘渲染/AI眼镜显示链路相关，但非严格意义的端侧推理。列入供视野参考。", "n": 107}, {"id": "c44", "vol": 1, "part": "第九部分 浙江大学重点调查", "title": "9.6 保研与考研的现实路径", "page": 28, "kind": "sec", "html": "<p>【行业分析，不编造录取数字】<\/p>\n<p><strong>保研<\/strong>：浙大计算机/信电类保研竞争激烈，通常要求深大专业排名前若干名+科研经历（论文/项目）+夏令营表现。深大计算机学科保研至浙大有先例（每年个位数，<span class=\"tag nv\">待核实<\/span>具体名额），关键变量是<strong>大二下之前进入实验室并产出可验证成果<\/strong>。<\/p>\n<p><strong>考研<\/strong>：浙大计算机类初试为全国统考408（数据结构、计组、操作系统、计网）+数学一+英语一，复试重视项目与科研。这意味着<strong>本科前两年的408四门课学得扎实，本身就是考研准备<\/strong>，与科研路线不冲突。<\/p>\n<p><strong>专项通道<\/strong>：关注浙大工程师学院、浙江大学-企业联合培养项目，以及”浙江大学×达摩院具身智能训练营”类校企项目（优秀学员直推实习（<span class=\"cite\">浙大控制学院通知<\/span>）<span class=\"tag ok\">已证实<\/span>）——这类项目是低成本接触浙大导师与杭州企业的”跳板”。<\/p>", "text": "【行业分析，不编造录取数字】保研：浙大计算机/信电类保研竞争激烈，通常要求深大专业排名前若干名+科研经历（论文/项目）+夏令营表现。深大计算机学科保研至浙大有先例（每年个位数，【待核实】具体名额），关键变量是大二下之前进入实验室并产出可验证成果。考研：浙大计算机类初试为全国统考408（数据结构、计组、操作系统、计网）+数学一+英语一，复试重视项目与科研。这意味着本科前两年的408四门课学得扎实，本身就是考研准备，与科研路线不冲突。专项通道：关注浙大工程师学院、浙江大学-企业联合培养项目，以及”浙江大学×达摩院具身智能训练营”类校企项目（优秀学员直推实习（浙大控制学院通知）【已证实】）——这类项目是低成本接触浙大导师与杭州企业的”跳板”。", "n": 322}, {"id": "c45", "vol": 1, "part": "第十部分 国内其他高校与科研院所（不排名，列资源）", "title": "第十部分 国内其他高校与科研院所（不排名，列资源）", "page": 29, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c46", "vol": 1, "part": "第十部分 国内其他高校与科研院所（不排名，列资源）", "title": "10.0 深圳大学本校资源详查（大一进组的现实起点）", "page": 29, "kind": "sec", "html": "<p><strong>为什么这一节最重要<\/strong>：保研浙大的筹码（论文、项目、导师推荐信）几乎全部要在深大本校产出。以下全部经深大官方页面核验（2026年10月）：<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th><strong>团队/教师<\/strong><\/th><th><strong>学院<\/strong><\/th><th><strong>方向【已证实<\/strong>，<strong>来自深大官方页面】<\/strong><\/th><th><strong>对口本报告方向<\/strong><\/th><th><strong>本科生接触渠道<\/strong><\/th><\/tr><\/thead><tbody><tr><td>王毅课题组<\/td><td>计算机与软件学院<\/td><td>计算机体系结构、<strong>存算一体架构<\/strong>、智能芯片与智能计算系统、实时及嵌入式系统；王毅为CCF体系结构专委会秘书长（2024–2027）、CCF杰出会员，CCF-A类论文49篇<\/td><td><strong>E（推理系统/编译器）+ F（芯片架构）双重对口，本校该方向最强资源<\/strong><\/td><td><span class=\"cite\">课题组主页<\/span>；是否接收本科生进组需直接邮件询问<span class=\"tag nv\">待核实<\/span><\/td><\/tr><tr><td>毕宿志课题组<\/td><td>电子与信息工程学院<\/td><td>智能边缘计算、边缘任务卸载、边缘机器学习、无线边缘智能网络；国家级青年人才，IEEE TWC/WCL编委<\/td><td>边缘智能偏<strong>通信理论侧<\/strong>（非端侧部署工程）；注意：<strong>毕宿志本人即浙大竺可桢学院本科出身<\/strong>——对”深大→浙大”路线有天然的母校联系<\/td><td><span class=\"cite\">课题组主页<\/span>、<span class=\"cite\">学院官方页<\/span>；主页明示每年2–3个硕士名额、1–2个博士名额<span class=\"tag ok\">已证实<\/span><\/td><\/tr><tr><td>吕子玉课题组<\/td><td>电子与信息工程学院（微电子方向）<\/td><td>忆阻器及神经形态芯片、<strong>感存算一体化器件及应用<\/strong>、可重构光控神经网络<\/td><td>F方向器件级对口（偏物理/器件，工程化程度低于体系结构组）<\/td><td><span class=\"cite\">学院官方页<\/span>；本科生接收情况<span class=\"tag nv\">待核实<\/span><\/td><\/tr><tr><td>田宜彬课题组<\/td><td>机电与控制工程学院<\/td><td>3D机器视觉、机器人定位引导与导航、<strong>多模式感知融合与多智能体机器人系统<\/strong>（硅谷11年产业背景，2025年在招研究助理要求ROS/深度学习/C++）<\/td><td>机器人端侧AI对口<\/td><td><span class=\"cite\">招聘信息页<\/span><\/td><\/tr><tr><td>广东省电磁控制与智能机器人重点实验室<\/td><td>机电与控制工程学院<\/td><td>电磁控制、智能机器人（校级省重点实验室平台）<\/td><td>机器人硬件/控制侧<\/td><td><span class=\"cite\">实验室官网<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>重要更正<\/strong>：此前检索中出现的”韩素婷教授（忆阻器/存算一体）“已<strong>调任香港理工大学<\/strong>（应用生物及化学科技学系副教授，2024年11月起以港理工身份招生（<span class=\"cite\">港理工团队招生信息<\/span>））<span class=\"tag ok\">已证实<\/span>——她不再是深大的可用资源，但吕子玉课题组（她原团队成员）仍在深大延续感存算方向。<\/p>\n<p><strong>进组的制度渠道<span class=\"tag ok\">已证实<\/span><\/strong>：①深大有”院士领航科创训练营”，本科生可进入院士团队做科研，且<strong>训练营内设30%推免指标<\/strong>（<span class=\"cite\">头条报道引述深大党委书记李清泉<\/span>）；②全国大学生创新创业训练计划（大创）与师生共创训练营（<span class=\"cite\">深大创新创业教育中心<\/span>）；③最直接的渠道永远是：读一位教师近3年论文 → 带着一个能跑的小实验（如第十四部分的ESP32项目）发邮件自荐——<strong>本科生进组没有统一公开招聘，靠主动敲门<\/strong><span class=\"tag an\">行业分析<\/span>。<\/p>", "text": "为什么这一节最重要：保研浙大的筹码（论文、项目、导师推荐信）几乎全部要在深大本校产出。以下全部经深大官方页面核验（2026年10月）：团队/教师学院方向【已证实，来自深大官方页面】对口本报告方向本科生接触渠道王毅课题组计算机与软件学院计算机体系结构、存算一体架构、智能芯片与智能计算系统、实时及嵌入式系统；王毅为CCF体系结构专委会秘书长（2024–2027）、CCF杰出会员，CCF-A类论文49篇E（推理系统/编译器）+F（芯片架构）双重对口，本校该方向最强资源课题组主页；是否接收本科生进组需直接邮件询问【待核实】毕宿志课题组电子与信息工程学院智能边缘计算、边缘任务卸载、边缘机器学习、无线边缘智能网络；国家级青年人才，IEEETWC/WCL编委边缘智能偏通信理论侧（非端侧部署工程）；注意：毕宿志本人即浙大竺可桢学院本科出身——对”深大→浙大”路线有天然的母校联系课题组主页、学院官方页；主页明示每年2–3个硕士名额、1–2个博士名额【已证实】吕子玉课题组电子与信息工程学院（微电子方向）忆阻器及神经形态芯片、感存算一体化器件及应用、可重构光控神经网络F方向器件级对口（偏物理/器件，工程化程度低于体系结构组）学院官方页；本科生接收情况【待核实】田宜彬课题组机电与控制工程学院3D机器视觉、机器人定位引导与导航、多模式感知融合与多智能体机器人系统（硅谷11年产业背景，2025年在招研究助理要求ROS/深度学习/C++）机器人端侧AI对口招聘信息页广东省电磁控制与智能机器人重点实验室机电与控制工程学院电磁控制、智能机器人（校级省重点实验室平台）机器人硬件/控制侧实验室官网重要更正：此前检索中出现的”韩素婷教授（忆阻器/存算一体）“已调任香港理工大学（应用生物及化学科技学系副教授，2024年11月起以港理工身份招生（港理工团队招生信息））【已证实】——她不再是深大的可用资源，但吕子玉课题组（她原团队成员）仍在深大延续感存算方向。进组的制度渠道【已证实】：①深大有”院士领航科创训练营”，本科生可进入院士团队做科研，且训练营内设30%推免指标（头条报道引述深大党委书记李清泉）；②全国大学生创新创业训练计划（大创）与师生共创训练营（深大创新创业教育中心）；③最直接的渠道永远是：读一位教师近3年论文→带着一个能跑的小实验（如第十四部分的ESP32项目）发邮件自荐——本科生进组没有统一公开招聘，靠主动敲门【行业分析】。", "n": 1015}, {"id": "c47", "vol": 1, "part": "第十部分 国内其他高校与科研院所（不排名，列资源）", "title": "10.1 国内高校与院所（按与你的方向相关性列出，非优劣排序）", "page": 30, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>单位<\/strong><\/th><th><strong>相关团队/资源<span class=\"tag ok\">已证实<\/span><\/strong><\/th><th><strong>方向标签<\/strong><\/th><\/tr><\/thead><tbody><tr><td>清华大学<\/td><td>电子系 NICS-EFC 实验室（汪玉教授团队，高能效电路与系统、软硬协同，<span class=\"cite\">官网<\/span>）<\/td><td>AI芯片、模型压缩、编译<\/td><\/tr><tr><td>中科院计算所<\/td><td>智能处理器研究中心（陈云霁团队，寒武纪芯片的学术源头）<\/td><td>AI芯片架构<\/td><\/tr><tr><td>上海交大<\/td><td>计算机学院若干体系结构/并行计算团队（[待核实]具体导师与方向，核验路径：cs.sjtu.edu.cn导师名录）<\/td><td>系统、编译<\/td><\/tr><tr><td>中科院深圳先进院（SIAT）<\/td><td>位于深圳南山，与深大同城；数字所/集成所多团队做机器人、边缘计算（[待核实]具体招生导师，核验路径：siat.ac.cn）——<strong>对深大学生有特殊优势：可提前去做客座学生/毕设<\/strong><\/td><td>机器人、边缘计算<\/td><\/tr><tr><td>广东省存算一体芯片重点实验室<\/td><td>依托<strong>北京大学深圳研究生院<\/strong>（深圳大学城，与深大同属南山），聚焦存算一体芯片器件—架构—应用全链条，成果发表于 Nature Electronics、ISSCC、IEDM 等；设有年度开放课题；深大电子与信息工程学院执行院长黄磊任其学术委员会委员（<span class=\"cite\">北大深研院官方通知<\/span>）<span class=\"tag ok\">已证实<\/span>——<strong>同城可触达的存算一体顶级平台<\/strong><\/td><td>AI芯片、存算一体<\/td><\/tr><tr><td>深圳大学本校<\/td><td><strong>本校资源详见10.0节<\/strong>——王毅（体系结构/存算一体）、毕宿志（智能边缘计算）、吕子玉（感存算器件）、田宜彬（机器人多模态感知）均已核验。大一进组的最现实起点就在本校<\/td><td>系统、边缘、芯片、机器人<\/td><\/tr><tr><td>南方科技大学<\/td><td>电子系/计算机系有边缘智能、机器人方向团队（[待核实]具体导师）——同城优势同上<\/td><td>边缘智能<\/td><\/tr><tr><td>香港高校（港中大/港科大）<\/td><td>多媒体实验室、机器人研究所等；MPhil/PhD体系，奖学金覆盖，深圳通勤可达<\/td><td>视觉、机器人<\/td><\/tr><tr><td>北邮/东南/成电<\/td><td>通信电子强校，嵌入式与边缘计算方向均有布局（[待核实]具体导师）<\/td><td>嵌入式、边缘<\/td><\/tr><\/tbody><\/table><\/div>", "text": "单位相关团队/资源【已证实】方向标签清华大学电子系NICS-EFC实验室（汪玉教授团队，高能效电路与系统、软硬协同，官网）AI芯片、模型压缩、编译中科院计算所智能处理器研究中心（陈云霁团队，寒武纪芯片的学术源头）AI芯片架构上海交大计算机学院若干体系结构/并行计算团队（[待核实]具体导师与方向，核验路径：cs.sjtu.edu.cn导师名录）系统、编译中科院深圳先进院（SIAT）位于深圳南山，与深大同城；数字所/集成所多团队做机器人、边缘计算（[待核实]具体招生导师，核验路径：siat.ac.cn）——对深大学生有特殊优势：可提前去做客座学生/毕设机器人、边缘计算广东省存算一体芯片重点实验室依托北京大学深圳研究生院（深圳大学城，与深大同属南山），聚焦存算一体芯片器件—架构—应用全链条，成果发表于NatureElectronics、ISSCC、IEDM等；设有年度开放课题；深大电子与信息工程学院执行院长黄磊任其学术委员会委员（北大深研院官方通知）【已证实】——同城可触达的存算一体顶级平台AI芯片、存算一体深圳大学本校本校资源详见10.0节——王毅（体系结构/存算一体）、毕宿志（智能边缘计算）、吕子玉（感存算器件）、田宜彬（机器人多模态感知）均已核验。大一进组的最现实起点就在本校系统、边缘、芯片、机器人南方科技大学电子系/计算机系有边缘智能、机器人方向团队（[待核实]具体导师）——同城优势同上边缘智能香港高校（港中大/港科大）多媒体实验室、机器人研究所等；MPhil/PhD体系，奖学金覆盖，深圳通勤可达视觉、机器人北邮/东南/成电通信电子强校，嵌入式与边缘计算方向均有布局（[待核实]具体导师）嵌入式、边缘", "n": 712}, {"id": "c48", "vol": 1, "part": "第十部分 国内其他高校与科研院所（不排名，列资源）", "title": "10.2 本科阶段如何提前接触这些方向", "page": 31, "kind": "sec", "html": "<p><span class=\"tag an\">行业分析<\/span>对深大学生最现实的三条接触路径：①<strong>校内<\/strong>——先进深大相关实验室（微纳光电、物联网工程、嵌入式方向），把第一段科研做扎实，成果（论文/比赛/开源）是全国通用的敲门砖；②<strong>同城<\/strong>——中科院深圳先进院、南科大招收外校客座学生与暑期科研生，物理距离为零；③<strong>暑期学校/训练营<\/strong>——清华汪玉团队相关暑期活动、阿里/字节等企业的训练营、全国大学生系统能力大赛（编译系统设计赛正是E/F方向的练兵场）。<\/p>", "text": "【行业分析】对深大学生最现实的三条接触路径：①校内——先进深大相关实验室（微纳光电、物联网工程、嵌入式方向），把第一段科研做扎实，成果（论文/比赛/开源）是全国通用的敲门砖；②同城——中科院深圳先进院、南科大招收外校客座学生与暑期科研生，物理距离为零；③暑期学校/训练营——清华汪玉团队相关暑期活动、阿里/字节等企业的训练营、全国大学生系统能力大赛（编译系统设计赛正是E/F方向的练兵场）。", "n": 195}, {"id": "c49", "vol": 1, "part": "第十一部分 国际路线", "title": "第十一部分 国际路线", "page": 31, "kind": "part", "html": "", "text": "", "n": 0}, {"id": "c50", "vol": 1, "part": "第十一部分 国际路线", "title": "11.1 明确做 Edge AI 的海外实验室", "page": 31, "kind": "sec", "html": "<div class=\"tablewrap\"><table><thead><tr><th><strong>实验室<\/strong><\/th><th><strong>学校<\/strong><\/th><th><strong>导师/方向<span class=\"tag ok\">已证实<\/span><\/strong><\/th><\/tr><\/thead><tbody><tr><td>HAN Lab<\/td><td>MIT<\/td><td>Song Han（韩松）：高效深度学习、模型压缩、TinyML、端侧LLM（AWQ/SmoothQuant/StreamingLLM等大量该领域定义性工作）；开设公开课 <strong>6.5940 EfficientML<\/strong>（课程材料全网公开：<span class=\"cite\">efficientml.ai<\/span>）<\/td><\/tr><tr><td>SysML 方向若干组<\/td><td>CMU/Berkeley/UIUC<\/td><td>机器学习系统（MLSys）是北美近年增长最快的方向之一（[待核实]各校具体导师当年招生情况，核验路径：各校EECS官网+MLSys会议论文作者页）<\/td><\/tr><tr><td>嵌入式机器学习相关<\/td><td>TU Delft / ETH / EPFL<\/td><td>欧洲在MCU级ML、感算一体有传统优势（[待核实]具体组）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>一个低成本但高价值的动作<\/strong>：MIT 6.5940 EfficientML 的课程视频与slides公开，<strong>大二暑假即可自学<\/strong>——这是判断”自己是否真喜欢E/F方向”的最廉价试金石，也是未来申请时证明方向匹配度的硬材料。<\/p>", "text": "实验室学校导师/方向【已证实】HANLabMITSongHan（韩松）：高效深度学习、模型压缩、TinyML、端侧LLM（AWQ/SmoothQuant/StreamingLLM等大量该领域定义性工作）；开设公开课6.5940EfficientML（课程材料全网公开：efficientml.ai）SysML方向若干组CMU/Berkeley/UIUC机器学习系统（MLSys）是北美近年增长最快的方向之一（[待核实]各校具体导师当年招生情况，核验路径：各校EECS官网+MLSys会议论文作者页）嵌入式机器学习相关TUDelft/ETH/EPFL欧洲在MCU级ML、感算一体有传统优势（[待核实]具体组）一个低成本但高价值的动作：MIT6.5940EfficientML的课程视频与slides公开，大二暑假即可自学——这是判断”自己是否真喜欢E/F方向”的最廉价试金石，也是未来申请时证明方向匹配度的硬材料。", "n": 406}, {"id": "c51", "vol": 1, "part": "第十一部分 国际路线", "title": "11.2 本科阶段如何准备", "page": 32, "kind": "sec", "html": "<p><span class=\"tag an\">行业分析<\/span>①GPA是第一权重（尤其是数学与系统课）；②科研产出优先级高于课程数量——一篇MLSys/嵌入式顶会（SenSys/MobiCom/ISCA/MICRO/ASPLOS/MLSys）的挂名远胜三段水实习；③英语（托福/GRE）大三前解决；④注意政策面：近年部分国家对敏感技术领域（先进芯片、AI）的签证审查趋严，<strong>E/F方向（AI芯片/系统）恰好属于审查敏感区<\/strong>，需提前评估目的地政策风险【待核实：各国当年签证政策】。<\/p>", "text": "【行业分析】①GPA是第一权重（尤其是数学与系统课）；②科研产出优先级高于课程数量——一篇MLSys/嵌入式顶会（SenSys/MobiCom/ISCA/MICRO/A
